<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall - Modern Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. CSS VARIABLES & RESET
           ========================================= */
        :root {
            /* Dark Theme (Default) */
            --bg-primary: #0f0f11;
            --bg-secondary: #18181b;
            --bg-tertiary: #232328;
            --bg-glass: rgba(24, 24, 27, 0.85);
            --bg-input: #2a2a30;
            --accent-primary: #6366f1; /* Indigo */
            --accent-secondary: #818cf8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
            --online: #10b981;
            --offline: #4b5563;
            --danger: #ef4444;
            
            /* Sizing */
            --sidebar-width: 280px;
            --input-height: 60px;
            --transition-speed: 0.3s;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-input: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            transition: background-color var(--transition-speed) ease;
        }

        /* Background Decorative Elements */
        .bg-decoration {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
            transition: opacity var(--transition-speed);
        }
        .bg-decoration.one { top: -200px; left: -200px; background: var(--accent-primary); }
        .bg-decoration.two { bottom: -300px; right: -200px; background: #ec4899; }

        /* =========================================
           2. TYPOGRAPHY & SCROLLBAR
           ========================================= */
        h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* =========================================
           3. LOGIN SCREEN
           ========================================= */
        #login-screen {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: var(--radius-lg);
            text-align: center; 
            box-shadow: var(--shadow-glow), var(--shadow-soft);
            border: 1px solid var(--border-color);
            width: 90%; 
            max-width: 400px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            margin-bottom: 30px;
        }
        
        .logo-text { 
            font-size: 2.2rem; 
            font-weight: 700; 
            color: var(--text-primary);
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        
        .logo-sub { font-size: 0.9rem; color: var(--text-secondary); }

        .avatar-upload-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
        }

        .avatar-preview { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid var(--accent-primary); 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow-glow);
            background-color: var(--bg-tertiary);
        }

        .avatar-preview:hover { 
            transform: scale(1.05); 
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        
        .avatar-upload-container:hover .avatar-overlay { opacity: 1; }
        .avatar-overlay svg { width: 24px; height: 24px; fill: white; }

        .input-group { margin-bottom: 20px; position: relative; }
        
        #login-screen input[type="text"] { 
            width: 100%; 
            padding: 16px 20px; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border-color); 
            background: var(--bg-input); 
            color: var(--text-primary); 
            font-size: 1rem; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #login-screen input[type="text"]::placeholder { color: var(--text-muted); }
        #login-screen input[type="text"]:focus { 
            border-color: var(--accent-primary); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-primary { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            background: var(--accent-gradient); 
            color: white; 
            font-weight: 600; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:active { transform: translateY(0); }

        /* =========================================
           4. APP LAYOUT (GRID)
           ========================================= */
        #app-container { 
            display: none; 
            width: 100%; 
            height: 100%; 
            position: relative;
        }

        /* Flex container for Sidebar + Main */
        .app-layout {
            display: flex;
            height: 100%;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* =========================================
           5. SIDEBAR
           ========================================= */
        .sidebar { 
            width: var(--sidebar-width); 
            background: var(--bg-secondary); 
            border-right: 1px solid var(--border-color);
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
            transition: transform var(--transition-speed) ease;
            flex-shrink: 0;
        }

        .sidebar-header { 
            padding: 20px; 
            font-weight: 700; 
            font-size: 1.1rem;
            color: var(--text-primary); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 70px;
        }

        .sidebar-header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }
        .sidebar-header-actions button:hover { background: var(--bg-tertiary); }
        .sidebar-header-actions svg { width: 20px; height: 20px; fill: currentColor; }

        .search-box {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: var(--bg-input);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            font-size: 0.9rem;
        }
        .search-box input:focus { border-color: var(--accent-primary); }

        .user-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
        }

        .list-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 10px;
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .user-item { 
            padding: 10px 12px; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            color: var(--text-secondary); 
            display: flex; 
            align-items: center; 
            margin-bottom: 2px; 
            transition: background 0.15s, color 0.15s; 
        }

        .user-item:hover { 
            background: var(--bg-tertiary); 
            color: var(--text-primary); 
        }

        .user-item.active { 
            background: var(--accent-primary); 
            color: white; 
            box-shadow: var(--shadow-glow);
        }

        .user-avatar-wrapper {
            position: relative;
            margin-right: 12px;
        }

        .user-item img { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            object-fit: cover; 
            background: var(--bg-primary);
        }

        .user-info { flex: 1; overflow: hidden; }
        .user-info .name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .user-info .status-text { font-size: 0.75rem; color: var(--text-muted); }

        .status-indicator { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            border: 2px solid var(--bg-secondary);
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .status-online { background: var(--online); }
        .status-offline { background: var(--offline); }

        /* My Profile Footer */
        .my-profile {
            padding: 15px 20px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .my-profile:hover { background: var(--bg-input); }

        /* =========================================
           6. CHAT AREA
           ========================================= */
        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg-primary); 
            position: relative; 
            background-image: radial-gradient(circle at 50% 0%, var(--bg-secondary) 0%, transparent 60%);
        }

        .chat-header { 
            padding: 0 25px; 
            height: 70px;
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .chat-header-info { display: flex; align-items: center; gap: 15px; }
        .chat-header-info h2 { font-size: 1.1rem; font-weight: 600; }
        .chat-header-info span { color: var(--text-muted); font-size: 0.9rem; }

        .chat-header-actions { display: flex; gap: 10px; }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Messages */
        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }

        .message-group {
            display: flex;
            padding: 4px 0;
            border-radius: var(--radius-sm);
            transition: background 0.1s;
        }
        .message-group:hover { background: rgba(255,255,255,0.02); }

        .message { 
            display: flex; 
            gap: 15px; 
            width: 100%;
            animation: msgSlide 0.3s ease-out;
        }

        .msg-avatar-spacer {
            width: 40px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }
        .msg-avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            object-fit: cover;
            margin-top: 2px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .msg-avatar:hover { transform: scale(1.1); }

        .msg-content { 
            flex: 1;
            max-width: calc(100% - 60px);
        }

        .msg-header { 
            display: flex; 
            align-items: baseline; 
            gap: 10px; 
            margin-bottom: 4px; 
        }

        .msg-name { 
            font-weight: 600; 
            color: var(--text-primary); 
            font-size: 0.95rem;
            cursor: pointer;
        }
        .msg-name:hover { text-decoration: underline; }

        .msg-time { 
            font-size: 0.7rem; 
            color: var(--text-muted); 
            font-weight: 400;
        }

        .msg-bubble {
            background: var(--bg-secondary);
            padding: 10px 15px;
            border-radius: 0 12px 12px 12px;
            display: inline-block;
            font-size: 0.95rem; 
            line-height: 1.5; 
            word-wrap: break-word; 
            color: var(--text-primary);
            position: relative;
            border-top-left-radius: 4px;
        }
        
        /* Message from "me" (optional styling, currently uniform) */
        .message[data-me="true"] .msg-bubble {
            background: var(--bg-tertiary);
        }

        .msg-image { 
            max-width: 300px; 
            border-radius: var(--radius-md); 
            margin-top: 5px; 
            cursor: pointer; 
            transition: transform 0.2s;
            display: block;
        }
        .msg-image:hover { transform: scale(1.02); }

        /* Reply Logic */
        .msg-reply-context {
            border-left: 2px solid var(--accent-primary);
            padding-left: 10px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .msg-reply-context strong { color: var(--text-primary); }

        /* Typing Indicator */
        #typing-indicator { 
            position: absolute; 
            bottom: 90px; 
            left: 20px; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-soft);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s, transform 0.2s;
        }
        #typing-indicator.visible { opacity: 1; transform: translateY(0); }
        
        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        /* Input Area */
        #input-area { 
            padding: 15px 25px 20px 25px; 
            background: var(--bg-primary); 
        }

        .reply-preview {
            display: none;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-left: 3px solid var(--accent-primary);
            margin-bottom: -5px;
            position: relative;
        }
        .reply-preview.active { display: flex; justify-content: space-between; align-items: center; }
        .reply-preview .close-reply {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        .input-wrapper { 
            display: flex; 
            align-items: center; 
            background: var(--bg-secondary); 
            border-radius: var(--radius-full); 
            border: 1px solid var(--border-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper:focus-within { 
            border-color: var(--accent-primary); 
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .input-action-btn {
            background: transparent;
            border: none;
            padding: 0 10px;
            color: var(--text-muted);
            cursor: pointer;
            height: 100%;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .input-action-btn:hover { color: var(--text-primary); }
        .input-action-btn svg { width: 22px; height: 22px; fill: currentColor; }

        #msgInput { 
            flex: 1; 
            padding: 14px 5px; 
            border: none; 
            background: transparent; 
            color: var(--text-primary); 
            outline: none; 
            font-size: 0.95rem; 
        }
        #msgInput::placeholder { color: var(--text-muted); }

        .send-btn {
            background: var(--accent-gradient);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.8;
        }
        .send-btn:hover { opacity: 1; transform: scale(1.05); }
        .send-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

        /* =========================================
           7. MODALS (Settings, Image View, Emoji)
           ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-glow);
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h2 { font-size: 1.3rem; }
        .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; }

        .settings-group {
            margin-bottom: 20px;
        }
        .settings-group h3 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            margin-bottom: 5px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-input);
            transition: .4s;
            border-radius: var(--radius-full);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background: var(--accent-primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Emoji Picker */
        .emoji-picker {
            position: absolute;
            bottom: 70px;
            left: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px;
            display: none;
            z-index: 150;
            box-shadow: var(--shadow-soft);
            animation: fadeIn 0.2s;
        }
        .emoji-picker.active { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        .emoji-btn {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            padding: 5px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }
        .emoji-btn:hover { background: var(--bg-tertiary); }

        /* Image Lightbox */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 300;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .lightbox.active { opacity: 1; pointer-events: all; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 4px; }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* =========================================
           8. ANIMATIONS
           ========================================= */
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes msgSlide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* =========================================
           9. MOBILE RESPONSIVENESS
           ========================================= */
        @media (max-width: 768px) {
            .bg-decoration { display: none; }
            
            .sidebar { 
                position: fixed; 
                left: 0; top: 0; bottom: 0; 
                transform: translateX(-100%); 
                box-shadow: 5px 0 20px rgba(0,0,0,0.5); 
                z-index: 200;
            }
            .sidebar.open { transform: translateX(0); }

            .chat-header-actions .desktop-only { display: none; }
            
            .msg-image { max-width: 100%; }
            
            .input-wrapper { border-radius: var(--radius-md); }
            
            /* Mobile specific toggle button */
            .mobile-toggle { 
                display: block !important; 
                background: none; 
                border: none; 
                color: var(--text-primary); 
                font-size: 1.5rem; 
                cursor: pointer; 
                margin-right: 10px;
            }
        }

        /* Utility to hide elements */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Decorative Background -->
    <div class="bg-decoration one"></div>
    <div class="bg-decoration two"></div>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="logo-container">
            <div class="logo-text">IdlyCall</div>
            <div class="logo-sub">Modern Communication</div>
        </div>
        
        <div class="avatar-upload-container">
            <label for="login-file">
                <img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" title="Click to upload avatar">
                <div class="avatar-overlay">
                    <svg viewBox="0 0 24 24"><path d="M12 16l-6-6h12z"/></svg>
                </div>
            </label>
            <input type="file" id="login-file" accept="image/*" style="display:none;" onchange="processImage(event, 'login-preview')">
        </div>

        <div class="input-group">
            <input type="text" id="username" placeholder="Enter your display name" autocomplete="off" onkeypress="if(event.key === 'Enter') connect()">
        </div>
        
        <button class="btn-primary" onclick="connect()">
            Enter Lobby
        </button>
    </div>

    <!-- 2. APP CONTAINER -->
    <div id="app-container">
        <div class="app-layout">
            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span>Messages</span>
                    <div class="sidebar-header-actions">
                        <button onclick="openSettings()" title="Settings">
                            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="search-box">
                    <input type="text" placeholder="Find or start a conversation" id="searchInput" oninput="filterUsers()">
                </div>

                <div class="user-list" id="user-list-container">
                    <!-- User list injected here -->
                </div>

                <div class="my-profile" onclick="openSettings()">
                    <div class="user-avatar-wrapper">
                        <img id="my-avatar-footer" src="">
                        <div class="status-indicator status-online"></div>
                    </div>
                    <div class="user-info">
                        <div class="name" id="my-username-footer">User</div>
                        <div class="status-text">Online</div>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" onclick="closeSidebarMobile()">
                <header class="chat-header">
                    <div class="chat-header-info">
                        <button class="mobile-toggle hidden" onclick="event.stopPropagation(); toggleSidebar()">☰</button>
                        <h2 id="chat-header-title"># Public Lobby</h2>
                        <span id="chat-header-subtitle">General Chat</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn desktop-only" onclick="forceSync()" title="Sync">
                            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        </button>
                        <button class="icon-btn" onclick="clearChatUI()" title="Clear View">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                </header>

                <div id="messages">
                    <!-- Messages injected here -->
                </div>

                <div id="typing-indicator">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span id="typing-text">Someone is typing</span>
                </div>

                <div id="input-area">
                    <div class="reply-preview" id="reply-preview">
                        <div>
                            <small>Replying to <strong id="reply-to-name"></strong></small>
                            <div id="reply-to-text" style="font-size:0.85rem; color:var(--text-muted); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div>
                        </div>
                        <button class="close-reply" onclick="cancelReply()">✕</button>
                    </div>

                    <div class="input-wrapper">
                        <label for="imageAttachInput" class="input-action-btn" title="Attach Image">
                            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        </label>
                        <input type="file" id="imageAttachInput" accept="image/*" style="display: none;" onchange="sendImage(event)">

                        <button class="input-action-btn" onclick="toggleEmojiPicker()" title="Emoji">
                            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                        </button>

                        <!-- Emoji Picker Container -->
                        <div id="emoji-picker" class="emoji-picker">
                            <!-- Emojis injected by JS -->
                        </div>

                        <input type="text" id="msgInput" placeholder="Message..." autocomplete="off" oninput="handleTyping()">
                        
                        <button class="send-btn" onclick="sendMsg()" title="Send">
                            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" onclick="if(event.target === this) closeSettings()">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close" onclick="closeSettings()">✕</button>
            </div>
            <div class="settings-group">
                <h3>Appearance</h3>
                <div class="setting-item">
                    <span>Dark Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="settings-group">
                <h3>Account</h3>
                <div class="setting-item">
                    <span>Clear Local Data</span>
                    <button class="btn-primary" style="width:auto; padding:8px 16px; background:var(--danger);" onclick="clearData()">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close">✕</button>
        <img id="lightbox-img" src="">
    </div>

    <script>
        /* =========================================
           10. JAVASCRIPT LOGIC
           ========================================= */

        // --- State Management ---
        let ws;
        let heartbeat;
        let myUsername = "";
        let myPicBase64 = "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
        let currentChat = "Public";
        let userList = [];
        let isTyping = false;
        let typingTimeout;
        let currentlyTypingUsers = new Set();
        let indicatorTimeout;
        let replyingTo = null; // Stores the message object being replied to

        const emojis = ['😀', '😂', '🔥', '❤️', '👍', '👎', '😮', '😢', '😡', '🤔', '😎', '🥳', '🤫', '👀', '👋', '🙏', '💪', '🎉', '✨', '💯', '🚀', '☕', '🍕', '🍔'];

        // --- Initialization ---
        window.onload = () => {
            loadTheme();
            initEmojiPicker();
            loadSession();
            
            const inputField = document.getElementById("msgInput");
            inputField.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') sendMsg(); 
            });
        };

        function loadSession() {
            try {
                const savedName = localStorage.getItem("idly_user");
                const savedPic = localStorage.getItem("idly_pic");
                const savedChat = localStorage.getItem("idly_chat");
                
                if (savedName) {
                    document.getElementById("username").value = savedName;
                    myUsername = savedName;
                }
                if (savedPic) {
                    myPicBase64 = savedPic;
                    document.getElementById("login-preview").src = savedPic;
                }
                if (savedChat) currentChat = savedChat;
            } catch (e) {
                console.log("Storage blocked");
            }
        }

        function initEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            emojis.forEach(e => {
                const btn = document.createElement('button');
                btn.className = 'emoji-btn';
                btn.innerText = e;
                btn.onclick = () => insertEmoji(e);
                picker.appendChild(btn);
            });
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('msgInput');
            input.value += emoji;
            input.focus();
        }

        // --- WebSocket Connection ---
        function connect() {
            myUsername = document.getElementById("username").value.trim();
            if (!myUsername) return alert("Please enter a username");

            try {
                localStorage.setItem("idly_user", myUsername);
                localStorage.setItem("idly_pic", myPicBase64);
                localStorage.setItem("idly_chat", currentChat);
            } catch(e) {}

            // Update UI
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";
            
            updateFooterProfile();
            updateHeader();

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);

            ws.onopen = function() {
                // Send profile info
                this.send(JSON.stringify({ pic: myPicBase64, target: currentChat }));
                // Request history
                this.send(JSON.stringify({ type: "get_history", target: currentChat }));
                
                // Heartbeat to keep connection alive
                heartbeat = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) 
                        ws.send(JSON.stringify({ type: "ping" }));
                }, 25000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWsMessage(data);
            };

            ws.onclose = () => {
                clearInterval(heartbeat);
                // Optional: Auto-reconnect logic or simple alert
                console.log("Disconnected");
            };
        }

        function handleWsMessage(data) {
            switch(data.type) {
                case "history":
                    renderHistory(data);
                    break;
                case "chat":
                    handleIncomingChat(data);
                    break;
                case "user_list":
                    handleUserList(data);
                    break;
                case "typing":
                    handleTypingIndicator(data);
                    break;
            }
        }

        // --- UI Rendering ---
        function renderHistory(data) {
            const msgs = document.getElementById("messages");
            msgs.innerHTML = "";
            
            if (data.data.length === 0) {
                msgs.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px;">No messages yet. Say hello! 👋</div>`;
            } else {
                data.data.forEach(m => drawMessage(m, false));
                scrollToBottom();
            }
        }

        function handleIncomingChat(data) {
            // Logic to determine if message belongs to current view
            // Public: receiver == "Public"
            // Private: sender == currentChat OR (sender == me && receiver == currentChat)
            
            const isPublic = data.receiver === "Public";
            const isForMe = data.receiver === myUsername;
            const isFromMe = data.sender === myUsername;
            
            let show = false;

            if (currentChat === "Public" && isPublic) {
                show = true;
            } else if (currentChat !== "Public") {
                if (isFromMe && data.receiver === currentChat) show = true; // I sent to current target
                if (data.sender === currentChat && isForMe) show = true; // Target sent to me
            }

            if (show) {
                drawMessage(data);
                scrollToBottom();
            } else {
                // Optional: Show notification for other tabs
            }
        }

        function drawMessage(msg, isNew = true) {
            const msgs = document.getElementById("messages");
            
            // Remove 'empty' text if present
            if (msgs.innerHTML.includes("No messages yet")) msgs.innerHTML = "";

            const div = document.createElement("div");
            div.className = "message-group";
            
            const isMe = msg.sender === myUsername;
            const safePic = msg.profile_pic || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
            const timeStr = msg.timestamp || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Check for image
            const isImage = msg.content && (msg.content.startsWith("data:image") || msg.content.includes("http"));
            let contentHtml = "";
            
            if (isImage) {
                contentHtml = `<img src="${msg.content}" class="msg-image" onclick="openLightbox('${msg.content}')">`;
            } else {
                contentHtml = `<div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
            }

            // Reply Logic UI
            let replyHtml = "";
            if (msg.reply_to) {
                replyHtml = `
                    <div class="msg-reply-context" onclick="scrollToMessage('${msg.reply_to_id}')">
                        <strong>${msg.reply_to_name}</strong><br>
                        <span style="color:var(--text-muted)">${escapeHtml(msg.reply_to_text || 'Image')}</span>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="message" data-me="${isMe}" oncontextmenu="showMessageContext(event, '${msg.id || ''}', '${escapeHtml(msg.content)}', '${msg.sender}')">
                    <div class="msg-avatar-spacer">
                        <img src="${safePic}" class="msg-avatar" title="${msg.sender}">
                    </div>
                    <div class="msg-content">
                        <div class="msg-header">
                            <span class="msg-name">${msg.sender}</span>
                            <span class="msg-time">${timeStr}</span>
                        </div>
                        ${replyHtml}
                        ${contentHtml}
                    </div>
                </div>
            `;
            
            msgs.appendChild(div);
        }

        function handleUserList(data) {
            userList = data.users;
            renderSidebar();
        }

        function renderSidebar() {
            const container = document.getElementById("user-list-container");
            let html = `
                <div class="list-header">Channels</div>
                <div class="user-item ${currentChat === 'Public' ? 'active' : ''}" onclick="switchChat('Public')">
                    <div class="user-avatar-wrapper">
                        <img src="https://cdn-icons-png.flaticon.com/512/1256/1256650.png" style="border-radius: 0;">
                    </div>
                    <div class="user-info">
                        <div class="name">Public Lobby</div>
                    </div>
                </div>
            `;
            
            const onlineUsers = userList.filter(u => u.username !== myUsername && u.status === 'Online');
            const offlineUsers = userList.filter(u => u.username !== myUsername && u.status !== 'Online');

            html += `<div class="list-header">Online — ${onlineUsers.length}</div>`;
            onlineUsers.forEach(user => {
                html += createUserItem(user);
            });

            html += `<div class="list-header">Offline — ${offlineUsers.length}</div>`;
            offlineUsers.forEach(user => {
                html += createUserItem(user);
            });

            container.innerHTML = html;
        }

        function createUserItem(user) {
            const statusClass = user.status === "Online" ? "status-online" : "status-offline";
            const activeClass = currentChat === user.username ? "active" : "";
            const safePic = user.profile_pic || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
            
            return `
                <div class="user-item ${activeClass}" onclick="switchChat('${user.username}')">
                    <div class="user-avatar-wrapper">
                        <img src="${safePic}">
                        <div class="status-indicator ${statusClass}"></div>
                    </div>
                    <div class="user-info">
                        <div class="name">${user.username}</div>
                    </div>
                </div>
            `;
        }

        // --- Actions ---
        function switchChat(target) {
            if (currentChat === target) return;
            currentChat = target;
            
            try { localStorage.setItem("idly_chat", currentChat); } catch(e) {}

            updateHeader();
            renderSidebar();
            cancelReply();

            document.getElementById("messages").innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px;">Loading...</div>`;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            }

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function sendMsg() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                const msgObj = { 
                    type: "chat", 
                    receiver: currentChat, 
                    pic: myPicBase64, 
                    content: text
                };

                // Handle Reply Data
                if (replyingTo) {
                    msgObj.reply_to_id = replyingTo.id || Date.now();
                    msgObj.reply_to_name = replyingTo.sender;
                    msgObj.reply_to_text = replyingTo.content;
                    replyingTo = null;
                    document.getElementById('reply-preview').classList.remove('active');
                }

                ws.send(JSON.stringify(msgObj));
                input.value = "";
                input.focus();
                
                // Reset typing
                clearTimeout(typingTimeout);
                isTyping = false;
            }
        }

        function sendImage(e) {
            const file = e.target.files[0]; 
            if (!file) return; 
            
            const reader = new FileReader();
            reader.onload = (event) => {
                // Resize logic
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); 
                    let width = img.width, height = img.height;
                    
                    if (width > 1000) { height *= 1000 / width; width = 1000; }
                    canvas.width = width; 
                    canvas.height = height; 
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ 
                            type: "chat", 
                            receiver: currentChat, 
                            pic: myPicBase64, 
                            content: dataUrl 
                        }));
                    }
                }; 
                img.src = event.target.result;
            }; 
            reader.readAsDataURL(file); 
            e.target.value = '';
        }

        // --- Interaction Handlers ---
        function handleTyping() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            if (!isTyping) {
                isTyping = true;
                ws.send(JSON.stringify({ type: "typing", receiver: currentChat }));
            }
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { isTyping = false; }, 1500);
        }

        function handleTypingIndicator(data) {
            if (data.sender === myUsername) return; // Ignore self

            if (currentChat === "Public" && data.receiver === "Public") {
                currentlyTypingUsers.add(data.sender);
            } else if (currentChat === data.sender) {
                currentlyTypingUsers.add(data.sender);
            }

            updateTypingUI();
            
            clearTimeout(indicatorTimeout);
            indicatorTimeout = setTimeout(() => {
                currentlyTypingUsers.clear();
                updateTypingUI();
            }, 3000);
        }

        function updateTypingUI() {
            const indicator = document.getElementById("typing-indicator");
            const textSpan = document.getElementById("typing-text");
            const users = Array.from(currentlyTypingUsers);

            if (users.length > 0) {
                let text = "";
                if (users.length === 1) text = `${users[0]} is typing`;
                else if (users.length === 2) text = `${users[0]} and ${users[1]} are typing`;
                else text = "Several people are typing";
                
                textSpan.innerText = text;
                indicator.classList.add('visible');
            } else {
                indicator.classList.remove('visible');
            }
        }

        function setReply(sender, content, id) {
            replyingTo = { sender, content, id };
            document.getElementById('reply-to-name').innerText = sender;
            document.getElementById('reply-to-text').innerText = content ? content.substring(0, 50) : "Image";
            document.getElementById('reply-preview').classList.add('active');
            document.getElementById('msgInput').focus();
        }

        function cancelReply() {
            replyingTo = null;
            document.getElementById('reply-preview').classList.remove('active');
        }

        function showMessageContext(e, id, content, sender) {
            e.preventDefault();
            // Simple implementation: Reply only for now
            if (content && !content.startsWith('data:image')) {
                if (confirm(`Reply to ${sender}?`)) {
                    setReply(sender, content, id);
                }
            }
        }

        // --- Helper Functions ---
        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function scrollToBottom() {
            const msgs = document.getElementById("messages");
            msgs.scrollTop = msgs.scrollHeight;
        }

        function updateHeader() {
            const title = document.getElementById("chat-header-title");
            const sub = document.getElementById("chat-header-subtitle");
            if (currentChat === "Public") {
                title.innerText = "# Public Lobby";
                sub.innerText = "Everyone sees this";
            } else {
                title.innerText = `@ ${currentChat}`;
                sub.innerText = "Direct Message";
            }
        }

        function updateFooterProfile() {
            document.getElementById("my-avatar-footer").src = myPicBase64;
            document.getElementById("my-username-footer").innerText = myUsername;
        }

        function processImage(e, targetId) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); 
                    let width = img.width, height = img.height;
                    if (width > 800) { height *= 800 / width; width = 800; }
                    canvas.width = width; canvas.height = height; 
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(img, 0, 0, width, height);
                    const b64 = canvas.toDataURL('image/jpeg', 0.8); 
                    document.getElementById(targetId).src = b64;
                    if(targetId === 'login-preview') myPicBase64 = b64;
                }; 
                img.src = event.target.result;
            }; 
            reader.readAsDataURL(file);
        }

        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.user-item');
            items.forEach(item => {
                const name = item.querySelector('.name').innerText.toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        function forceSync() {
             if (ws && ws.readyState === WebSocket.OPEN) {
                document.getElementById("messages").innerHTML = `<div style="text-align:center; color:var(--accent-primary); margin-top:20px;">Syncing...</div>`;
                ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            }
        }

        function clearChatUI() {
            document.getElementById("messages").innerHTML = "";
        }

        // --- Mobile & UI Controls ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function closeSidebarMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function toggleEmojiPicker() {
            document.getElementById('emoji-picker').classList.toggle('active');
        }

        // --- Theme & Settings ---
        function openSettings() {
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function loadTheme() {
            const theme = localStorage.getItem('idly_theme') || 'dark';
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-toggle').checked = (theme === 'dark');
        }

        function toggleTheme() {
            const isDark = document.getElementById('theme-toggle').checked;
            const theme = isDark ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('idly_theme', theme);
        }

        function clearData() {
            if(confirm("Clear all local settings and data? You will return to login.")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- Lightbox ---
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
    </script>
</body>
</html>
