<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall - Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #202225;
            --bg-sidebar: #2f3136;
            --bg-chat: #36393f;
            --bg-input: #40444b;
            --accent: #5865F2;
            --text-main: #dcddde;
            --text-muted: #8e9297;
            --bubble-other: #4f545c;
            --online: #3ba55d;
            --offline: #747f8d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* Login Screen */
        #login-screen { background: var(--bg-sidebar); padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 90%; max-width: 350px; }
        .logo-text { font-size: 1.8rem; font-weight: 600; color: white; margin-bottom: 20px; }
        .logo-text span { color: var(--accent); }
        .avatar-preview { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid var(--accent); cursor: pointer; }
        #login-screen input { width: 100%; padding: 14px; border-radius: 6px; border: none; background: var(--bg-input); color: white; font-size: 1rem; margin-bottom: 20px; outline: none; }
        #login-screen button { width: 100%; padding: 14px; border: none; background: var(--accent); color: white; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        #login-screen button:hover { background: #4752C4; }

        /* App Container */
        #app-container { display: none; width: 100%; height: 100%; max-width: 1200px; position: relative; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--bg-main); display: flex; flex-direction: column; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { padding: 20px; font-weight: 600; color: white; border-bottom: 1px solid var(--bg-main); display: flex; justify-content: space-between; align-items: center; }
        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; margin-bottom: 2px; transition: 0.2s; }
        .user-item:hover { background: var(--bg-chat); color: white; }
        .user-item.active { background: var(--accent); color: white; }
        .user-item img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-right: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; }
        .status-online { background: var(--online); }
        .status-offline { background: var(--offline); }
        
        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); position: relative; }
        header { padding: 15px 20px; border-bottom: 1px solid var(--bg-main); font-weight: 600; color: white; display: flex; align-items: center; justify-content: space-between; position: relative; }
        .mobile-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .sync-btn { background: var(--accent); border: none; color: white; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .sync-btn:hover { background: #4752C4; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { display: flex; gap: 15px; animation: fadeIn 0.3s ease; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .msg-body { display: flex; flex-direction: column; max-width: 80%; }
        .msg-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
        .msg-name { font-weight: 600; color: white; }
        .msg-time { font-size: 0.75rem; color: var(--text-muted); }
        .msg-text { background: var(--bg-input); padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; color: var(--text-main); }
        .msg-image { max-width: 300px; border-radius: 8px; margin-top: 5px; cursor: pointer; }

        /* Typing Indicator */
        #typing-indicator { position: absolute; bottom: 85px; left: 20px; font-size: 0.85rem; color: var(--text-muted); font-style: italic; display: none; background: rgba(54, 57, 63, 0.9); padding: 2px 8px; border-radius: 12px; }
        .typing-dots::after { content: '...'; animation: typing 1.5s steps(4, end) infinite; }
        @keyframes typing { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }

        /* Input Area */
        #input-area { padding: 20px; background: var(--bg-chat); }
        .input-box { display: flex; align-items: center; background: var(--bg-input); border-radius: 8px; overflow: hidden; padding: 5px 10px; }
        .attach-btn { background: var(--bg-main); color: var(--text-muted); border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .attach-btn:hover { color: white; }
        .input-box input { flex: 1; padding: 10px; border: none; background: transparent; color: white; outline: none; font-size: 0.95rem; }
        .input-box button { padding: 0 15px; border: none; background: transparent; color: var(--accent); font-weight: 600; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(0); }
            .msg-image { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-text">Idly<span>Call</span></div>
        <label for="login-file">
            <img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" title="Click to upload avatar">
        </label>
        <input type="file" id="login-file" accept="image/*" style="display:none;" onchange="processImage(event, 'login-preview')">
        <input type="text" id="username" placeholder="Enter your username" autocomplete="off" onkeypress="if(event.key === 'Enter') connect()">
        <button onclick="connect()">Join System</button>
    </div>

    <div id="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                Channels & DMs
            </div>
            <div class="user-list" id="user-list-container"></div>
        </div>

        <div class="chat-area" onclick="document.getElementById('sidebar').classList.remove('open')">
            <header>
                <div style="display:flex; align-items:center; gap:15px;">
                    <button class="mobile-toggle" onclick="event.stopPropagation(); document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <span id="chat-header"># Public Channel</span>
                </div>
                <button class="sync-btn" onclick="forceSync()">Sync History</button>
            </header>
            
            <div id="messages"></div>
            
            <!-- Typing Indicator Element -->
            <div id="typing-indicator">Someone is typing<span class="typing-dots"></span></div>

            <div id="input-area">
                <div class="input-box">
                    <label for="imageAttachInput" class="attach-btn">＋</label>
                    <input type="file" id="imageAttachInput" accept="image/*" style="display: none;" onchange="sendImage(event)">
                    <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
                    <button onclick="sendMsg()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let heartbeat;
        let myUsername = "";
        let myPicBase64 = "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
        let currentChat = "Public"; 
        let userList = [];
        
        let typingTimeout;
        let isTyping = false;
        let currentlyTypingUsers = new Set();
        let indicatorTimeout;

        window.onload = () => {
            // BRAVE FIX: Wrap local storage in try/catch so aggressive shields don't crash the script
            try {
                const savedName = localStorage.getItem("pro_chat_name");
                const savedPic = localStorage.getItem("pro_chat_pic");
                const savedChat = localStorage.getItem("pro_last_chat");
                if (savedName) document.getElementById("username").value = savedName;
                if (savedPic) { myPicBase64 = savedPic; document.getElementById("login-preview").src = savedPic; }
                if (savedChat) { currentChat = savedChat; }
            } catch (e) {
                console.log("Local storage blocked by browser shields.");
            }
            
            const inputField = document.getElementById("msgInput");
            inputField.addEventListener('input', handleTyping);
            inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });
        };

        function processImage(e, targetId) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                    if (width > 800) { height *= 800 / width; width = 800; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    const b64 = canvas.toDataURL('image/jpeg', 0.8); document.getElementById(targetId).src = b64;
                    if(targetId === 'login-preview') myPicBase64 = b64;
                }; img.src = event.target.result;
            }; reader.readAsDataURL(file);
        }

        function connect() {
            myUsername = document.getElementById("username").value.trim();
            if (!myUsername) return alert("Please enter a username");

            try {
                localStorage.setItem("pro_chat_name", myUsername);
                localStorage.setItem("pro_chat_pic", myPicBase64);
            } catch(e) {}

            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";

            document.getElementById("chat-header").innerText = currentChat === "Public" ? "# Public Channel" : `@ ${currentChat}`;
            document.getElementById("msgInput").placeholder = `Message ${currentChat}...`;

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);

            ws.onopen = function() {
                // Send profile pic AND request history immediately
                this.send(JSON.stringify({ pic: myPicBase64, target: currentChat }));
                
                // Double-tap the history request to guarantee it loads
                this.send(JSON.stringify({ type: "get_history", target: currentChat }));
                
                heartbeat = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
                }, 20000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === "history") {
                    if (data.target === currentChat) {
                        const msgs = document.getElementById("messages");
                        msgs.innerHTML = "";
                        
                        // BRAVE FIX: Explicitly tell the user if the database is actually empty
                        if (data.data.length === 0) {
                            msgs.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:20px; font-style:italic;">No message history yet. Send a message to start!</div>`;
                        } else {
                            data.data.forEach(m => drawMessage(m.sender, m.profile_pic, m.content, m.timestamp));
                            msgs.scrollTop = msgs.scrollHeight;
                        }
                    }
                } 
                else if (data.type === "chat") {
                    // Remove the "empty history" text if it's there
                    if (document.getElementById("messages").innerHTML.includes("No message history yet")) {
                        document.getElementById("messages").innerHTML = "";
                    }

                    if (currentChat === "Public" && data.receiver === "Public") {
                        drawMessage(data.sender, data.profile_pic, data.content, data.timestamp);
                    } 
                    else if (currentChat !== "Public") {
                        if (data.sender === currentChat || (data.sender === myUsername && data.receiver === currentChat)) {
                            drawMessage(data.sender, data.profile_pic, data.content, data.timestamp);
                        }
                    }
                    
                    if (currentlyTypingUsers.has(data.sender)) {
                         currentlyTypingUsers.delete(data.sender);
                         updateTypingUI();
                    }
                } 
                else if (data.type === "user_list") {
                    userList = data.users;
                    renderSidebar();
                }
                else if (data.type === "typing") {
                    if ((currentChat === "Public" && data.receiver === "Public") || (currentChat !== "Public" && data.sender === currentChat)) {
                        currentlyTypingUsers.add(data.sender);
                        updateTypingUI();
                        
                        clearTimeout(indicatorTimeout);
                        indicatorTimeout = setTimeout(() => {
                            currentlyTypingUsers.clear();
                            updateTypingUI();
                        }, 3000);
                    }
                }
            };

            ws.onclose = () => {
                clearInterval(heartbeat);
                alert("Connection lost. Please refresh.");
                window.location.reload();
            };
        }

        function forceSync() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                document.getElementById("messages").innerHTML = `<div style="text-align:center; color:var(--accent); margin-top:20px;">Syncing...</div>`;
                ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            } else {
                alert("Chat not connected yet!");
            }
        }

        function handleTyping() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            if (!isTyping) {
                isTyping = true;
                ws.send(JSON.stringify({ type: "typing", receiver: currentChat }));
            }
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
            }, 1000);
        }

        function updateTypingUI() {
            const indicator = document.getElementById("typing-indicator");
            if (currentlyTypingUsers.size > 0) {
                const usersArray = Array.from(currentlyTypingUsers);
                let text = "";
                if (usersArray.length === 1) text = `${usersArray[0]} is typing`;
                else if (usersArray.length === 2) text = `${usersArray[0]} and ${usersArray[1]} are typing`;
                else text = "Several people are typing";
                
                indicator.innerHTML = `${text}<span class="typing-dots"></span>`;
                indicator.style.display = "block";
            } else {
                indicator.style.display = "none";
            }
        }

        function renderSidebar() {
            const container = document.getElementById("user-list-container");
            
            let html = `
                <div class="user-item ${currentChat === 'Public' ? 'active' : ''}" onclick="switchChat('Public')">
                    <img src="https://cdn-icons-png.flaticon.com/512/1256/1256650.png" style="border-radius:0;">
                    <span>Public Server</span>
                </div>
            `;
            
            userList.forEach(user => {
                if (user.username === myUsername) return; 
                const statusClass = user.status === "Online" ? "status-online" : "status-offline";
                const safePic = user.profile_pic || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
                html += `
                    <div class="user-item ${currentChat === user.username ? 'active' : ''}" onclick="switchChat('${user.username}')">
                        <img src="${safePic}">
                        <span>${user.username}</span>
                        <div class="status-dot ${statusClass}"></div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function switchChat(target) {
            if (currentChat === target) return; 
            
            currentChat = target;
            try { localStorage.setItem("pro_last_chat", currentChat); } catch(e) {}
            
            document.getElementById("chat-header").innerText = target === "Public" ? "# Public Channel" : `@ ${target}`;
            document.getElementById("msgInput").placeholder = `Message ${target}...`;
            document.getElementById('sidebar').classList.remove('open');
            renderSidebar();
            
            currentlyTypingUsers.clear();
            updateTypingUI();
            
            document.getElementById("messages").innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:20px;">Loading messages...</div>`;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            }
        }

        function drawMessage(sender, pic, text, timestamp) {
            const msgs = document.getElementById("messages");
            const safePic = pic || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
            const timeStr = timestamp || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const isImage = text && (text.startsWith("data:image/") || text.includes("res.cloudinary.com"));
            const contentHtml = isImage ? `<img src="${text}" class="msg-image" onclick="window.open(this.src, '_blank')">` : `<div class="msg-text">${text}</div>`;

            const div = document.createElement("div");
            div.className = "message";
            div.innerHTML = `
                <img src="${safePic}" class="msg-avatar">
                <div class="msg-body">
                    <div class="msg-header">
                        <span class="msg-name">${sender}</span>
                        <span class="msg-time">${timeStr}</span>
                    </div>
                    ${contentHtml}
                </div>
            `;
            
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "chat", receiver: currentChat, pic: myPicBase64, content: text }));
                input.value = "";
                input.focus(); 
                
                isTyping = false;
                clearTimeout(typingTimeout);
            }
        }

        function sendImage(e) {
            const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                    if (width > 1200) { height *= 1200 / width; width = 1200; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "chat", receiver: currentChat, pic: myPicBase64, content: canvas.toDataURL('image/jpeg', 0.8) }));
                    }
                }; img.src = event.target.result;
            }; reader.readAsDataURL(file); e.target.value = '';
        }
    </script>
</body>
</html>
