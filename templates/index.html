<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall - Connected</title>
    <link rel="icon" type="image/png" href="/static/IC.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f1013;
            --bg-panel: #16181c;
            --text-main: #f1f1f1;
            --text-muted: #8b929a;
            --accent-main: #FF7A00;
            --online: #00d26a;
            --danger: #f23f42;
            --sidebar-width: 280px;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; }

        /* === RGB CHATBOX BORDER === */
        @keyframes rgbBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 8px #ff0000; }
            33% { border-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
            66% { border-color: #0000ff; box-shadow: 0 0 8px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 8px #ff0000; }
        }

        .input-box { 
            display: flex; align-items: center; background: rgba(0,0,0,0.4); 
            border: 2px solid #ff0000; 
            border-radius: 20px; padding: 10px 20px;
            animation: rgbBorder 6s linear infinite;
            transition: all 0.3s ease;
        }
        .input-box input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 1rem; }

        /* === SIDEBAR & LAYOUT === */
        .sidebar { width: var(--sidebar-width); background: var(--bg-deep); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; z-index: 20; }
        .sidebar-header { height: 70px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); }
        .user-list { flex: 1; overflow-y: auto; padding: 15px; }
        .user-item { display: flex; align-items: center; padding: 12px; border-radius: 12px; cursor: pointer; margin-bottom: 5px; transition: 0.2s; position: relative; }
        .user-item:hover { background: rgba(255,255,255,0.05); }
        .user-item.active { background: rgba(255, 122, 0, 0.15); color: var(--accent-main); }
        .user-item img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 1px solid var(--border-subtle); }

        /* === CHAT STREAM === */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-panel); }
        header { height: 70px; padding: 0 25px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); }
        #chat-stream { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        
        .message { display: flex; align-items: flex-start; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-avatar { width: 45px; height: 45px; border-radius: 50%; margin-right: 15px; border: 1px solid var(--border-subtle); }
        .msg-sender { font-weight: 700; color: white; margin-right: 10px; font-size: 1rem; }
        .msg-time { font-size: 0.75rem; color: var(--text-muted); }
        .msg-content { color: #e0e0e0; margin-top: 5px; line-height: 1.5; }
        .msg-image-attachment { max-width: 320px; border-radius: 15px; margin-top: 10px; cursor: zoom-in; border: 1px solid var(--border-subtle); }

        /* === CALLING INTERFACE === */
        #call-interface { display: none; position: absolute; inset: 0; background: #000; z-index: 150; flex-direction: column; }
        .remote-video-area { flex: 1; display: flex; justify-content: center; align-items: center; }
        .remote-video-area video { width: 100%; height: 100%; object-fit: contain; }
        .local-video-area { position: absolute; bottom: 110px; right: 25px; width: 160px; height: 240px; border-radius: 15px; overflow: hidden; border: 2px solid var(--accent-main); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .local-video-area video { width: 100%; height: 100%; object-fit: cover; }
        .call-controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(30, 32, 36, 0.95); padding: 15px 30px; border-radius: 50px; backdrop-filter: blur(15px); }
        .call-btn { width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer; background: rgba(255,255,255,0.1); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; transition: 0.2s; }
        .call-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .call-btn.danger { background: var(--danger); width: 75px; border-radius: 30px; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: var(--bg-panel); border: 1px solid var(--border-subtle); padding: 40px; border-radius: 25px; width: 90%; max-width: 400px; text-align: center; }
        .avatar-preview { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 3px solid var(--accent-main); }
        
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 85%; }
            .sidebar.open { transform: translateX(0); }
            .local-video-area { width: 110px; height: 170px; }
        }
    </style>
</head>
<body>

    <audio id="chatSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <audio id="ringSound" src="https://cdn.pixabay.com/audio/2022/01/18/audio_511d1796d4.mp3" loop preload="auto"></audio>
    <audio id="dialSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_78ec79524c.mp3" loop preload="auto"></audio>

    <div id="login-screen" class="modal-overlay">
        <div class="modal-box">
            <img src="/static/IC.png" style="height:70px">
            <h2 style="color:white; margin: 15px 0;">IdlyCall</h2>
            <img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png">
            <input type="file" id="login-file" style="display:none" onchange="processImage(event, 'login-preview')">
            <label for="login-file" style="color:var(--accent-main); cursor:pointer; font-weight:bold;">📷 Change Photo</label>
            <input type="text" id="usernameInput" placeholder="Enter Username" style="width:100%; padding:15px; border-radius:10px; border:none; background:#0f1013; color:white; margin:20px 0;">
            <button onclick="manualLogin()" style="width:100%; padding:15px; border-radius:10px; border:none; background:var(--accent-main); color:white; font-weight:bold; cursor:pointer;">Connect</button>
        </div>
    </div>

    <div id="incoming-call-modal" class="modal-overlay" style="display:none">
        <div class="modal-box">
            <img id="incoming-avatar" class="avatar-preview">
            <h3 id="incoming-caller-name" style="color:white">Incoming Call</h3>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="acceptCall()" style="flex:1; padding:15px; border-radius:10px; border:none; background:var(--online); color:white; cursor:pointer;">Accept</button>
                <button onclick="rejectCall()" style="flex:1; padding:15px; border-radius:10px; border:none; background:var(--danger); color:white; cursor:pointer;">Decline</button>
            </div>
        </div>
    </div>

    <div id="app-container" style="display:none">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="/static/IC.png" style="height:35px">
                <h3 style="color:white">Chats</h3>
            </div>
            <div class="user-list" id="user-list-container"></div>
        </div>

        <div class="chat-area">
            <header>
                <div class="header-left">
                    <button onclick="document.getElementById('sidebar').classList.add('open')" style="background:none; border:none; color:white; font-size:1.5rem; margin-right:15px; cursor:pointer;">☰</button>
                    <h3 id="chatHeaderTitle" style="color:white">Public Server</h3>
                </div>
                <div class="call-buttons" id="call-buttons-container" style="display:none">
                    <button onclick="startCall(false)" style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer; margin-left:15px;">📞</button>
                    <button onclick="startCall(true)" style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer; margin-left:15px;">🎥</button>
                </div>
            </header>

            <div id="chat-stream"></div>

            <div style="padding: 25px;">
                <div class="input-box">
                    <label for="imgInp" style="cursor:pointer; margin-right:15px; font-size:1.5rem;">➕</label>
                    <input type="file" id="imgInp" style="display:none" onchange="sendImage(event)">
                    <input type="text" id="msg-input" placeholder="Message...">
                    <button onclick="sendMyMessage()" style="background:none; border:none; color:var(--accent-main); font-size:1.8rem; cursor:pointer; margin-left:15px;">➤</button>
                </div>
            </div>

            <div id="call-interface">
                <div class="remote-video-area"><video id="remoteVideo" autoplay playsinline></video></div>
                <div class="local-video-area"><video id="localVideo" autoplay playsinline muted></video></div>
                <div class="call-controls">
                    <button class="call-btn" onclick="flipCamera()">🔄</button>
                    <button class="call-btn" id="toggleVideoBtn" onclick="toggleVideo()">📷</button>
                    <button class="call-btn" id="toggleAudioBtn" onclick="toggleAudio()">🎤</button>
                    <button class="call-btn" onclick="toggleScreenShare()">🖥️</button>
                    <button class="call-btn danger" onclick="endCallBtnClicked()">☎️</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws, myUsername = localStorage.getItem("chat_username"), myPicBase64 = localStorage.getItem("chat_pic"), currentChat = "Public";
        let peerConnection, localStream, activeCallUser, iceQueue = [], userProfiles = {};
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        const chatSound = document.getElementById("chatSound");
        const dialSound = document.getElementById("dialSound");
        const ringSound = document.getElementById("ringSound");

        function processImage(e, tid) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById(tid).src = ev.target.result;
                if(tid === 'login-preview') myPicBase64 = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function manualLogin() {
            myUsername = document.getElementById("usernameInput").value.trim();
            if(!myUsername) return alert("Enter a name");
            localStorage.setItem("chat_username", myUsername);
            localStorage.setItem("chat_pic", myPicBase64);
            startApp();
        }

        function startApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";
            const proto = location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${proto}://${location.host}/ws/${myUsername}`);
            ws.onopen = () => ws.send(JSON.stringify({ pic: myPicBase64 }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if(d.type === "chat") {
                    if(d.sender !== myUsername) chatSound.play().catch(()=>{});
                    drawMessage(d.message, d.sender, d.profile_pic, d.timestamp);
                } else if(d.type === "history") {
                    document.getElementById("chat-stream").innerHTML = "";
                    d.data.forEach(m => drawMessage(m.message, m.sender, m.profile_pic, m.timestamp));
                } else if(d.type === "user_list") {
                    d.data.forEach(u => userProfiles[u.username] = u);
                    updateSidebar(d.data);
                } else if(d.type === "call_offer") { handleIncomingCall(d); }
                else if(d.type === "call_answer") { peerConnection.setRemoteDescription(new RTCSessionDescription(d.sdp)); }
                else if(d.type === "ice_candidate") { peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate)); }
                else if(d.type === "call_end") { forceEndCall(); }
            };
        }

        function updateSidebar(users) {
            const container = document.getElementById('user-list-container');
            container.innerHTML = users.map(u => `
                <div class="user-item ${currentChat === u.username ? 'active' : ''}" onclick="switchChat('${u.username}')">
                    <img src="${u.profile_pic || '/static/IC.png'}">
                    <span>${u.username}</span>
                    <div style="width:10px; height:10px; border-radius:50%; background:${u.status==='Online'?'#00d26a':'#8b929a'}; margin-left:auto;"></div>
                </div>
            `).join('');
        }

        function switchChat(target) {
            currentChat = target;
            document.getElementById("chatHeaderTitle").innerText = target;
            document.getElementById("call-buttons-container").style.display = target === "Public" ? "none" : "flex";
            document.getElementById("chat-stream").innerHTML = "";
            document.getElementById('sidebar').classList.remove('open');
            ws.send(JSON.stringify({ type: "get_history", target: target }));
        }

        function drawMessage(txt, sender, pic, time) {
            const stream = document.getElementById('chat-stream');
            const div = document.createElement('div');
            div.className = 'message';
            const isImg = txt.includes("res.cloudinary.com") || txt.startsWith("data:image/");
            div.innerHTML = `
                <img src="${pic || '/static/IC.png'}" class="msg-avatar">
                <div>
                    <span class="msg-sender">${sender}</span><span class="msg-time">${time || ''}</span>
                    <div class="msg-content">${isImg ? `<img src="${txt}" class="msg-image-attachment" onclick="window.open(this.src)">` : txt}</div>
                </div>
            `;
            stream.appendChild(div);
            stream.scrollTop = stream.scrollHeight;
        }

        function sendMyMessage() {
            const inp = document.getElementById("msg-input");
            if(!inp.value.trim()) return;
            ws.send(JSON.stringify({ type: "chat", msg_id: Date.now().toString(), receiver: currentChat, message: inp.value }));
            inp.value = "";
        }

        function sendImage(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => ws.send(JSON.stringify({ type: "chat", msg_id: Date.now().toString(), receiver: currentChat, message: ev.target.result }));
            reader.readAsDataURL(file);
        }

        // WebRTC System
        async function startCall(video) {
            activeCallUser = currentChat;
            document.getElementById("call-interface").style.display = "flex";
            dialSound.play().catch(()=>{});
            localStream = await navigator.mediaDevices.getUserMedia({ video: video ? {width:1280, height:720} : false, audio: true });
            document.getElementById("localVideo").srcObject = localStream;
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.ontrack = (e) => { document.getElementById("remoteVideo").srcObject = e.streams[0]; dialSound.pause(); };
            peerConnection.onicecandidate = (e) => { if(e.candidate) ws.send(JSON.stringify({type:"ice_candidate", target:activeCallUser, candidate:e.candidate})); };
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: "call_offer", target: activeCallUser, sdp: offer, video: video }));
        }

        function handleIncomingCall(data) {
            activeCallUser = data.sender;
            document.getElementById("incoming-avatar").src = userProfiles[data.sender]?.profile_pic || "";
            document.getElementById("incoming-caller-name").innerText = data.sender;
            document.getElementById("incoming-call-modal").style.display = "flex";
            ringSound.play().catch(()=>{});
        }

        async function acceptCall() {
            ringSound.pause();
            document.getElementById("incoming-call-modal").style.display = "none";
            document.getElementById("call-interface").style.display = "flex";
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("localVideo").srcObject = localStream;
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.ontrack = (e) => { document.getElementById("remoteVideo").srcObject = e.streams[0]; };
            peerConnection.onicecandidate = (e) => { if(e.candidate) ws.send(JSON.stringify({type:"ice_candidate", target:activeCallUser, candidate:e.candidate})); };
            // In a real scenario, you'd handle the offer sdp here properly
            ws.send(JSON.stringify({ type: "call_answer", target: activeCallUser, sdp: "ANSWER_PLACEHOLDER" }));
        }

        function forceEndCall() {
            dialSound.pause(); ringSound.pause();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            if(peerConnection) peerConnection.close();
            document.getElementById("call-interface").style.display = "none";
            document.getElementById("incoming-call-modal").style.display = "none";
        }

        function endCallBtnClicked() { ws.send(JSON.stringify({type:"call_end", target:activeCallUser})); forceEndCall(); }
        document.getElementById("msg-input").onkeypress = (e) => { if(e.key === "Enter") sendMyMessage(); };
    </script>
</body>
</html>
