<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall Ultimate</title>
    <style>
        :root { --bg: #202225; --side: #2f3136; --chat: #36393f; --accent: #5865F2; --text: #dcddde; --muted: #8e9297; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar & Mobile Toggle */
        .sidebar { width: 260px; background: var(--side); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; border-right: 1px solid #202225; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat); position: relative; }
        header { padding: 15px; background: var(--side); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #202225; }
        .mobile-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        /* Message Styles */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 15px; animation: fadeIn 0.3s ease; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .msg-name { font-weight: 600; color: white; margin-right: 10px; }
        .msg-time { font-size: 0.75rem; color: var(--muted); }
        .msg-text { background: #40444b; padding: 10px; border-radius: 8px; margin-top: 5px; word-wrap: break-word; }
        .msg-img { max-width: 300px; border-radius: 8px; margin-top: 5px; cursor: pointer; }

        /* Call UI */
        #call-screen { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; }
        #remote-video { width: 100%; height: 100%; object-fit: contain; }
        #local-video { position: absolute; bottom: 100px; right: 20px; width: 120px; height: 160px; border: 2px solid var(--accent); border-radius: 8px; }
        .call-tools { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.5rem; background: #4f545c; color: white; }
        .btn-hangup { background: #ed4245; }

        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .avatar-preview { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 15px; object-fit: cover; }

        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <label for="pfp-input"><img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"></label>
        <input type="file" id="pfp-input" style="display:none;" onchange="previewImg(event)">
        <input type="text" id="username" placeholder="Username" style="padding:12px; border-radius:4px; border:none; margin-bottom:10px; width:250px;">
        <button onclick="connect()" style="padding:12px 25px; background:var(--accent); color:white; border:none; border-radius:4px; font-weight:600;">Connect</button>
    </div>

    <div class="sidebar" id="sidebar">
        <div style="padding:20px; font-weight:600; border-bottom:1px solid #202225;">Channels</div>
        <div id="user-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
    </div>

    <div class="chat-area" onclick="document.getElementById('sidebar').classList.remove('open')">
        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="mobile-toggle" onclick="event.stopPropagation(); document.getElementById('sidebar').classList.toggle('open')">☰</button>
                <span id="chat-header"># Public Server</span>
            </div>
            <div id="call-btns" style="display:none;">
                <button onclick="startCall(true)" title="Video" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🎥</button>
                <button onclick="startCall(false)" title="Voice" style="background:none; border:none; font-size:1.5rem; cursor:pointer; margin-left:15px;">📞</button>
            </div>
        </header>
        <div id="messages"></div>
        <div style="padding:20px; display:flex; align-items:center; background:var(--side);">
            <label for="img-send" style="cursor:pointer; font-size:1.5rem; margin-right:15px;">＋</label>
            <input type="file" id="img-send" style="display:none;" onchange="sendImage(event)">
            <input type="text" id="msgInput" placeholder="Message..." style="flex:1; padding:12px; background:#40444b; border:none; border-radius:8px; color:white;" onkeypress="if(event.key==='Enter') sendMsg()">
        </div>
    </div>

    <div id="call-screen">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        <div class="call-tools">
            <button class="call-btn" onclick="flipCam()">🔄</button>
            <button class="call-btn btn-hangup" onclick="endCall()">☎️</button>
        </div>
    </div>

    <script>
        let ws, myUser, myPic = "", currentChat = "Public", localStream, peerConn;
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        function previewImg(e) {
            const reader = new FileReader();
            reader.onload = () => { myPic = reader.result; document.getElementById("login-preview").src = myPic; };
            reader.readAsDataURL(e.target.files[0]);
        }

        function connect() {
            myUser = document.getElementById("username").value.trim();
            if(!myUser) return;
            document.getElementById("login-screen").style.display = "none";
            ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${myUser}`);
            ws.onopen = () => ws.send(JSON.stringify({pic: myPic}));
            ws.onmessage = async (e) => {
                const d = JSON.parse(e.data);
                if(d.type === "chat") drawMsg(d);
                if(d.type === "user_list") renderUsers(d.users);
                if(d.type === "history") { document.getElementById("messages").innerHTML = ""; d.data.forEach(drawMsg); }
                if(d.type === "call_offer") handleOffer(d);
                if(d.type === "call_answer") await peerConn.setRemoteDescription(new RTCSessionDescription(d.sdp));
                if(d.type === "ice_candidate") await peerConn.addIceCandidate(new RTCIceCandidate(d.candidate));
                if(d.type === "call_end") resetCall();
            };
        }

        async function startCall(vid) {
            document.getElementById("call-screen").style.display = "block";
            localStream = await navigator.mediaDevices.getUserMedia({video: vid, audio: true});
            document.getElementById("local-video").srcObject = localStream;
            peerConn = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
            peerConn.onicecandidate = (e) => e.candidate && ws.send(JSON.stringify({type:"ice_candidate", target: currentChat, candidate: e.candidate}));
            peerConn.ontrack = (e) => document.getElementById("remote-video").srcObject = e.streams[0];
            const offer = await peerConn.createOffer();
            await peerConn.setLocalDescription(offer);
            ws.send(JSON.stringify({type:"call_offer", target: currentChat, sdp: offer, video: vid}));
        }

        async function handleOffer(d) {
            if(!confirm(`Call from ${d.sender}. Accept?`)) return;
            document.getElementById("call-screen").style.display = "block";
            localStream = await navigator.mediaDevices.getUserMedia({video: d.video, audio: true});
            document.getElementById("local-video").srcObject = localStream;
            peerConn = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
            peerConn.onicecandidate = (e) => e.candidate && ws.send(JSON.stringify({type:"ice_candidate", target: d.sender, candidate: e.candidate}));
            peerConn.ontrack = (e) => document.getElementById("remote-video").srcObject = e.streams[0];
            await peerConn.setRemoteDescription(new RTCSessionDescription(d.sdp));
            const ans = await peerConn.createAnswer();
            await peerConn.setLocalDescription(ans);
            ws.send(JSON.stringify({type:"call_answer", target: d.sender, sdp: ans}));
        }

        function drawMsg(d) {
            const m = document.getElementById("messages");
            const isImg = d.content.includes("res.cloudinary.com");
            const content = isImg ? `<img src="${d.content}" class="msg-img" onclick="window.open(this.src)">` : `<div class="msg-text">${d.content}</div>`;
            m.innerHTML += `
                <div class="message">
                    <img src="${d.profile_pic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="msg-avatar">
                    <div class="msg-body">
                        <div class="msg-header"><span class="msg-name">${d.sender}</span><span class="msg-time">${d.timestamp || ''}</span></div>
                        ${content}
                    </div>
                </div>`;
            m.scrollTop = m.scrollHeight;
        }

        function renderUsers(users) {
            const list = document.getElementById("user-list");
            list.innerHTML = `<div style="padding:10px; border-radius:4px; cursor:pointer;" onclick="switchChat('Public')"># Public Server</div>`;
            users.forEach(u => {
                if(u.username === myUser) return;
                list.innerHTML += `
                    <div style="display:flex; align-items:center; padding:10px; cursor:pointer;" onclick="switchChat('${u.username}')">
                        <img src="${u.profile_pic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" style="width:30px; height:30px; border-radius:50%; margin-right:10px;">
                        <span>${u.username}</span>
                        <div style="width:8px; height:8px; border-radius:50%; margin-left:auto; background:${u.status==='Online'?'#3ba55d':'#747f8d'}"></div>
                    </div>`;
            });
        }

        function switchChat(u) {
            currentChat = u;
            document.getElementById("chat-header").innerText = u === "Public" ? "# Public Server" : "@ " + u;
            document.getElementById("call-btns").style.display = u === "Public" ? "none" : "flex";
            ws.send(JSON.stringify({type: "get_history", target: u}));
        }

        function sendMsg() {
            const i = document.getElementById("msgInput");
            if(!i.value) return;
            ws.send(JSON.stringify({type:"chat", receiver: currentChat, content: i.value, pic: myPic}));
            i.value = "";
        }

        function sendImage(e) {
            const r = new FileReader();
            r.onload = () => ws.send(JSON.stringify({type:"chat", receiver: currentChat, content: r.result, pic: myPic}));
            r.readAsDataURL(e.target.files[0]);
        }

        function endCall() { ws.send(JSON.stringify({type:"call_end", target: currentChat})); resetCall(); }
        function resetCall() { if(localStream) localStream.getTracks().forEach(t=>t.stop()); document.getElementById("call-screen").style.display="none"; }
    </script>
</body>
</html>
