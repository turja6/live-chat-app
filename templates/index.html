<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall - Connected</title>
    <link rel="icon" type="image/png" href="/static/IC.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* === ULTRA-MODERN ORANGE THEME === */
        :root {
            --bg-deep: #0f1013;
            --bg-panel: #16181c;
            --bg-glass: rgba(22, 24, 28, 0.7);
            --text-main: #f1f1f1;
            --text-muted: #8b929a;
            
            /* Professional Orange Gradient & Accents */
            --accent-glow: rgba(255, 122, 0, 0.4);
            --accent-main: #FF7A00;
            --accent-light: #FFA040;
            --gradient-orange: linear-gradient(135deg, #FF7A00 0%, #FF9800 100%);
            
            --online: #00d26a;
            --danger: #f23f42;
            --sidebar-width: 280px;
            --border-subtle: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* === ANIMATIONS === */
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 var(--accent-glow); }
            70% { box-shadow: 0 0 0 15px rgba(255, 122, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 122, 0, 0); }
        }

        /* === MODALS (Login, Settings, Incoming Call) === */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            animation: fadeIn 0.3s ease-out;
        }
        .modal-box {
            background: var(--bg-panel); border: 1px solid var(--border-subtle);
            padding: 35px; border-radius: 24px; width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-box input {
            width: 100%; padding: 14px 18px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.03); color: white; outline: none; font-size: 1rem; transition: 0.2s;
        }
        .modal-box input:focus { border-color: var(--accent-main); background: rgba(255,122,0,0.05); }
        
        .modal-box button {
            width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600;
            background: var(--gradient-orange); color: white; font-size: 1rem; cursor: pointer;
            transition: all 0.2s ease; margin-bottom: 12px; box-shadow: 0 4px 15px var(--accent-glow);
        }
        .modal-box button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); filter: brightness(1.1); }
        .modal-box button.cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-subtle); box-shadow: none; }
        .modal-box button.cancel:hover { background: rgba(255,255,255,0.05); transform: none; }
        .modal-box button.danger { background: var(--danger); box-shadow: 0 4px 15px rgba(242, 63, 66, 0.3); }

        .app-logo { height: 65px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(255,122,0,0.3)); }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid var(--accent-main); padding: 3px; background: var(--bg-deep); }
        .pulse-avatar { animation: pulseGlow 1.5s infinite; border: 3px solid var(--accent-main); }

        /* === LAYOUT === */
        #app-container { display: none; width: 100%; height: 100%; }

        /* === SIDEBAR (DMs) === */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-deep);
            border-right: 1px solid var(--border-subtle);
            display: flex; flex-direction: column; z-index: 20; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sidebar-header {
            height: 70px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }
        .user-list { flex: 1; overflow-y: auto; padding: 16px 12px; }
        .user-list::-webkit-scrollbar { display: none; } /* Hide scrollbar for clean look */
        
        .user-item {
            display: flex; align-items: center; padding: 10px 12px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s; margin-bottom: 4px; position: relative;
        }
        .user-item:hover { background: rgba(255,255,255,0.03); }
        .user-item.active { background: rgba(255, 122, 0, 0.1); color: var(--accent-light); }
        .user-item.active::before {
            content: ''; position: absolute; left: 0; top: 15%; height: 70%; width: 4px;
            background: var(--accent-main); border-radius: 0 4px 4px 0;
        }
        
        .user-item img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; margin-right: 14px; border: 1px solid rgba(255,255,255,0.1); }
        .user-item span { font-weight: 500; font-size: 0.95rem; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; border: 2px solid var(--bg-deep); }
        .online { background: var(--online); box-shadow: 0 0 8px rgba(0, 210, 106, 0.4); }
        .offline { background: var(--text-muted); }
        .unread-badge { background: var(--gradient-orange); color: white; font-size: 11px; font-weight: 700; border-radius: 12px; padding: 2px 8px; margin-left: auto; box-shadow: 0 2px 8px var(--accent-glow); }

        /* === MAIN CHAT AREA === */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; background: var(--bg-panel); }
        
        header {
            height: 70px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle); z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .mobile-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .chat-title { font-size: 1.15rem; font-weight: 600; color: white; letter-spacing: 0.3px; }
        
        .call-buttons button { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); color: var(--text-main); 
            font-size: 1.2rem; cursor: pointer; transition: all 0.2s; margin-left: 12px;
            width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
        }
        .call-buttons button:hover { background: rgba(255, 122, 0, 0.15); color: var(--accent-light); border-color: var(--accent-main); transform: translateY(-2px); }

        #chat-stream {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
        }
        #chat-stream::-webkit-scrollbar { width: 8px; }
        #chat-stream::-webkit-scrollbar-thumb { background: var(--bg-deep); border-radius: 4px; }

        /* Message Bubbles (Modern Layout) */
        .message { 
            display: flex; align-items: flex-start; position: relative; 
            border-radius: 12px; padding: 8px 16px; margin: 0 -16px;
            animation: slideInUp 0.3s ease-out forwards;
            transition: background 0.2s;
        }
        .message:hover { background: rgba(255,255,255,0.02); }
        .msg-avatar { width: 44px; height: 44px; border-radius: 50%; margin-right: 16px; object-fit: cover; margin-top: 2px; border: 1px solid var(--border-subtle); }
        
        .msg-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
        .msg-sender { font-weight: 600; color: white; font-size: 1.05rem; }
        .msg-time { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }

        .msg-content { color: var(--text-main); font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .msg-image-attachment { 
            max-width: 350px; max-height: 350px; border-radius: 16px; margin-top: 10px; 
            object-fit: cover; cursor: zoom-in; border: 1px solid var(--border-subtle);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        .msg-image-attachment:hover { transform: scale(1.02); }

        /* Floating Input Area */
        .input-wrapper { padding: 0 24px 24px 24px; position: relative; background: transparent; }
        .input-box { 
            display: flex; align-items: center; background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border-subtle); border-radius: 20px; padding: 8px 16px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); transition: all 0.3s ease;
        }
        .input-box:focus-within { border-color: rgba(255, 122, 0, 0.5); box-shadow: 0 8px 24px var(--accent-glow); background: rgba(255,255,255,0.05); }
        
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 1rem; outline: none; padding: 8px 0; }
        .input-box input::placeholder { color: var(--text-muted); }
        
        .action-btn { 
            background: none; border: none; color: var(--text-muted); font-size: 1.2rem; 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .attach-btn { background: rgba(255,255,255,0.05); color: white; border-radius: 50%; width: 34px; height: 34px; margin-right: 15px; }
        .attach-btn:hover { background: rgba(255,255,255,0.1); transform: rotate(90deg); }
        
        .send-btn { 
            color: white; background: var(--gradient-orange); width: 38px; height: 38px; 
            border-radius: 50%; margin-left: 12px; box-shadow: 0 4px 10px var(--accent-glow);
        }
        .send-btn:hover { transform: scale(1.1); filter: brightness(1.1); }

        /* === EFFICIENT CALLING SYSTEM UI === */
        #call-interface {
            display: none; position: absolute; inset: 0; background: #000; z-index: 150;
            flex-direction: column; overflow: hidden; animation: fadeIn 0.3s ease;
        }
        #call-interface:fullscreen { width: 100vw; height: 100vh; }
        
        .call-top-bar { position: absolute; top: 24px; left: 24px; right: 24px; display: flex; justify-content: center; z-index: 160; pointer-events: none; }
        .call-status { 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); color: white; 
            padding: 8px 20px; border-radius: 20px; font-weight: 500; font-size: 0.95rem; 
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .remote-video-area { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .remote-video-area video { width: 100%; height: 100%; object-fit: contain; }
        
        .local-video-area {
            position: absolute; bottom: 100px; right: 24px; width: 180px; height: 260px;
            background: #111; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255, 122, 0, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 160; cursor: grab; transition: border-color 0.3s;
        }
        .local-video-area:hover { border-color: var(--accent-main); }
        .local-video-area video { width: 100%; height: 100%; object-fit: cover; }
        .local-video-area:active { cursor: grabbing; }

        /* Professional Floating Controls */
        .call-controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 16px; background: rgba(30, 32, 36, 0.85); padding: 12px 24px;
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); z-index: 170;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .call-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 1.3rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255,255,255,0.1); color: white;
        }
        .call-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .call-btn.active { background: white; color: black; }
        .call-btn.danger { background: var(--danger); width: 65px; border-radius: 32px; box-shadow: 0 4px 15px rgba(242, 63, 66, 0.4); }
        .call-btn.danger:hover { background: #ff474a; box-shadow: 0 6px 20px rgba(242, 63, 66, 0.6); }

        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.7); }
            .sidebar.open { transform: translateX(0); }
            .call-controls { width: 92%; gap: 10px; padding: 12px; justify-content: space-around; bottom: 20px; }
            .call-btn { width: 45px; height: 45px; font-size: 1.1rem; }
            .local-video-area { width: 110px; height: 160px; bottom: 100px; right: 16px; }
            .msg-image-attachment { max-width: 100%; }
        }
    </style>
</head>
<body>

    <audio id="chatSound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3" preload="auto"></audio>
    <audio id="ringSound" src="https://cdn.pixabay.com/audio/2022/01/18/audio_511d1796d4.mp3" loop preload="auto"></audio>
    <audio id="dialSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_78ec79524c.mp3" loop preload="auto"></audio>

    <div id="login-screen" class="modal-overlay">
        <div class="modal-box">
            <img src="/static/IC.png" alt="IdlyCall Logo" class="app-logo">
            <h2 style="margin-bottom: 24px; color: white; font-weight: 700;">Welcome Back</h2>
            <img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png">
            <label for="login-file" style="display: block; color: var(--accent-light); cursor: pointer; margin-bottom: 15px; font-weight: 500;">📷 Upload Avatar</label>
            <input type="file" id="login-file" accept="image/*" style="display:none;" onchange="processImage(event, 'login-preview')">
            <input type="text" id="usernameInput" placeholder="Enter Username" autocomplete="off">
            <button onclick="manualLogin()">Connect</button>
        </div>
    </div>

    <div id="settings-screen" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2 style="margin-bottom: 24px; color: white;">User Settings</h2>
            <img id="settings-preview" class="avatar-preview" src="">
            <label for="settings-file" style="display: block; color: var(--accent-light); cursor: pointer; margin-bottom: 15px; font-weight: 500;">📷 Change Avatar</label>
            <input type="file" id="settings-file" accept="image/*" style="display:none;" onchange="processImage(event, 'settings-preview')">
            <input type="text" id="settingsNameInput" placeholder="New Username" autocomplete="off">
            <button onclick="saveSettings()">Save Changes</button>
            <button class="cancel" onclick="document.getElementById('settings-screen').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="incoming-call-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <img id="incoming-avatar" class="avatar-preview pulse-avatar" src="">
            <h3 id="incoming-caller-name" style="margin-bottom: 8px; color: white; font-size: 1.4rem;">Caller</h3>
            <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem;">is calling you via WebRTC...</p>
            <div style="display: flex; gap: 12px;">
                <button style="background: var(--online); box-shadow: 0 4px 15px rgba(0, 210, 106, 0.3);" onclick="acceptCall()">Accept</button>
                <button class="danger" onclick="rejectCall()">Decline</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="/static/IC.png" alt="IdlyCall" style="height: 35px; object-fit: contain;">
                <button style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size: 1.3rem; transition: 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-muted)'" onclick="openSettings()" title="Settings">⚙️</button>
            </div>
            <div class="user-list" id="user-list-container">
                </div>
        </div>

        <div class="chat-area" onclick="document.getElementById('sidebar').classList.remove('open')">
            <header>
                <div class="header-left">
                    <button class="mobile-toggle" onclick="event.stopPropagation(); document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <span style="color:var(--text-muted); margin-right:8px; font-size:1.4rem; font-weight:300;">#</span>
                    <div class="chat-title" id="chatHeaderTitle">Public Server</div>
                </div>
                <div class="call-buttons" id="call-buttons-container" style="display: none;">
                    <button onclick="startCall(false)" title="Voice Call">📞</button>
                    <button onclick="startCall(true)" title="Video Call">🎥</button>
                </div>
            </header>

            <div id="chat-stream"></div>

            <div class="input-wrapper">
                <div class="input-box">
                    <label for="imageAttachInput" class="action-btn attach-btn" title="Attach Image">＋</label>
                    <input type="file" id="imageAttachInput" accept="image/*" style="display: none;" onchange="sendImage(event)">
                    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
                    <button class="action-btn send-btn" onclick="sendMyMessage()">➤</button>
                </div>
            </div>

            <div id="call-interface">
                <div class="call-top-bar">
                    <div class="call-status" id="call-status">Connecting securely...</div>
                </div>
                <div class="remote-video-area">
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
                <div class="local-video-area" id="localWrapper">
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>
                <div class="call-controls">
                    <button class="call-btn" onclick="flipCamera()" title="Flip Camera">🔄</button>
                    <button class="call-btn active" id="toggleVideoBtn" onclick="toggleVideo()" title="Camera">📷</button>
                    <button class="call-btn active" id="toggleAudioBtn" onclick="toggleAudio()" title="Microphone">🎤</button>
                    <button class="call-btn" id="shareScreenBtn" onclick="toggleScreenShare()" title="Share Screen">🖥️</button>
                    <button class="call-btn" id="fullscreenBtn" onclick="toggleFullScreen()" title="Full Screen">⛶</button>
                    <button class="call-btn danger" onclick="endCallBtnClicked()" title="Disconnect">☎️</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === STATE ===
        let ws;
        let myUsername = localStorage.getItem("chat_username");
        let myPicBase64 = localStorage.getItem("chat_pic") || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
        let currentChat = "Public";
        let userProfiles = {};
        let unreadCounts = {};

        // Audio Setup with safe play catch for browser autoplay policies
        const chatSound = document.getElementById("chatSound"); chatSound.volume = 0.2;
        const ringSound = document.getElementById("ringSound"); ringSound.volume = 0.5;
        const dialSound = document.getElementById("dialSound"); dialSound.volume = 0.4;
        
        function safePlayAudio(audioElement) {
            audioElement.play().catch(e => console.log("Browser autoplay blocked audio until user interaction."));
        }

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        // === NOTIFICATION API ===
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }
        function notifyUser(title, body) {
            if ("Notification" in window && Notification.permission === "granted" && document.visibilityState !== "visible") {
                new Notification(title, { body: body, icon: myPicBase64 });
            }
        }

        window.onload = () => {
            if (myUsername && localStorage.getItem("chat_pic")) {
                document.getElementById("usernameInput").value = myUsername;
                startApp();
            }
        };

        // === PROFILE & LOGIN ===
        function processImage(e, targetId) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > 800) { height *= 800 / width; width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    const b64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById(targetId).src = b64;
                    if(targetId === 'login-preview') myPicBase64 = b64;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function manualLogin() {
            myUsername = document.getElementById("usernameInput").value.trim();
            if (!myUsername) return alert("Username required!");
            localStorage.setItem("chat_username", myUsername);
            localStorage.setItem("chat_pic", myPicBase64);
            // Playing a silent sound on login to explicitly unlock browser audio autoplay
            chatSound.play().catch(e=>{}); 
            chatSound.pause();
            chatSound.currentTime = 0;
            startApp();
        }

        function openSettings() {
            document.getElementById("settingsNameInput").value = myUsername;
            document.getElementById("settings-preview").src = myPicBase64;
            document.getElementById("settings-screen").style.display = "flex";
        }

        function saveSettings() {
            const newName = document.getElementById("settingsNameInput").value.trim();
            if(newName) myUsername = newName;
            myPicBase64 = document.getElementById("settings-preview").src;
            localStorage.setItem("chat_username", myUsername);
            localStorage.setItem("chat_pic", myPicBase64);
            if(ws) ws.send(JSON.stringify({ type: "update_settings", pic: myPicBase64, new_name: myUsername }));
            window.location.reload();
        }

        // === WEBSOCKET CONNECTION ===
        function startApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";
            requestNotificationPermission();

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);
            ws.onopen = () => { ws.send(JSON.stringify({ pic: myPicBase64 })); };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === "chat") {
                    if (data.sender !== myUsername) {
                        safePlayAudio(chatSound);
                        notifyUser(`New message from ${data.sender}`, data.message.startsWith("data:image") ? "Sent an image" : data.message);
                    }
                    if ((currentChat === "Public" && data.receiver === "Public") || 
                        (currentChat !== "Public" && (data.sender === currentChat || (data.sender === myUsername && data.receiver === currentChat)))) {
                        drawMessage(data.message, data.sender, data.profile_pic, new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
                    } else if (data.sender !== myUsername) {
                        const trackTarget = data.receiver === "Public" ? "Public" : data.sender;
                        unreadCounts[trackTarget] = (unreadCounts[trackTarget] || 0) + 1;
                        updateSidebar(Object.values(userProfiles).map(p => ({username: p.name, profile_pic: p.pic, status: p.status}))); 
                    }
                }
                else if (data.type === "call_offer") { handleIncomingCall(data); }
                else if (data.type === "call_answer") { handleAnswer(data.sdp); }
                else if (data.type === "ice_candidate") { handleIceCandidate(data.candidate); }
                else if (data.type === "call_end") { forceEndCall(); }
                else if (data.type === "history") {
                    document.getElementById('chat-stream').innerHTML = ""; 
                    data.data.forEach(msg => drawMessage(msg.message, msg.sender, msg.profile_pic, msg.timestamp || ""));
                }
                else if (data.type === "user_list") { 
                    data.data.forEach(u => userProfiles[u.username] = {name: u.username, pic: u.profile_pic, status: u.status});
                    updateSidebar(data.data); 
                }
            };
        }

        // === UI LOGIC ===
        function updateSidebar(users) {
            const container = document.getElementById('user-list-container');
            let pubBadge = unreadCounts["Public"] ? `<span class="unread-badge">${unreadCounts["Public"]}</span>` : "";
            let html = `<div class="user-item ${currentChat === 'Public' ? 'active' : ''}" onclick="switchChat('Public')">
                            <img src="https://cdn-icons-png.flaticon.com/512/1256/1256650.png" style="border-radius:0;">
                            <span>Public Server</span>${pubBadge}
                        </div>`;
            users.forEach(user => {
                if (user.username === myUsername) return;
                let badge = unreadCounts[user.username] ? `<span class="unread-badge">${unreadCounts[user.username]}</span>` : "";
                html += `<div class="user-item ${currentChat === user.username ? 'active' : ''}" onclick="switchChat('${user.username}')">
                            <img src="${user.profile_pic}">
                            <span>${user.username}</span>${badge}
                            <div class="status-dot ${user.status === 'Online' ? 'online' : 'offline'}"></div>
                         </div>`;
            });
            container.innerHTML = html;
        }

        function switchChat(target) {
            currentChat = target;
            unreadCounts[target] = 0;
            document.getElementById("chatHeaderTitle").innerText = target;
            document.getElementById("msg-input").placeholder = `Message @${target}...`;
            document.getElementById("call-buttons-container").style.display = target === "Public" ? "none" : "flex";
            document.getElementById('chat-stream').innerHTML = "";
            document.getElementById('sidebar').classList.remove('open');
            ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            updateSidebar(Object.values(userProfiles).map(p => ({username: p.name, profile_pic: p.pic, status: p.status})));
        }

        function drawMessage(text, senderName, picUrl, time) {
            const stream = document.getElementById('chat-stream');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message`;
            
            let safePic = picUrl || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
            
            // Check if it's a local upload OR a Cloudinary cloud link
            let isImage = text.startsWith("data:image/") || text.includes("res.cloudinary.com");
            
            let contentHtml = isImage 
                ? `<img src="${text}" class="msg-image-attachment" onclick="window.open(this.src, '_blank')" title="Click to open full size">` 
                : `<div class="msg-content">${text}</div>`;
                
            msgDiv.innerHTML = `
                <img src="${safePic}" class="msg-avatar">
                <div>
                    <div class="msg-header">
                        <span class="msg-sender">${senderName}</span>
                        <span class="msg-time">${time}</span>
                    </div>
                    ${contentHtml}
                </div>
            `;
            stream.appendChild(msgDiv);
            stream.scrollTo({ top: stream.scrollHeight, behavior: 'smooth' });
        }

        function sendMyMessage() {
            const input = document.getElementById("msg-input");
            const val = input.value.trim();
            if (ws && val) { 
                ws.send(JSON.stringify({ type: "chat", msg_id: generateId(), receiver: currentChat, message: val })); 
                input.value = ''; 
            }
        }
        document.getElementById("msg-input").addEventListener("keypress", (e) => { if (e.key === "Enter") sendMyMessage(); });

        function sendImage(e) {
            const file = e.target.files[0]; if (!file) return; 
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                    if (width > 1200) { height *= 1200 / width; width = 1200; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    ws.send(JSON.stringify({ type: "chat", msg_id: generateId(), receiver: currentChat, message: canvas.toDataURL('image/jpeg', 0.8) }));
                }; img.src = event.target.result;
            }; reader.readAsDataURL(file); e.target.value = '';
        }

        // === FULLSCREEN SYSTEM ===
        function toggleFullScreen() {
            const callElem = document.getElementById("call-interface");
            if (!document.fullscreenElement) {
                callElem.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen mode: ${err.message}`);
                });
                document.getElementById("fullscreenBtn").innerText = "🗗"; // Change icon
            } else {
                document.exitFullscreen();
                document.getElementById("fullscreenBtn").innerText = "⛶"; // Revert icon
            }
        }

        // === HD WEBRTC CALL ENGINE ===
        let peerConnection, localStream, screenStream, activeCallUser = null, incomingOfferData = null, iceCandidateQueue = [];
        let isVideoOn = true, isAudioOn = true, isSharingScreen = false, currentFacingMode = "user";
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        
        function updateCallStatus(msg) { document.getElementById("call-status").innerText = msg; }

        async function initMedia(videoReq) {
            try {
                // HD 1080p Video Constraints and Noise Cancellation
                const constraints = {
                    video: videoReq ? { 
                        facingMode: currentFacingMode, 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 },
                        frameRate: { ideal: 30 }
                    } : false, 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById("localVideo").srcObject = localStream;
                isVideoOn = videoReq; isAudioOn = true;
                document.getElementById("toggleVideoBtn").classList.toggle("active", isVideoOn);
                document.getElementById("toggleAudioBtn").classList.toggle("active", isAudioOn);
                return true;
            } catch (e) { alert("Camera/Microphone access denied."); return false; }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = e => { 
                document.getElementById("remoteVideo").srcObject = e.streams[0]; 
                dialSound.pause(); ringSound.pause();
                updateCallStatus("Connected");
            };
            peerConnection.onicecandidate = e => { if (e.candidate) ws.send(JSON.stringify({ type: "ice_candidate", target: activeCallUser, candidate: e.candidate })); };
        }

        async function startCall(videoReq) {
            activeCallUser = currentChat;
            document.getElementById("call-interface").style.display = "flex";
            updateCallStatus("Ringing...");
            safePlayAudio(dialSound);
            if (!await initMedia(videoReq)) { dialSound.pause(); return forceEndCall(); }
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: "call_offer", target: activeCallUser, sdp: offer, video: videoReq }));
        }

        function handleIncomingCall(data) {
            incomingOfferData = data;
            document.getElementById("incoming-caller-name").innerText = data.sender;
            document.getElementById("incoming-avatar").src = userProfiles[data.sender]?.pic || "/static/IC.png";
            document.getElementById("incoming-call-modal").style.display = "flex";
            safePlayAudio(ringSound);
            notifyUser(`Incoming call from ${data.sender}`, "IdlyCall Ringing");
        }

        async function acceptCall() {
            ringSound.pause(); document.getElementById("incoming-call-modal").style.display = "none";
            if (currentChat !== incomingOfferData.sender) switchChat(incomingOfferData.sender);
            document.getElementById("call-interface").style.display = "flex";
            updateCallStatus("Connecting...");
            activeCallUser = incomingOfferData.sender;
            if (!await initMedia(incomingOfferData.video)) return forceEndCall();
            createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData.sdp));
            while (iceCandidateQueue.length > 0) peerConnection.addIceCandidate(iceCandidateQueue.shift()).catch(e=>{});
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "call_answer", target: activeCallUser, sdp: answer }));
        }

        function rejectCall() { 
            ringSound.pause(); document.getElementById("incoming-call-modal").style.display = "none";
            if (incomingOfferData) ws.send(JSON.stringify({ type: "call_end", target: incomingOfferData.sender }));
            incomingOfferData = null; 
        }

        async function handleAnswer(sdp) {
            dialSound.pause();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(sdp));
            while (iceCandidateQueue.length > 0) peerConnection.addIceCandidate(iceCandidateQueue.shift()).catch(e=>{});
        }

        async function handleIceCandidate(c) {
            const rtcC = new RTCIceCandidate(c);
            if (peerConnection && peerConnection.remoteDescription) { try { await peerConnection.addIceCandidate(rtcC); } catch(e){} } 
            else { iceCandidateQueue.push(rtcC); }
        }

        function toggleAudio() {
            if (!localStream) return;
            isAudioOn = !isAudioOn; localStream.getAudioTracks()[0].enabled = isAudioOn;
            document.getElementById("toggleAudioBtn").classList.toggle("active", isAudioOn);
        }

        async function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) { videoTrack.enabled = !videoTrack.enabled; isVideoOn = videoTrack.enabled; }
            document.getElementById("toggleVideoBtn").classList.toggle("active", isVideoOn);
        }

        async function flipCamera() {
            if (!localStream || isSharingScreen) return;
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            const oldT = localStream.getVideoTracks()[0]; if(oldT) oldT.stop();
            try {
                // HD constraints for back camera
                const newS = await navigator.mediaDevices.getUserMedia({ video: { facingMode: {exact: currentFacingMode}, width: {ideal: 1920}, height: {ideal: 1080} } });
                const newT = newS.getVideoTracks()[0];
                localStream.removeTrack(oldT); localStream.addTrack(newT);
                document.getElementById("localVideo").srcObject = localStream;
                if(peerConnection) { const sender = peerConnection.getSenders().find(s=>s.track && s.track.kind==="video"); if(sender) sender.replaceTrack(newT); }
            } catch(e) { currentFacingMode = currentFacingMode === "user" ? "environment" : "user"; }
        }

        async function toggleScreenShare() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) { alert("Mobile browsers do not support screen sharing."); return; }
            if (!peerConnection) return;
            
            try {
                if (!isSharingScreen) {
                    // HD constraints for Screen Share
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { width: {ideal: 1920}, height: {ideal: 1080}, frameRate: {ideal: 30} }, audio: true });
                    const screenTrack = screenStream.getVideoTracks()[0];
                    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(screenTrack);
                    document.getElementById('localVideo').srcObject = screenStream;
                    isSharingScreen = true; document.getElementById("shareScreenBtn").classList.add("active");
                    screenTrack.onended = stopScreenShare;
                } else { stopScreenShare(); }
            } catch (e) {}
        }

        function stopScreenShare() {
            if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            const cameraTrack = localStream.getVideoTracks()[0];
            const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender && cameraTrack) sender.replaceTrack(cameraTrack); 
            document.getElementById('localVideo').srcObject = localStream;
            isSharingScreen = false; document.getElementById("shareScreenBtn").classList.remove("active");
        }

        function endCallBtnClicked() { if (activeCallUser) ws.send(JSON.stringify({ type: "call_end", target: activeCallUser })); forceEndCall(); }

        function forceEndCall() {
            dialSound.pause(); ringSound.pause();
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
            iceCandidateQueue = []; activeCallUser = null; incomingOfferData = null; isSharingScreen = false;
            document.getElementById("shareScreenBtn").classList.remove("active");
            if (document.fullscreenElement) { document.exitFullscreen(); document.getElementById("fullscreenBtn").innerText = "⛶"; }
            document.getElementById("call-interface").style.display = "none";
            document.getElementById("incoming-call-modal").style.display = "none";
        }

        /* PiP Draggable Video */
        const dragItem = document.getElementById("localWrapper");
        let active = false, currentX, currentY, initialX, initialY, xOff = 0, yOff = 0;
        function dragStart(e) { if(e.type==="touchstart"){initialX=e.touches[0].clientX-xOff;initialY=e.touches[0].clientY-yOff;}else{initialX=e.clientX-xOff;initialY=e.clientY-yOff;} if(dragItem.contains(e.target)){active=true;} }
        function dragEnd() { initialX=currentX; initialY=currentY; active=false; }
        function drag(e) { if(active) { e.preventDefault(); if(e.type==="touchmove"){currentX=e.touches[0].clientX-initialX;currentY=e.touches[0].clientY-initialY;}else{currentX=e.clientX-initialX;currentY=e.clientY-initialY;} xOff=currentX;yOff=currentY; dragItem.style.transform="translate3d("+currentX+"px, "+currentY+"px, 0)"; } }
        document.addEventListener("touchstart", dragStart, {passive:false}); document.addEventListener("touchend", dragEnd); document.addEventListener("touchmove", drag, {passive:false});
        document.addEventListener("mousedown", dragStart); document.addEventListener("mouseup", dragEnd); document.addEventListener("mousemove", drag);
    </script>
</body>
</html>
