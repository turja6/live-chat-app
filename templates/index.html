<div id="login-screen" class="modal-overlay">
    <div class="modal-box">
        <h2 style="color: var(--accent); font-size: 1.5rem;">IC</h2>
        <h3>IdlyCall</h3>
        
        <div class="avatar-section">
            <img id="login-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png">
            <input type="file" id="login-file" hidden onchange="processImage(event, 'login-preview')">
            <label for="login-file" class="upload-label">📷 Change Photo</label>
        </div>

        <input type="text" id="usernameInput" placeholder="Enter username...">
        <button onclick="window.manualLogin()" class="primary-btn">Connect</button>
    </div>
</div>
