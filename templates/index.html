<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barebones Chat</title>
    <style>
        body { font-family: sans-serif; background: #1e1e24; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #login-screen { background: #2b2b36; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #login-screen input { padding: 12px; border-radius: 4px; border: none; width: 200px; margin-bottom: 15px; }
        #login-screen button { padding: 12px 20px; border: none; background: #ff9800; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        
        #chat-screen { display: none; width: 100%; max-width: 500px; height: 80vh; background: #2b2b36; border-radius: 8px; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { background: #3a3a47; padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; }
        .msg strong { color: #ff9800; margin-right: 5px; }
        .sys-msg { text-align: center; color: #8e9297; font-size: 0.85rem; font-style: italic; }
        
        #input-area { display: flex; padding: 15px; background: #202225; }
        #input-area input { flex: 1; padding: 12px; border-radius: 4px; border: none; background: #40444b; color: white; outline: none; }
        #input-area button { padding: 12px 20px; border: none; background: #ff9800; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>

    <!-- Simple Login -->
    <div id="login-screen">
        <h2 style="margin-top:0;">Join Chat</h2>
        <input type="text" id="username" placeholder="Enter your name" autocomplete="off"><br>
        <button id="connectBtn" onclick="connect()">Connect</button>
    </div>

    <!-- Simple Chat -->
    <div id="chat-screen">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        let ws;
        let heartbeat;

        function connect() {
            const username = document.getElementById("username").value.trim();
            if (!username) return alert("Please enter a name");

            // Hard switch the UI instantly. No complicated modals.
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";

            // Connect WebSocket
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/${username}`);

            ws.onopen = () => {
                // Render Keep-Alive heartbeat
                heartbeat = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
                }, 20000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const msgs = document.getElementById("messages");
                
                if (data.type === "history") {
                    msgs.innerHTML = "";
                    data.data.forEach(m => addMessage(m.sender, m.content));
                } else if (data.type === "chat") {
                    addMessage(data.sender, data.content);
                } else if (data.type === "system") {
                    msgs.innerHTML += `<div class="sys-msg">${data.content}</div>`;
                    msgs.scrollTop = msgs.scrollHeight;
                }
            };

            ws.onclose = () => {
                clearInterval(heartbeat);
                alert("Connection lost. Please refresh the page.");
            };
        }

        function addMessage(sender, text) {
            const msgs = document.getElementById("messages");
            msgs.innerHTML += `<div class="msg"><strong>${sender}:</strong> ${text}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "chat", content: text }));
                input.value = "";
            }
        }
    </script>
</body>
</html>
