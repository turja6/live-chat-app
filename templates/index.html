<!DOCTYPE html>
<html>
<head>
    <title>Live Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #ece5dd; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; }
        #messages { height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .msg { padding: 10px 15px; border-radius: 20px; background: white; width: fit-content; max-width: 80%; word-wrap: break-word; }
        .input-area { display: flex; padding: 15px; background: #f0f0f0; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { background: #128C7E; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-left: 10px; cursor: pointer; }
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2 style="margin: 0;">Live Chat</h2>
    </div>
    
    <div id="messages"></div>
    
    <div class="input-area" id="setup-area">
        <input type="text" id="usernameInput" placeholder="Enter your name..." autocomplete="off"/>
        <button onclick="connect()">Join Chat</button>
    </div>

    <div class="input-area" id="chat-area" style="display: none;">
        <input type="text" id="messageText" placeholder="Type a message..." autocomplete="off"/>
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let ws;

    function connect() {
        const username = document.getElementById("usernameInput").value;
        if (!username) return alert("Please enter a name first!");

        // Connect to the WebSocket (dynamically uses wss:// for cloud or ws:// for local)
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${window.location.host}/ws/${username}`);
        
        ws.onmessage = function(event) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'msg';
            messageDiv.textContent = event.data;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight; // Auto-scroll to bottom
        };

        // Switch UI from "Join" to "Chat"
        document.getElementById("setup-area").style.display = "none";
        document.getElementById("chat-area").style.display = "flex";
    }

    function sendMessage() {
        const input = document.getElementById("messageText");
        if (ws && input.value) {
            ws.send(input.value);
            input.value = '';
        }
    }

    // Allow pressing "Enter" to send
    document.getElementById("messageText").addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });
</script>
</body>
</html>
