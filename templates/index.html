<!DOCTYPE html>
<html>
<head>
    <title>Chat Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --bg-dark: #202225; --bg-mid: #2f3136; --bg-light: #36393f; --text-main: #dcddde; --text-muted: #8e9297; --accent: #5865F2; --online: #3ba55d; --offline: #747f8d; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }
        
        /* Modals (Login & Settings) */
        .modal-overlay { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; background: rgba(0,0,0,0.8); z-index: 100; position: absolute; top:0; left:0; }
        .modal-box { background: var(--bg-light); padding: 40px; border-radius: 8px; text-align: center; width: 90%; max-width: 350px; }
        .modal-box input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: none; background: var(--bg-dark); color: white; box-sizing: border-box; outline: none; }
        .file-upload { background: var(--bg-dark); padding: 15px; border-radius: 4px; margin-bottom: 15px; border: 1px dashed var(--text-muted); cursor: pointer; }
        .preview-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: none; margin: 10px auto; }
        button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }

        #app-container { display: none; width: 100%; height: 100%; position: relative; }
        
        /* Mobile Header */
        .mobile-nav { display: flex; background: var(--bg-mid); padding: 15px; border-bottom: 1px solid #202225; align-items: center; justify-content: space-between; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; width: auto; padding: 0; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--bg-mid); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .category-header { font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin: 20px 0 10px 0; }
        .user-item { display: flex; align-items: center; margin-bottom: 5px; padding: 10px; border-radius: 4px; cursor: pointer; }
        .user-item:hover, .user-item.active { background: #393c43; }
        .user-item img { width: 35px; height: 35px; border-radius: 50%; margin-right: 12px; object-fit: cover; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; }
        .online { background: var(--online); } .offline { background: var(--offline); }

        /* Settings Button */
        .settings-btn { margin-top: auto; background: #4f545c; padding: 10px; border-radius: 4px; text-align: center; cursor: pointer; font-weight: bold; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-light); height: 100%; position: relative; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg-container { display: flex; align-items: flex-start; }
        .msg-container img { width: 45px; height: 45px; border-radius: 50%; margin-right: 15px; object-fit: cover; margin-top: 2px; }
        .msg-header .name { font-weight: bold; color: white; font-size: 15px; margin-right: 8px; }
        .msg-header .time { font-size: 12px; color: var(--text-muted); }
        .msg-text { color: var(--text-main); font-size: 15px; line-height: 1.4; word-wrap: break-word; }

        /* Input Area */
        .input-box { padding: 15px; background: var(--bg-light); display: flex; }
        .input-box input { flex: 1; padding: 15px; border-radius: 8px; border: none; background: #40444b; color: white; font-size: 15px; outline: none; }
        .input-box button { width: auto; margin-left: 10px; }

        /* Perfect Mobile Fixes */
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); transform: translateX(-100%); width: 240px; }
            .sidebar.open { transform: translateX(0); }
            #chatHeaderTitle { font-size: 18px; }
        }
        @media (min-width: 769px) { .mobile-nav .menu-btn { display: none; } }
    </style>
</head>
<body>

<div id="login-screen" class="modal-overlay">
    <div class="modal-box">
        <h2 style="margin-top:0;">Join Chat</h2>
        <img id="login-preview" class="preview-img" src="">
        <input type="text" id="usernameInput" placeholder="Username" autocomplete="off"/>
        <div class="file-upload">
            <label for="loginFileInput" style="cursor: pointer; display: block;">📷 Upload Avatar</label>
            <input type="file" id="loginFileInput" accept="image/*" style="display: none;" onchange="processImage(event, 'login-preview', true)">
        </div>
        <button onclick="startApp()">Enter</button>
    </div>
</div>

<div id="settings-screen" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h2 style="margin-top:0;">Settings</h2>
        <img id="settings-preview" class="preview-img" src="">
        <div class="file-upload">
            <label for="settingsFileInput" style="cursor: pointer; display: block;">📷 Change Avatar</label>
            <input type="file" id="settingsFileInput" accept="image/*" style="display: none;" onchange="processImage(event, 'settings-preview', false)">
        </div>
        <button onclick="saveSettings()">Save & Close</button>
    </div>
</div>

<div id="app-container">
    <div class="sidebar" id="sidebar">
        <div class="user-item active" onclick="switchChat('Public')" id="nav-Public">
            <img src="https://cdn-icons-png.flaticon.com/512/1256/1256650.png">
            <span style="font-weight:bold;">Public Chat</span>
        </div>
        <div id="user-list-container"></div>
        <div class="settings-btn" onclick="openSettings()">⚙️ Settings</div>
    </div>
    
    <div class="chat-area" onclick="closeSidebar()">
        <div class="mobile-nav">
            <button class="menu-btn" onclick="event.stopPropagation(); toggleSidebar()">☰</button>
            <h3 id="chatHeaderTitle" style="margin:0;">Public Chat</h3>
            <div style="width: 24px;"></div>
        </div>
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="messageText" placeholder="Message Public Chat..." autocomplete="off"/>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    let ws;
    let myUsername = localStorage.getItem("chat_username");
    let myPicBase64 = localStorage.getItem("chat_pic") || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
    let currentChat = "Public"; // Keeps track of who you are talking to

    // Initialize Login UI
    if (myUsername) {
        document.getElementById("usernameInput").value = myUsername;
        document.getElementById("login-preview").src = myPicBase64;
        document.getElementById("login-preview").style.display = "block";
    }

    // Image Compressor Logic
    let tempPicBase64 = myPicBase64;
    function processImage(e, previewElementId, isLogin) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 100; canvas.height = 100;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 100, 100);
                const compressed = canvas.toDataURL('image/jpeg', 0.8);
                
                document.getElementById(previewElementId).src = compressed;
                document.getElementById(previewElementId).style.display = "block";
                
                if(isLogin) myPicBase64 = compressed;
                else tempPicBase64 = compressed;
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }

    function startApp() {
        myUsername = document.getElementById("usernameInput").value;
        if (!myUsername) return alert("Username required!");

        localStorage.setItem("chat_username", myUsername);
        localStorage.setItem("chat_pic", myPicBase64);

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app-container").style.display = "flex";

        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);
        
        ws.onopen = function() { ws.send(JSON.stringify({ pic: myPicBase64 })); };
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.type === "chat") {
                // Only show message if it belongs to the room we are currently looking at
                if ((currentChat === "Public" && data.receiver === "Public") ||
                    (currentChat !== "Public" && (data.sender === currentChat || (data.sender === myUsername && data.receiver === currentChat)))) {
                    appendMessage(data.sender, data.profile_pic, data.message, data.timestamp);
                }
            } 
            else if (data.type === "history") {
                document.getElementById('messages').innerHTML = ""; 
                data.data.forEach(msg => appendMessage(msg.sender, msg.profile_pic, msg.message, msg.timestamp));
            }
            else if (data.type === "user_list") {
                updateUserSidebar(data.data);
            }
        };
    }

    function switchChat(targetUser) {
        currentChat = targetUser;
        document.getElementById("chatHeaderTitle").innerText = targetUser === "Public" ? "Public Chat" : `Chat with ${targetUser}`;
        document.getElementById("messageText").placeholder = `Message ${targetUser}...`;
        
        // Highlight active chat in sidebar
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        const activeNav = document.getElementById(`nav-${targetUser}`);
        if(activeNav) activeNav.classList.add('active');

        // Ask server for history of this specific chat
        document.getElementById('messages').innerHTML = ""; 
        ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
        
        closeSidebar();
    }

    function updateUserSidebar(users) {
        const container = document.getElementById('user-list-container');
        let html = `<div class="category-header">Direct Messages</div>`;

        users.forEach(user => {
            if (user.username === myUsername) return; // Hide yourself from the list
            html += `
                <div class="user-item" id="nav-${user.username}" style="opacity: ${user.status === 'Offline' ? '0.5' : '1'};" onclick="switchChat('${user.username}')">
                    <img src="${user.profile_pic}">
                    <span>${user.username}</span>
                    <div class="status-dot ${user.status === 'Online' ? 'online' : 'offline'}"></div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        // Re-apply active class if needed
        const activeNav = document.getElementById(`nav-${currentChat}`);
        if(activeNav) activeNav.classList.add('active');
    }

    function appendMessage(sender, pic, text, time) {
        const messages = document.getElementById('messages');
        messages.innerHTML += `
            <div class="msg-container">
                <img src="${pic}">
                <div>
                    <div class="msg-header"><span class="name">${sender}</span><span class="time">${time}</span></div>
                    <div class="msg-text">${text}</div>
                </div>
            </div>
        `;
        messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById("messageText");
        if (ws && input.value) {
            // Send as JSON so server knows WHO it's for
            ws.send(JSON.stringify({ type: "chat", receiver: currentChat, message: input.value }));
            input.value = '';
        }
    }

    document.getElementById("messageText").addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });

    // Settings Logic
    function openSettings() {
        document.getElementById("settings-preview").src = myPicBase64;
        document.getElementById("settings-preview").style.display = "block";
        document.getElementById("settings-screen").style.display = "flex";
        closeSidebar();
    }
    
    function saveSettings() {
        myPicBase64 = tempPicBase64;
        localStorage.setItem("chat_pic", myPicBase64);
        document.getElementById("settings-screen").style.display = "none";
        ws.send(JSON.stringify({ type: "update_settings", pic: myPicBase64 })); // Tell server
    }

    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("open"); }
    function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); }
</script>
</body>
</html>
