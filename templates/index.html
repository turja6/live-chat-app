<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdlyCall</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #202225;
    color: white;
}

#login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000cc;
}

.login-box {
    background: #2f3136;
    padding: 25px;
    border-radius: 8px;
    text-align: center;
}

input {
    padding: 10px;
    width: 100%;
    margin-top: 10px;
    border: none;
    border-radius: 5px;
}

button {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 5px;
    background: orange;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#app {
    display: none;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 15px;
    background: #2f3136;
    border-bottom: 1px solid #000;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    margin-bottom: 10px;
}

.sender {
    font-weight: bold;
}

.time {
    font-size: 10px;
    color: gray;
}

#input-area {
    display: flex;
    padding: 10px;
    background: #2f3136;
}

#msg {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: none;
}

#send {
    margin-left: 10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
    <div class="login-box">
        <h2>Login</h2>
        <input id="username" placeholder="Enter username">
        <button onclick="login()">Connect</button>
    </div>
</div>

<!-- APP -->
<div id="app">
    <header id="status">Connecting...</header>

    <div id="chat"></div>

    <div id="input-area">
        <input id="msg" placeholder="Message...">
        <button id="send" onclick="sendMsg()">Send</button>
    </div>
</div>

<script>
let ws;
let username = localStorage.getItem("username") || "";

/* ================= LOGIN ================= */
function login() {
    const name = document.getElementById("username").value.trim();
    if (!name) return alert("Enter username");

    username = name;
    localStorage.setItem("username", name);

    startApp();
}

/* ================= START APP ================= */
function startApp() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";

    const protocol = location.protocol === "https:" ? "wss" : "ws";

    ws = new WebSocket(`${protocol}://${location.host}/ws/${username}`);

    document.getElementById("status").innerText = "Connecting...";

    ws.onopen = () => {
        ws.send(JSON.stringify({}));
        document.getElementById("status").innerText = "Connected ✅";
    };

    ws.onerror = () => {
        alert("❌ WebSocket failed. Start backend.");
    };

    ws.onclose = () => {
        document.getElementById("status").innerText = "Disconnected ❌";
    };

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === "history") {
            document.getElementById("chat").innerHTML = "";
            data.data.forEach(m =>
                drawMsg(m.sender, m.message, m.timestamp)
            );
        }

        if (data.type === "chat") {
            drawMsg(data.sender, data.message, new Date().toLocaleTimeString());
        }
    };
}

/* ================= DRAW MESSAGE ================= */
function drawMsg(sender, text, time) {
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg";

    div.innerHTML = `
        <div class="sender">${escapeHTML(sender)} 
            <span class="time">${time || ""}</span>
        </div>
        <div>${renderMessage(text)}</div>
    `;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* ================= SAFE HTML ================= */
function escapeHTML(str) {
    return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[m]));
}

/* ================= IMAGE HANDLING ================= */
function renderMessage(text) {
    if (text.startsWith("http") && text.includes("res.cloudinary")) {
        return `<img src="${text}" style="max-width:200px;border-radius:6px">`;
    }
    return escapeHTML(text);
}

/* ================= SEND ================= */
function sendMsg() {
    const input = document.getElementById("msg");
    const val = input.value.trim();

    if (!val || !ws) return;

    ws.send(JSON.stringify({
        type: "chat",
        msg_id: Date.now().toString(),
        receiver: "Public",
        message: val
    }));

    input.value = "";
}

/* ENTER KEY */
document.getElementById("msg").addEventListener("keypress", e => {
    if (e.key === "Enter") sendMsg();
});

/* AUTO LOGIN */
if (username) {
    document.getElementById("username").value = username;
    startApp();
}
</script>

</body>
</html>
