<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdlyCall - Phase 2</title>
    <style>
        /* --- CORE THEME (NO GLOW) --- */
        :root { --bg: #08090a; --panel: #121317; --accent: #FF7A00; --text: #ffffff; --border: #2a2b30; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; color: var(--text); }
        body { background: var(--bg); height: 100vh; overflow: hidden; display: flex; }

        /* --- LOGIN SCREEN --- */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: var(--panel); padding: 40px; border-radius: 8px; border: 1px solid var(--border); text-align: center; width: 320px; }
        .login-box input { width: 100%; padding: 12px; margin: 20px 0; background: #000; border: 1px solid var(--border); border-radius: 4px; color: white; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .login-box button:hover { background: #e66e00; }

        /* --- APP LAYOUT --- */
        #app-container { display: none; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 1.2rem; }
        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-item { padding: 12px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
        .user-item:hover { background: #1a1b20; border-color: var(--border); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff00; }

        /* --- CHAT AREA --- */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 15px 25px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; justify-content: space-between; align-items: center; }
        .action-btns button { background: #1a1b20; border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        .action-btns button:hover { border-color: var(--accent); }
        
        #chat-stream { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        /* --- MESSAGES --- */
        .message { display: flex; flex-direction: column; max-width: 70%; }
        .msg-sender { font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        .msg-text { background: #1a1b20; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); }
        .message.my-message { align-self: flex-end; }
        .message.my-message .msg-sender { align-self: flex-end; }
        .message.my-message .msg-text { background: var(--accent); border-color: var(--accent); color: white; }

        /* --- FIREBASE RGB INPUT (SHARP, NO GLOW) --- */
        .input-area { padding: 20px; background: var(--bg); }
        
        .rgb-wrapper {
            position: relative;
            padding: 3px; /* Thickness of the RGB border */
            border-radius: 50px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: fire-rgb 8s linear infinite;
        }

        @keyframes fire-rgb { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        .input-inner {
            display: flex;
            align-items: center;
            background: #000;
            border-radius: 48px; /* Slightly smaller than wrapper to show border */
            padding: 5px 5px 5px 20px;
        }

        .input-inner input { flex: 1; height: 40px; background: transparent; border: none; color: white; outline: none; font-size: 1rem; }
        .input-inner button { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; font-weight: bold; cursor: pointer; }

        /* --- CALLING SYSTEM OVERLAY --- */
        #call-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; bottom: 30px; right: 30px; width: 200px; height: 150px; background: #111; border: 2px solid var(--accent); border-radius: 8px; object-fit: cover; }
        .call-controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
        .end-btn { background: #ff3333; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .end-btn:hover { background: #ff0000; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--accent);">IdlyCall</h2>
            <input type="text" id="usernameInput" placeholder="Enter username..." autocomplete="off">
            <button onclick="startApp()">Connect</button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">Active Chats</div>
            <div class="user-list" id="user-list-container"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h3 id="chatHeaderTitle">Public Server</h3>
                <div class="action-btns">
                    <button onclick="showCallScreen()">📞 Call</button>
                    <button onclick="showCallScreen()">🎥 Video</button>
                </div>
            </div>
            
            <div id="chat-stream"></div>

            <div class="input-area">
                <div class="rgb-wrapper">
                    <div class="input-inner">
                        <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
                        <button onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="call-overlay">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        <div class="call-controls">
            <button class="end-btn" onclick="forceEndCall()">☎ End Call</button>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */
        let ws;
        let myUsername = "";
        let currentChat = "Public";
        let localStream = null;

        function startApp() {
            try {
                const input = document.getElementById("usernameInput").value.trim();
                if (!input) return alert("Please enter a username.");
                
                myUsername = input;
                
                // Force UI to switch immediately
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-container").style.display = "flex";

                // Connect to Backend
                const protocol = location.protocol === "https:" ? "wss" : "ws";
                ws = new WebSocket(`${protocol}://${location.host}/ws/${myUsername}`);

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === "chat") {
                        drawMessage(data.sender, data.message);
                    } 
                    else if (data.type === "user_list") {
                        updateSidebar(data.data);
                    }
                    else if (data.type === "call_end") {
                        forceEndCall();
                    }
                };
            } catch (error) {
                console.error("Connection Error:", error);
                alert("Failed to connect. Make sure your server is running.");
            }
        }

        function drawMessage(sender, text) {
            const stream = document.getElementById('chat-stream');
            const div = document.createElement('div');
            
            div.className = sender === myUsername ? 'message my-message' : 'message';
            div.innerHTML = `
                <div class="msg-sender">${sender}</div>
                <div class="msg-text">${text}</div>
            `;
            
            stream.appendChild(div);
            stream.scrollTo({ top: stream.scrollHeight, behavior: 'smooth' });
        }

        function updateSidebar(users) {
            const container = document.getElementById('user-list-container');
            container.innerHTML = users.map(user => `
                <div class="user-item" onclick="switchChat('${user.username}')">
                    <div class="status-dot"></div>
                    ${user.username}
                </div>
            `).join('');
        }

        function switchChat(targetUser) {
            currentChat = targetUser;
            document.getElementById("chatHeaderTitle").innerText = targetUser;
            document.getElementById('chat-stream').innerHTML = ""; 
        }

        function sendMessage() {
            const inputField = document.getElementById("msg-input");
            const text = inputField.value.trim();
            if (!text) return;

            if(ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "chat", receiver: currentChat, message: text }));
            }
            inputField.value = ""; 
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        /* --- CALLING LOGIC --- */
        async function showCallScreen() {
            document.getElementById('call-overlay').style.display = 'block';
            
            // Turn on the local camera
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.warn("Camera access denied or no camera found.");
            }
        }

        function forceEndCall() {
            document.getElementById('call-overlay').style.display = 'none';
            
            // Shut off the camera
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('local-video').srcObject = null;

            // Tell the other person the call ended
            if(ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "call_end", receiver: currentChat }));
            }
        }
    </script>
</body>
</html>
