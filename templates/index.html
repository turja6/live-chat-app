    /* =========================================
       2. EVENT-DRIVEN PLUGIN LOADER
    ========================================= */
    async function autoLoadPlugins() {
        try {
            const response = await fetch('/api/get-plugins');
            const data = await response.json();
            
            // Create a promise for every plugin
            const pluginPromises = data.plugins.map(name => {
                return new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = `/static/plugins/${name}.js`;
                    script.onload = () => {
                        console.log(`Plugin Loaded: ${name}`);
                        resolve();
                    };
                    document.body.appendChild(script);
                });
            });

            // Wait until ALL plugins are finished loading before continuing
            await Promise.all(pluginPromises);
            console.log("All plugins initialized.");
            
            // Dispatch a custom event so the main app knows it's safe to use plugins
            window.dispatchEvent(new CustomEvent('pluginsLoaded'));
        } catch (err) {
            console.error("Plugin loader error:", err);
        }
    }

    /* =========================================
       3. WINDOW ONLOAD (The central hub)
    ========================================= */
    window.onload = async () => {
        loadTheme();
        initEmojiPicker();
        loadSession();

        // Define the Bridge
        window.IdlyPlugins.sendToSocket = (payload) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            }
        };

        // Await the plugins so they fully load before app completes startup
        await autoLoadPlugins();

        // Initialize the rest of your app listeners
        const inputField = document.getElementById("msgInput");
        if (inputField) {
            inputField.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMsg(); 
                }
            });
        }

        // Close emoji picker when clicking outside
        document.addEventListener('click', (e) => {
            const picker = document.getElementById('emoji-picker');
            if (picker && picker.classList.contains('active')) {
                if (!e.target.closest('.emoji-picker') && !e.target.closest('.input-action-btn')) {
                    picker.classList.remove('active');
                }
            }
        });

        // Mobile specific: handle visual viewport resize (keyboard open/close)
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.documentElement.style.setProperty('--vh', `${window.visualViewport.height * 0.01}px`);
            });
        }
    };

    /* =========================================
       4. SESSION & EMOJIS
    ========================================= */
    function loadSession() {
        try {
            const savedName = localStorage.getItem("idly_user");
            const savedPic = localStorage.getItem("idly_pic");
            const savedChat = localStorage.getItem("idly_chat");

            if (savedName) {
                document.getElementById("username").value = savedName;
                myUsername = savedName;
            }
            if (savedPic) {
                myPicBase64 = savedPic;
                document.getElementById("login-preview").src = savedPic;
            }
            if (savedChat) currentChat = savedChat;
        } catch (e) {
            console.log("Storage blocked or unavailable");
        }
    }

    function initEmojiPicker() {
        const picker = document.getElementById('emoji-picker');
        if (!picker) return;
        picker.innerHTML = '';
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.className = 'emoji-btn';
            btn.innerText = e;
            btn.onclick = (ev) => {
                ev.stopPropagation();
                insertEmoji(e);
            };
            picker.appendChild(btn);
        });
    }

    function insertEmoji(emoji) {
        const input = document.getElementById('msgInput');
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const text = input.value;
        input.value = text.substring(0, start) + emoji + text.substring(end);
        input.selectionStart = input.selectionEnd = start + emoji.length;
        input.focus();
    }

    /* =========================================
       5. WEBSOCKET CONNECTION
    ========================================= */
    function connect() {
        myUsername = document.getElementById("username").value.trim();
        if (!myUsername) {
            showToast("Please enter a username", "error");
            return;
        }

        try {
            localStorage.setItem("idly_user", myUsername);
            localStorage.setItem("idly_pic", myPicBase64);
            localStorage.setItem("idly_chat", currentChat);
        } catch(e) {}

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app-container").style.display = "flex";

        updateFooterProfile();
        updateHeader();

        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);

        ws.onopen = function() {
            updateConnectionStatus(true);
            reconnectAttempts = 0;

            this.send(JSON.stringify({ pic: myPicBase64, target: currentChat }));
            this.send(JSON.stringify({ type: "get_history", target: currentChat }));

            heartbeat = setInterval(() => {
                if (ws.readyState === WebSocket.OPEN)
                    ws.send(JSON.stringify({ type: "ping" }));
            }, 25000);

            showToast("Connected successfully", "success");
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                handleWsMessage(data);
            } catch (err) {
                console.error("Failed to parse WebSocket message:", err);
            }
        };

        ws.onclose = () => {
            clearInterval(heartbeat);
            updateConnectionStatus(false);
            console.log("Disconnected from server");
            attemptReconnect();
        };

        ws.onerror = () => {
            updateConnectionStatus(false);
            showToast("Connection error", "error");
        };
    }

    function attemptReconnect() {
        if (reconnectAttempts >= maxReconnectAttempts) {
            showToast("Could not reconnect. Please refresh.", "error");
            return;
        }
        
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
        reconnectAttempts++;
        
        updateConnectionStatus(false);
        showToast(`Reconnecting in ${delay/1000}s...`, "error");
        
        setTimeout(() => {
            console.log(`Reconnect attempt ${reconnectAttempts}...`);
            connect();
        }, delay);
    }

    function updateConnectionStatus(connected) {
        const dot = document.getElementById('connection-dot');
        const text = document.getElementById('connection-text');
        if (dot && text) {
            if (connected) {
                dot.className = 'connection-dot';
                text.textContent = 'Connected';
            } else {
                dot.className = 'connection-dot disconnected';
                text.textContent = reconnectAttempts > 0 ? 'Reconnecting...' : 'Disconnected';
            }
        }
    }

    function handleWsMessage(data) {
        switch(data.type) {
            case "history": renderHistory(data); break;
            case "chat": handleIncomingChat(data); break;
            case "user_list": handleUserList(data); break;
            case "typing": handleTypingIndicator(data); break;
            default:
                // THE PLUG-IN HOOK: If the core app doesn't recognize the message, check if a plugin does.
                if (window.IdlyPlugins.messageHandlers[data.type]) {
                    window.IdlyPlugins.messageHandlers[data.type](data);
                } else {
                    console.log("Unknown message type ignored:", data.type);
                }
        }
    }

    /* =========================================
       6. UI RENDERING - MESSAGES
    ========================================= */
    function renderHistory(data) {
        const msgs = document.getElementById("messages");
        msgs.innerHTML = "";
        messageStore = [];

        if (!data.data || data.data.length === 0) {
            msgs.innerHTML = `
                <div class="welcome-message">
                    <h3>Welcome to ${currentChat === 'Public' ? 'Public Lobby' : currentChat}!</h3>
                    <p>No messages yet. Be the first to say hello! 👋</p>
                </div>
            `;
        } else {
            data.data.forEach(m => {
                drawMessage(m, false);
            });
            scrollToBottom();
        }
    }

    function handleIncomingChat(data) {
        const isPublic = data.receiver === "Public";
        const isForMe = data.receiver === myUsername;
        const isFromMe = data.sender === myUsername;

        let show = false;

        if (currentChat === "Public" && isPublic) {
            show = true;
        } else if (currentChat !== "Public") {
            if (isFromMe && data.receiver === currentChat) show = true;
            if (data.sender === currentChat && isForMe) show = true;
        }

        if (show) {
            drawMessage(data, true);
            scrollToBottom();
        } else {
            if (!isFromMe) {
                const channelName = isPublic ? "Public Lobby" : data.sender;
                showToast(`New message from ${channelName}`, "success");
            }
        }
    }

    function drawMessage(msg, isNew = true) {
        const msgs = document.getElementById("messages");

        const welcomeEl = msgs.querySelector('.welcome-message');
        if (welcomeEl) welcomeEl.remove();

        const div = document.createElement("div");
        div.className = "message-group";

        const isMe = msg.sender === myUsername;

        if (isMe) {
            div.classList.add("own-message");
        }

        const safePic = msg.profile_pic || DEFAULT_AVATAR;
        const timeStr = msg.timestamp || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const msgId = msg.id || 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        messageStore.push({ id: msgId, sender: msg.sender, content: msg.content, timestamp: timeStr });

        const isImage = msg.content && (msg.content.startsWith("data:image") || (msg.content.includes("http") && msg.content.match(/\.(jpeg|jpg|gif|png|webp)/i)));
        const isFile = msg.content && msg.content.startsWith("data:text/plain");
        
        let contentHtml = "";

        if (isImage) {
            contentHtml = `<img src="${msg.content}" class="msg-image" onclick="openLightbox('${msg.content.replace(/'/g, "\\'")}')">`;
        } else if (isFile) {
            const fileName = msg.fileName || 'document.txt';
            contentHtml = `
                <a href="${msg.content}" download="${escapeHtml(fileName)}" class="file-bubble" onclick="event.stopPropagation()">
                    <div class="file-icon">📄</div>
                    <div class="file-info">
                        <div class="file-name">${escapeHtml(fileName)}</div>
                        <div class="file-download-text">Click to download</div>
                    </div>
                </a>
            `;
        } else {
            contentHtml = `<div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
        }

        let replyHtml = "";
        if (msg.reply_to) {
            const replyTextDisplay = msg.reply_to_text
                ? escapeHtml(msg.reply_to_text.substring(0, 80))
                : 'Attachment';
            replyHtml = `
                <div class="msg-reply-context" onclick="scrollToMessage('${msg.reply_to_id || ''}')">
                    <strong>${escapeHtml(msg.reply_to_name || 'Unknown')}</strong><br>
                    <span style="color:var(--text-muted)">${replyTextDisplay}</span>
                </div>
            `;
        }

        if (isMe) {
            div.innerHTML = `
                <div class="message" data-me="true" data-msg-id="${msgId}" oncontextmenu="showMessageContext(event, '${msgId}', '${escapeHtml(msg.content).replace(/'/g, "\\'")}', '${escapeHtml(msg.sender)}')">
                    <div class="msg-avatar-spacer">
                        <img src="${safePic}" class="msg-avatar" title="${msg.sender}">
                    </div>
                    <div class="msg-content">
                        <div class="msg-header">
                            <span class="msg-time">${timeStr}</span>
                            <span class="msg-name">You</span>
                        </div>
                        ${replyHtml}
                        ${contentHtml}
                    </div>
                </div>
            `;
        } else {
            div.innerHTML = `
                <div class="message" data-me="false" data-msg-id="${msgId}" oncontextmenu="showMessageContext(event, '${msgId}', '${escapeHtml(msg.content).replace(/'/g, "\\'")}', '${escapeHtml(msg.sender)}')">
                    <div class="msg-avatar-spacer">
                        <img src="${safePic}" class="msg-avatar" title="${msg.sender}">
                    </div>
                    <div class="msg-content">
                        <div class="msg-header">
                            <span class="msg-name">${escapeHtml(msg.sender)}</span>
                            <span class="msg-time">${timeStr}</span>
                        </div>
                        ${replyHtml}
                        ${contentHtml}
                    </div>
                </div>
            `;
        }

        msgs.appendChild(div);
    }

    /* =========================================
       7. UI RENDERING - USER LIST
    ========================================= */
    function handleUserList(data) {
        userList = data.users;
        renderSidebar();
    }

    function renderSidebar() {
        const container = document.getElementById("user-list-container");
        let html = `
            <div class="list-header">Channels</div>
            <div class="user-item ${currentChat === 'Public' ? 'active' : ''}" onclick="switchChat('Public')">
                <div class="user-avatar-wrapper">
                    <img src="https://cdn-icons-png.flaticon.com/512/1256/1256650.png" style="border-radius: 0;">
                </div>
                <div class="user-info">
                    <div class="name">Public Lobby</div>
                </div>
            </div>
        `;

        const onlineUsers = userList.filter(u => u.username !== myUsername && u.status === 'Online');
        const offlineUsers = userList.filter(u => u.username !== myUsername && u.status !== 'Online');

        html += `<div class="list-header">Online — ${onlineUsers.length}</div>`;
        onlineUsers.forEach(user => {
            html += createUserItem(user);
        });

        html += `<div class="list-header">Offline — ${offlineUsers.length}</div>`;
        offlineUsers.forEach(user => {
            html += createUserItem(user);
        });

        container.innerHTML = html;
    }

    function createUserItem(user) {
        const statusClass = user.status === "Online" ? "status-online" : "status-offline";
        const activeClass = currentChat === user.username ? "active" : "";
        const safePic = user.profile_pic || DEFAULT_AVATAR;

        return `
            <div class="user-item ${activeClass}" onclick="switchChat('${escapeHtml(user.username)}')">
                <div class="user-avatar-wrapper">
                    <img src="${safePic}">
                    <div class="status-indicator ${statusClass}"></div>
                </div>
                <div class="user-info">
                    <div class="name">${escapeHtml(user.username)}</div>
                </div>
            </div>
        `;
    }

    /* =========================================
       8. CHAT ACTIONS
    ========================================= */
    function switchChat(target) {
        if (currentChat === target) return;
        currentChat = target;

        try { localStorage.setItem("idly_chat", currentChat); } catch(e) {}

        updateHeader();
        renderSidebar();
        cancelReply();

        document.getElementById("messages").innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-text">Loading messages...</div>
            </div>
        `;

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
        }

        closeSidebarMobile();
    }

    function sendMsg() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text) return;

        if (ws && ws.readyState === WebSocket.OPEN) {
            const lines = text.split('\n');
            
            if (lines.length > 500) {
                const blob = new Blob([text], { type: 'text/plain' });
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    const msgObj = {
                        type: "chat",
                        receiver: currentChat,
                        pic: myPicBase64,
                        content: dataUrl,
                        fileName: `message_${Date.now()}.txt`
                    };

                    if (replyingTo) {
                        msgObj.reply_to_id = replyingTo.id;
                        msgObj.reply_to_name = replyingTo.sender;
                        msgObj.reply_to_text = "📄 " + (replyingTo.content ? replyingTo.content.substring(0, 30) + "..." : "File");
                        replyingTo = null;
                        document.getElementById('reply-preview').classList.remove('active');
                    }

                    ws.send(JSON.stringify(msgObj));
                    showToast("Message sent as file (over 500 lines)", "success");
                };
                
                reader.readAsDataURL(blob);
            } else {
                const msgObj = {
                    type: "chat",
                    receiver: currentChat,
                    pic: myPicBase64,
                    content: text
                };

                if (replyingTo) {
                    msgObj.reply_to_id = replyingTo.id;
                    msgObj.reply_to_name = replyingTo.sender;
                    msgObj.reply_to_text = replyingTo.content;
                    replyingTo = null;
                    document.getElementById('reply-preview').classList.remove('active');
                }

                ws.send(JSON.stringify(msgObj));
            }

            input.value = "";
            input.focus();

            clearTimeout(typingTimeout);
            isTyping = false;
        } else {
            showToast("Not connected to server", "error");
        }
    }

    function sendImage(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 10 * 1024 * 1024) {
            showToast("Image too large. Max 10MB.", "error");
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;

                if (width > 1000) {
                    height *= 1000 / width;
                    width = 1000;
                }
                if (height > 1000) {
                    width *= 1000 / height;
                    height = 1000;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "chat",
                        receiver: currentChat,
                        pic: myPicBase64,
                        content: dataUrl
                    }));
                }
            };
            img.onerror = () => {
                showToast("Failed to load image", "error");
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    /* =========================================
       9. TYPING INDICATOR
    ========================================= */
    function handleTyping() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        if (!isTyping) {
            isTyping = true;
            ws.send(JSON.stringify({ type: "typing", receiver: currentChat }));
        }

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { isTyping = false; }, 1500);
    }

    function handleTypingIndicator(data) {
        if (data.sender === myUsername) return;

        if (currentChat === "Public" && data.receiver === "Public") {
            currentlyTypingUsers.add(data.sender);
        } else if (currentChat === data.sender) {
            currentlyTypingUsers.add(data.sender);
        }

        updateTypingUI();

        clearTimeout(indicatorTimeout);
        indicatorTimeout = setTimeout(() => {
            currentlyTypingUsers.clear();
            updateTypingUI();
        }, 3000);
    }

    function updateTypingUI() {
        const indicator = document.getElementById("typing-indicator");
        const textSpan = document.getElementById("typing-text");
        const users = Array.from(currentlyTypingUsers);

        if (users.length > 0) {
            let text = "";
            if (users.length === 1) text = `${users[0]} is typing`;
            else if (users.length === 2) text = `${users[0]} and ${users[1]} are typing`;
            else text = "Several people are typing";

            textSpan.innerText = text;
            indicator.classList.add('visible');
        } else {
            indicator.classList.remove('visible');
        }
    }

    /* =========================================
       10. REPLY FUNCTIONALITY & CONTEXT MENU
    ========================================= */
    function setReply(sender, content, id) {
        replyingTo = { sender, content, id };
        document.getElementById('reply-to-name').innerText = sender;
        document.getElementById('reply-to-text').innerText = content ? content.substring(0, 50) : "Attachment";
        document.getElementById('reply-preview').classList.add('active');
        document.getElementById('msgInput').focus();
    }

    function cancelReply() {
        replyingTo = null;
        document.getElementById('reply-preview').classList.remove('active');
    }

    function showMessageContext(e, id, content, sender) {
        e.preventDefault();
        e.stopPropagation();

        contextMenuTarget = { id, content, sender };

        const ctx = document.getElementById('context-menu');
        const deleteBtn = document.getElementById('ctx-delete-btn');
        
        if (sender === myUsername) {
            deleteBtn.style.display = 'flex';
        } else {
            deleteBtn.style.display = 'none';
        }

        const menuWidth = 160;
        const menuHeight = 120;
        let left = e.clientX;
        let top = e.clientY;

        if (left + menuWidth > window.innerWidth) left = window.innerWidth - menuWidth - 10;
        if (top + menuHeight > window.innerHeight) top = window.innerHeight - menuHeight - 10;

        ctx.style.left = left + 'px';
        ctx.style.top = top + 'px';
        ctx.classList.add('active');
    }

    function contextReply() {
        if (contextMenuTarget) {
            setReply(contextMenuTarget.sender, contextMenuTarget.content, contextMenuTarget.id);
        }
        document.getElementById('context-menu').classList.remove('active');
    }

    function contextCopy() {
        if (contextMenuTarget && contextMenuTarget.content) {
            const isImage = contextMenuTarget.content.startsWith("data:image");
            const isFile = contextMenuTarget.content.startsWith("data:text/plain");
            
            if (isImage || isFile) {
                showToast("Cannot copy attachment as text", "error");
            } else {
                navigator.clipboard.writeText(contextMenuTarget.content).then(() => {
                    showToast("Copied to clipboard", "success");
                }).catch(() => {
                    showToast("Failed to copy", "error");
                });
            }
        }
        document.getElementById('context-menu').classList.remove('active');
    }

    function contextDelete() {
        if (contextMenuTarget && contextMenuTarget.sender === myUsername) {
            const msgEl = document.querySelector(`[data-msg-id="${contextMenuTarget.id}"]`);
            if (msgEl) {
                const group = msgEl.closest('.message-group');
                if (group) {
                    group.style.transition = 'opacity 0.3s, transform 0.3s';
                    group.style.opacity = '0';
                    group.style.transform = 'scale(0.95)';
                    setTimeout(() => group.remove(), 300);
                    messageStore = messageStore.filter(m => m.id !== contextMenuTarget.id);
                }
            }
        } else {
            showToast("You can only delete your own messages", "error");
        }
        document.getElementById('context-menu').classList.remove('active');
    }

    /* =========================================
       11. HELPER FUNCTIONS
    ========================================= */
    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function scrollToBottom() {
        const msgs = document.getElementById("messages");
        requestAnimationFrame(() => {
            msgs.scrollTop = msgs.scrollHeight;
        });
    }

    function scrollToMessage(msgId) {
        if (!msgId) return;
        const el = document.querySelector(`[data-msg-id="${msgId}"]`);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const group = el.closest('.message-group');
            if (group) {
                group.style.background = 'rgba(99, 102, 241, 0.15)';
                setTimeout(() => {
                    group.style.background = '';
                }, 1500);
            }
        }
    }

    function updateHeader() {
        const title = document.getElementById("chat-header-title");
        const sub = document.getElementById("chat-header-subtitle");
        if (currentChat === "Public") {
            title.innerText = "# Public Lobby";
            sub.innerText = "Everyone sees this";
        } else {
            title.innerText = `@ ${currentChat}`;
            sub.innerText = "Direct Message";
        }
    }

    function updateFooterProfile() {
        const avatarEl = document.getElementById("my-avatar-footer");
        const nameEl = document.getElementById("my-username-footer");
        if (avatarEl) avatarEl.src = myPicBase64;
        if (nameEl) nameEl.innerText = myUsername;
    }

    function processImage(e, targetId) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;

                if (width > 800) {
                    height *= 800 / width;
                    width = 800;
                }
                if (height > 800) {
                    width *= 800 / height;
                    height = 800;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const b64 = canvas.toDataURL('image/jpeg', 0.8);

                const target = document.getElementById(targetId);
                if (target) target.src = b64;

                if (targetId === 'login-preview') {
                    myPicBase64 = b64;
                }
            };
            img.onerror = () => showToast("Failed to process image", "error");
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function updateProfilePic(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;

                if (width > 800) { height *= 800 / width; width = 800; }
                if (height > 800) { width *= 800 / height; height = 800; }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const b64 = canvas.toDataURL('image/jpeg', 0.8);

                myPicBase64 = b64;
                updateFooterProfile();

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ pic: myPicBase64, target: currentChat }));
                }

                try { localStorage.setItem("idly_pic", myPicBase64); } catch(e) {}
                showToast("Profile picture updated", "success");
            };
            img.onerror = () => showToast("Failed to process image", "error");
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    function filterUsers() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const items = document.querySelectorAll('.user-item');
        items.forEach(item => {
            const name = item.querySelector('.name');
            if (name) {
                const text = name.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            }
        });
    }

    function forceSync() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            document.getElementById("messages").innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🔄</div>
                    <div class="empty-state-text">Syncing messages...</div>
                </div>
            `;
            ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            showToast("Syncing...", "success");
        }
    }

    /* =========================================
       12. MOBILE & UI CONTROLS
    ========================================= */
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    function closeSidebarMobile() {
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('active');
        }
    }

    function toggleEmojiPicker() {
        document.getElementById('emoji-picker').classList.toggle('active');
    }

    /* =========================================
       13. THEME & SETTINGS
    ========================================= */
    function openSettings() {
        document.getElementById('settings-modal').classList.add('active');
    }

    function closeSettings() {
        document.getElementById('settings-modal').classList.remove('active');
    }

    function loadTheme() {
        const theme = localStorage.getItem('idly_theme') || 'dark';
        document.body.setAttribute('data-theme', theme);
        document.getElementById('theme-toggle').checked = (theme === 'dark');
    }

    function toggleTheme() {
        const isDark = document.getElementById('theme-toggle').checked;
        const theme = isDark ? 'dark' : 'light';
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('idly_theme', theme);
    }

    function clearData() {
        if (confirm("Clear all local settings and data? You will return to login.")) {
            localStorage.clear();
            location.reload();
        }
    }

    /* =========================================
       14. LIGHTBOX
    ========================================= */
    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
    }

    /* =========================================
       15. TOAST NOTIFICATIONS
    ========================================= */
    function showToast(message, type = "") {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        if (type) toast.classList.add(type);
        toast.textContent = message;
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.transition = 'opacity 0.3s, transform 0.3s';
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(30px)';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    /* =========================================
       16. KEYBOARD SHORTCUTS
    ========================================= */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeLightbox();
            closeSettings();
            cancelReply();
            document.getElementById('emoji-picker').classList.remove('active');
            document.getElementById('context-menu').classList.remove('active');
            closeSidebarMobile();
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.focus();
        }
    });

    /* =========================================
       17. WINDOW RESIZE HANDLER
    ========================================= */
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('active');
        }
    });

    /* =========================================
       18. ONLINE/OFFLINE STATUS DETECTION
    ========================================= */
    window.addEventListener('online', () => {
        showToast("You're back online", "success");
        updateConnectionStatus(ws && ws.readyState === WebSocket.OPEN);
    });

    window.addEventListener('offline', () => {
        showToast("You're offline", "error");
        updateConnectionStatus(false);
    });

    /* =========================================
       19. PREVENT DEFAULT CONTEXT MENU ON APP
    ========================================= */
    document.getElementById('app-container')?.addEventListener('contextmenu', (e) => {
        if (!e.target.closest('.message')) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
