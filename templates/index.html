<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall - Connected</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2950/2950822.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* === CORE VARIABLES === */
        :root {
            --space-bg: #0a0a0c;
            --glass-bg: rgba(25, 25, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-accent: #00f0ff;
            --neon-secondary: #ff0055;
            --text-primary: #ffffff;
            --text-dim: #888899;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--space-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.05), transparent 25%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* === MODALS (Login, Settings, Incoming Call) === */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-box {
            background: rgba(20, 20, 25, 0.9); border: 1px solid var(--neon-accent);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }
        .modal-box input {
            width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: none;
            background: rgba(255,255,255,0.1); color: white; outline: none; font-size: 1rem;
        }
        .modal-box button {
            width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold;
            background: var(--neon-accent); color: #000; font-size: 1rem; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); transition: 0.2s; margin-bottom: 10px;
        }
        .modal-box button:hover { transform: scale(1.05); }
        .modal-box button.cancel { background: transparent; color: var(--text-dim); box-shadow: none; border: 1px solid var(--glass-border); }
        .modal-box button.danger { background: var(--neon-secondary); color: white; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }

        .avatar-preview { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid var(--neon-accent); }
        
        .pulse-avatar { animation: pulse 1.5s infinite; border: 3px solid var(--neon-accent); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(0, 240, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); } }

        /* === LAYOUT === */
        #app-container { display: none; width: 100%; height: 100%; }

        /* === SIDEBAR (DMs) === */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 15, 18, 0.5);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            backdrop-filter: blur(10px); z-index: 20; transition: transform 0.3s ease;
        }
        .sidebar-header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-list::-webkit-scrollbar { display: none; }
        
        .user-item {
            display: flex; align-items: center; padding: 10px; border-radius: 12px;
            cursor: pointer; transition: 0.2s; margin-bottom: 5px; position: relative;
        }
        .user-item:hover, .user-item.active { background: rgba(255,255,255,0.1); }
        .user-item img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; }
        .online { background: var(--neon-accent); box-shadow: 0 0 8px var(--neon-accent); }
        .offline { background: var(--text-dim); }
        .unread-badge { background: var(--neon-secondary); color: white; font-size: 11px; font-weight: bold; border-radius: 12px; padding: 2px 6px; margin-left: auto; }

        /* === MAIN CHAT AREA === */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.03); z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .mobile-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .chat-title { font-size: 1.5rem; font-weight: 700; text-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }

        #chat-stream {
            flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px;
            display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
        }
        #chat-stream::-webkit-scrollbar { display: none; }

        /* Message Bubbles */
        .message { display: flex; flex-direction: column; max-width: 85%; animation: slideUp 0.3s ease forwards; }
        .msg-theirs { align-self: flex-start; }
        .msg-mine { align-self: flex-end; align-items: flex-end; }
        
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; margin-left: 4px; }
        .msg-header img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .msg-sender { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        .msg-bubble { padding: 12px 18px; font-size: 1rem; line-height: 1.4; backdrop-filter: blur(10px); word-wrap: break-word; }
        .msg-theirs .msg-bubble { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px 20px 20px 4px; }
        .msg-mine .msg-bubble { background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 150, 255, 0.05)); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 20px 20px 4px 20px; }
        .msg-image-attachment { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 8px; object-fit: cover; border: 1px solid var(--glass-border); }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }

        /* Floating Dock Input */
        .floating-dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 800px; background: rgba(15, 15, 18, 0.85);
            border: 1px solid var(--glass-border); border-radius: 30px; padding: 8px 15px;
            display: flex; align-items: center; gap: 10px; backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 100;
        }
        #msg-input {
            flex: 1; background: transparent; border: none; color: var(--text-primary);
            font-size: 1rem; padding: 10px; outline: none;
        }
        .dock-btn {
            width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none;
            color: var(--text-primary); font-size: 1.2rem; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .dock-btn.primary { background: var(--neon-accent); color: #000; box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }

        /* === VIDEO CALL UI === */
        #call-interface {
            display: none; position: absolute; inset: 0; background: #000; z-index: 150;
            flex-direction: column; overflow: hidden;
        }
        .remote-video-area { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: center; }
        .remote-video-area video { width: 100%; height: 100%; object-fit: contain; }
        
        .local-video-area {
            position: absolute; bottom: 100px; right: 20px; width: 140px; height: 200px;
            background: #111; border-radius: 15px; overflow: hidden; border: 2px solid var(--neon-accent);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.2); z-index: 160; cursor: grab;
        }
        .local-video-area video { width: 100%; height: 100%; object-fit: cover; }
        .local-video-area:active { cursor: grabbing; }

        .call-controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(20, 20, 25, 0.8); padding: 12px 20px;
            border-radius: 40px; backdrop-filter: blur(15px); border: 1px solid var(--glass-border); z-index: 170;
        }
        .call-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 1.2rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s;
            background: rgba(255,255,255,0.1); color: white;
        }
        .call-btn.active { background: white; color: black; }
        .call-btn.danger { background: var(--neon-secondary); color: white; width: 60px; border-radius: 30px; }

        /* === MOBILE RESPONSIVENESS === */
        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .floating-dock { bottom: 15px; width: calc(100% - 20px); }
            .local-video-area { width: 100px; height: 150px; bottom: 120px; }
        }
    </style>
</head>
<body>

    <audio id="chatSound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3"></audio>
    <audio id="ringSound" src="https://cdn.pixabay.com/audio/2022/01/18/audio_511d1796d4.mp3" loop></audio>
    <audio id="dialSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_78ec79524c.mp3" loop></audio>

    <div id="login-screen" class="modal-overlay">
        <div class="modal-box">
            <h2 style="margin-bottom: 20px; color: var(--neon-accent);">IdlyCall<span style="color: white;">.</span></h2>
            <img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png">
            <label for="login-file" style="display: block; color: var(--neon-accent); cursor: pointer; margin-bottom: 15px;">📷 Upload Avatar</label>
            <input type="file" id="login-file" accept="image/*" style="display:none;" onchange="processImage(event, 'login-preview')">
            <input type="text" id="usernameInput" placeholder="Enter Username" autocomplete="off">
            <button onclick="manualLogin()">Connect to IdlyCall</button>
        </div>
    </div>

    <div id="settings-screen" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2 style="margin-bottom: 20px;">Settings</h2>
            <img id="settings-preview" class="avatar-preview" src="">
            <label for="settings-file" style="display: block; color: var(--neon-accent); cursor: pointer; margin-bottom: 15px;">📷 Change Avatar</label>
            <input type="file" id="settings-file" accept="image/*" style="display:none;" onchange="processImage(event, 'settings-preview')">
            <input type="text" id="settingsNameInput" placeholder="New Username" autocomplete="off">
            <button onclick="saveSettings()">Save Changes</button>
            <button class="cancel" onclick="document.getElementById('settings-screen').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="incoming-call-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="border-color: var(--neon-secondary);">
            <img id="incoming-avatar" class="avatar-preview pulse-avatar" src="">
            <h3 id="incoming-caller-name" style="margin-bottom: 5px;">Caller</h3>
            <p style="color: var(--text-dim); margin-bottom: 20px;">is calling you on IdlyCall...</p>
            <div style="display: flex; gap: 10px;">
                <button onclick="acceptCall()">Accept</button>
                <button class="danger" onclick="rejectCall()">Decline</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span style="font-weight: bold; letter-spacing: 1px;">IDLYCALL</span>
                <button style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-size: 1.2rem;" onclick="openSettings()">⚙️</button>
            </div>
            <div class="user-list" id="user-list-container">
                </div>
        </div>

        <div class="chat-area" onclick="document.getElementById('sidebar').classList.remove('open')">
            <header>
                <div class="header-left">
                    <button class="mobile-toggle" onclick="event.stopPropagation(); document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <div class="chat-title" id="chatHeaderTitle">Public Channel</div>
                </div>
                <div id="call-buttons-container" style="display: none;">
                    <button style="background:none; border:none; color:var(--neon-accent); font-size: 1.4rem; cursor:pointer;" onclick="startCall(true)">🎥</button>
                </div>
            </header>

            <div id="chat-stream"></div>

            <div class="floating-dock">
                <label for="imageAttachInput" class="dock-btn" style="cursor: pointer;">＋</label>
                <input type="file" id="imageAttachInput" accept="image/*" style="display: none;" onchange="sendImage(event)">
                <input type="text" id="msg-input" placeholder="Transmit message..." autocomplete="off">
                <button class="dock-btn primary" onclick="sendMyMessage()">➤</button>
            </div>

            <div id="call-interface">
                <div class="remote-video-area">
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
                <div class="local-video-area" id="localWrapper">
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>
                <div class="call-controls">
                    <button class="call-btn" onclick="flipCamera()" title="Flip Camera">🔄</button>
                    <button class="call-btn active" id="toggleVideoBtn" onclick="toggleVideo()">📷</button>
                    <button class="call-btn active" id="toggleAudioBtn" onclick="toggleAudio()">🎤</button>
                    <button class="call-btn danger" onclick="endCallBtnClicked()">☎️</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === STATE ===
        let ws;
        let myUsername = localStorage.getItem("chat_username");
        let myPicBase64 = localStorage.getItem("chat_pic") || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
        let currentChat = "Public";
        let userProfiles = {};
        let unreadCounts = {};

        // Audio Setup
        const chatSound = document.getElementById("chatSound"); chatSound.volume = 0.2;
        const ringSound = document.getElementById("ringSound"); ringSound.volume = 0.5;
        const dialSound = document.getElementById("dialSound"); dialSound.volume = 0.4;

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        // === NOTIFICATION API ===
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }
        function notifyUser(title, body) {
            if ("Notification" in window && Notification.permission === "granted" && document.visibilityState !== "visible") {
                new Notification(title, { body: body, icon: myPicBase64 });
            }
        }

        window.onload = () => {
            if (myUsername && localStorage.getItem("chat_pic")) {
                document.getElementById("usernameInput").value = myUsername;
                startApp();
            }
        };

        // === PROFILE & LOGIN ===
        function processImage(e, targetId) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > 800) { height *= 800 / width; width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    const b64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById(targetId).src = b64;
                    if(targetId === 'login-preview') myPicBase64 = b64;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function manualLogin() {
            myUsername = document.getElementById("usernameInput").value.trim();
            if (!myUsername) return alert("Username required!");
            localStorage.setItem("chat_username", myUsername);
            localStorage.setItem("chat_pic", myPicBase64);
            startApp();
        }

        function openSettings() {
            document.getElementById("settingsNameInput").value = myUsername;
            document.getElementById("settings-preview").src = myPicBase64;
            document.getElementById("settings-screen").style.display = "flex";
        }

        function saveSettings() {
            const newName = document.getElementById("settingsNameInput").value.trim();
            if(newName) myUsername = newName;
            myPicBase64 = document.getElementById("settings-preview").src;
            localStorage.setItem("chat_username", myUsername);
            localStorage.setItem("chat_pic", myPicBase64);
            if(ws) ws.send(JSON.stringify({ type: "update_settings", pic: myPicBase64, new_name: myUsername }));
            window.location.reload();
        }

        // === WEBSOCKET CONNECTION ===
        function startApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";
            requestNotificationPermission();

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);
            ws.onopen = () => { ws.send(JSON.stringify({ pic: myPicBase64 })); };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === "chat") {
                    if (data.sender !== myUsername) {
                        chatSound.play().catch(e=>{});
                        notifyUser(`New message from ${data.sender}`, data.message.startsWith("data:image") ? "Sent an image" : data.message);
                    }
                    if ((currentChat === "Public" && data.receiver === "Public") || 
                        (currentChat !== "Public" && (data.sender === currentChat || (data.sender === myUsername && data.receiver === currentChat)))) {
                        drawMessage(data.message, data.sender === myUsername, data.sender, data.profile_pic);
                    } else if (data.sender !== myUsername) {
                        const trackTarget = data.receiver === "Public" ? "Public" : data.sender;
                        unreadCounts[trackTarget] = (unreadCounts[trackTarget] || 0) + 1;
                        updateSidebar(Object.values(userProfiles).map(p => ({username: p.name, profile_pic: p.pic, status: p.status}))); 
                    }
                }
                else if (data.type === "call_offer") { handleIncomingCall(data); }
                else if (data.type === "call_answer") { handleAnswer(data.sdp); }
                else if (data.type === "ice_candidate") { handleIceCandidate(data.candidate); }
                else if (data.type === "call_end") { forceEndCall(); }
                else if (data.type === "history") {
                    document.getElementById('chat-stream').innerHTML = ""; 
                    data.data.forEach(msg => drawMessage(msg.message, msg.sender === myUsername, msg.sender, msg.profile_pic));
                }
                else if (data.type === "user_list") { 
                    data.data.forEach(u => userProfiles[u.username] = {name: u.username, pic: u.profile_pic, status: u.status});
                    updateSidebar(data.data); 
                }
            };
        }

        // === UI LOGIC ===
        function updateSidebar(users) {
            const container = document.getElementById('user-list-container');
            let pubBadge = unreadCounts["Public"] ? `<span class="unread-badge">${unreadCounts["Public"]}</span>` : "";
            let html = `<div class="user-item ${currentChat === 'Public' ? 'active' : ''}" onclick="switchChat('Public')">
                            <span style="font-size: 1.5rem; margin-right: 10px;">🌐</span>
                            <span style="font-weight:bold;">Public Channel</span>${pubBadge}
                        </div>`;
            users.forEach(user => {
                if (user.username === myUsername) return;
                let badge = unreadCounts[user.username] ? `<span class="unread-badge">${unreadCounts[user.username]}</span>` : "";
                html += `<div class="user-item ${currentChat === user.username ? 'active' : ''}" onclick="switchChat('${user.username}')">
                            <img src="${user.profile_pic}">
                            <span>${user.username}</span>${badge}
                            <div class="status-dot ${user.status === 'Online' ? 'online' : 'offline'}"></div>
                         </div>`;
            });
            container.innerHTML = html;
        }

        function switchChat(target) {
            currentChat = target;
            unreadCounts[target] = 0;
            document.getElementById("chatHeaderTitle").innerText = target;
            document.getElementById("msg-input").placeholder = `Transmit to ${target}...`;
            document.getElementById("call-buttons-container").style.display = target === "Public" ? "none" : "block";
            document.getElementById('chat-stream').innerHTML = "";
            document.getElementById('sidebar').classList.remove('open');
            ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            updateSidebar(Object.values(userProfiles).map(p => ({username: p.name, profile_pic: p.pic, status: p.status})));
        }

        function drawMessage(text, isMine, senderName, picUrl) {
            const stream = document.getElementById('chat-stream');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMine ? 'msg-mine' : 'msg-theirs'}`;
            
            let headerHtml = '';
            if (!isMine) {
                let safePic = picUrl || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
                headerHtml = `<div class="msg-header"><img src="${safePic}"><div class="msg-sender">${senderName}</div></div>`;
            }
            
            let contentHtml = text.startsWith("data:image/") 
                ? `<img src="${text}" class="msg-image-attachment">` 
                : `<div class="msg-bubble">${text}</div>`;
                
            msgDiv.innerHTML = `${headerHtml}${contentHtml}`;
            stream.appendChild(msgDiv);
            stream.scrollTo({ top: stream.scrollHeight, behavior: 'smooth' });
        }

        function sendMyMessage() {
            const input = document.getElementById("msg-input");
            const val = input.value.trim();
            if (ws && val) { 
                ws.send(JSON.stringify({ type: "chat", msg_id: generateId(), receiver: currentChat, message: val })); 
                input.value = ''; 
            }
        }
        document.getElementById("msg-input").addEventListener("keypress", (e) => { if (e.key === "Enter") sendMyMessage(); });

        function sendImage(e) {
            const file = e.target.files[0]; if (!file) return; 
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                    if (width > 1200) { height *= 1200 / width; width = 1200; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    ws.send(JSON.stringify({ type: "chat", msg_id: generateId(), receiver: currentChat, message: canvas.toDataURL('image/jpeg', 0.8) }));
                }; img.src = event.target.result;
            }; reader.readAsDataURL(file); e.target.value = '';
        }

        // === HD WEBRTC CALL ENGINE ===
        let peerConnection, localStream, activeCallUser = null, incomingOfferData = null, iceCandidateQueue = [];
        let isVideoOn = true, isAudioOn = true, currentFacingMode = "user";
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        async function initMedia(videoReq) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: videoReq ? { facingMode: currentFacingMode, width: {ideal: 1280}, height: {ideal: 720} } : false, audio: true });
                document.getElementById("localVideo").srcObject = localStream;
                isVideoOn = videoReq; isAudioOn = true;
                document.getElementById("toggleVideoBtn").classList.toggle("active", isVideoOn);
                document.getElementById("toggleAudioBtn").classList.toggle("active", isAudioOn);
                return true;
            } catch (e) { alert("Camera/Microphone access denied."); return false; }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = e => { 
                document.getElementById("remoteVideo").srcObject = e.streams[0]; 
                dialSound.pause(); ringSound.pause();
            };
            peerConnection.onicecandidate = e => { if (e.candidate) ws.send(JSON.stringify({ type: "ice_candidate", target: activeCallUser, candidate: e.candidate })); };
        }

        async function startCall(videoReq) {
            activeCallUser = currentChat;
            document.getElementById("call-interface").style.display = "flex";
            dialSound.play().catch(e=>{});
            if (!await initMedia(videoReq)) { dialSound.pause(); return forceEndCall(); }
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: "call_offer", target: activeCallUser, sdp: offer, video: videoReq }));
        }

        function handleIncomingCall(data) {
            incomingOfferData = data;
            document.getElementById("incoming-caller-name").innerText = data.sender;
            document.getElementById("incoming-avatar").src = userProfiles[data.sender]?.pic || "";
            document.getElementById("incoming-call-modal").style.display = "flex";
            ringSound.play().catch(e=>{});
            notifyUser(`Incoming call from ${data.sender}`, "IdlyCall Ringing");
        }

        async function acceptCall() {
            ringSound.pause(); document.getElementById("incoming-call-modal").style.display = "none";
            if (currentChat !== incomingOfferData.sender) switchChat(incomingOfferData.sender);
            document.getElementById("call-interface").style.display = "flex";
            activeCallUser = incomingOfferData.sender;
            if (!await initMedia(incomingOfferData.video)) return forceEndCall();
            createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData.sdp));
            while (iceCandidateQueue.length > 0) peerConnection.addIceCandidate(iceCandidateQueue.shift()).catch(e=>{});
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "call_answer", target: activeCallUser, sdp: answer }));
        }

        function rejectCall() { 
            ringSound.pause(); document.getElementById("incoming-call-modal").style.display = "none";
            if (incomingOfferData) ws.send(JSON.stringify({ type: "call_end", target: incomingOfferData.sender }));
            incomingOfferData = null; 
        }

        async function handleAnswer(sdp) {
            dialSound.pause();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(sdp));
            while (iceCandidateQueue.length > 0) peerConnection.addIceCandidate(iceCandidateQueue.shift()).catch(e=>{});
        }

        async function handleIceCandidate(c) {
            const rtcC = new RTCIceCandidate(c);
            if (peerConnection && peerConnection.remoteDescription) { try { await peerConnection.addIceCandidate(rtcC); } catch(e){} } 
            else { iceCandidateQueue.push(rtcC); }
        }

        function toggleAudio() {
            if (!localStream) return;
            isAudioOn = !isAudioOn; localStream.getAudioTracks()[0].enabled = isAudioOn;
            document.getElementById("toggleAudioBtn").classList.toggle("active", isAudioOn);
        }

        async function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) { videoTrack.enabled = !videoTrack.enabled; isVideoOn = videoTrack.enabled; }
            document.getElementById("toggleVideoBtn").classList.toggle("active", isVideoOn);
        }

        async function flipCamera() {
            if (!localStream) return;
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            const oldT = localStream.getVideoTracks()[0]; if(oldT) oldT.stop();
            try {
                const newS = await navigator.mediaDevices.getUserMedia({ video: { facingMode: {exact: currentFacingMode} } });
                const newT = newS.getVideoTracks()[0];
                localStream.removeTrack(oldT); localStream.addTrack(newT);
                document.getElementById("localVideo").srcObject = localStream;
                if(peerConnection) { const sender = peerConnection.getSenders().find(s=>s.track.kind==="video"); if(sender) sender.replaceTrack(newT); }
            } catch(e) { currentFacingMode = currentFacingMode === "user" ? "environment" : "user"; }
        }

        function endCallBtnClicked() { if (activeCallUser) ws.send(JSON.stringify({ type: "call_end", target: activeCallUser })); forceEndCall(); }

        function forceEndCall() {
            dialSound.pause(); ringSound.pause();
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            iceCandidateQueue = []; activeCallUser = null; incomingOfferData = null;
            document.getElementById("call-interface").style.display = "none";
            document.getElementById("incoming-call-modal").style.display = "none";
        }

        /* PiP Draggable Video */
        const dragItem = document.getElementById("localWrapper");
        let active = false, currentX, currentY, initialX, initialY, xOff = 0, yOff = 0;
        function dragStart(e) { if(e.type==="touchstart"){initialX=e.touches[0].clientX-xOff;initialY=e.touches[0].clientY-yOff;}else{initialX=e.clientX-xOff;initialY=e.clientY-yOff;} if(dragItem.contains(e.target)){active=true;} }
        function dragEnd() { initialX=currentX; initialY=currentY; active=false; }
        function drag(e) { if(active) { e.preventDefault(); if(e.type==="touchmove"){currentX=e.touches[0].clientX-initialX;currentY=e.touches[0].clientY-initialY;}else{currentX=e.clientX-initialX;currentY=e.clientY-initialY;} xOff=currentX;yOff=currentY; dragItem.style.transform="translate3d("+currentX+"px, "+currentY+"px, 0)"; } }
        document.addEventListener("touchstart", dragStart, {passive:false}); document.addEventListener("touchend", dragEnd); document.addEventListener("touchmove", drag, {passive:false});
        document.addEventListener("mousedown", dragStart); document.addEventListener("mouseup", dragEnd); document.addEventListener("mousemove", drag);
    </script>
</body>
</html>
