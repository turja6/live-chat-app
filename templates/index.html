<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall</title>
    <link rel="icon" type="image/png" href="/static/IC.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="login-screen" class="modal-overlay">...</div>
    <div id="app-container" style="display:none">...</div>
    <div id="call-interface">...</div>

    <script src="/static/script.js"></script>

    <script>
        const activePlugins = ["reactions.js"]; // Add new filenames here to activate them
        activePlugins.forEach(file => {
            const s = document.createElement('script');
            s.src = `/static/plugins/${file}`;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
