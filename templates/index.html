<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Chat - Next Gen UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* === CORE VARIABLES === */
        :root {
            --space-bg: #0a0a0c;
            --glass-bg: rgba(25, 25, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-accent: #00f0ff;
            --neon-secondary: #ff0055;
            --text-primary: #ffffff;
            --text-dim: #888899;
        }

        /* === RESET & FOUNDATION === */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--space-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.05), transparent 25%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* === THE MAIN VESSEL === */
        /* This container maxes out on PC but fills the screen on mobile */
        #nova-app {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* === HEADER === */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .chat-title {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .status-pill {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-accent);
        }

        /* === CHAT STREAM (The actual messages) === */
        #chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px; /* Space for the floating dock */
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Hide ugly scrollbars but keep scrolling */
        #chat-stream::-webkit-scrollbar { display: none; }
        #chat-stream { -ms-overflow-style: none; scrollbar-width: none; }

        /* === MESSAGE BUBBLES === */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: bottom;
        }

        .msg-theirs { align-self: flex-start; }
        .msg-mine { align-self: flex-end; align-items: flex-end; }

        .msg-sender {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .msg-bubble {
            padding: 14px 20px;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            line-height: 1.5;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .msg-theirs .msg-bubble {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px 20px 20px 4px;
        }

        .msg-mine .msg-bubble {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 150, 255, 0.05));
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 5px 25px rgba(0, 240, 255, 0.1);
        }

        /* Animation for new messages */
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* === FLOATING DOCK (Input Area) === */
        .floating-dock {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 800px;
            background: rgba(15, 15, 18, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .dock-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dock-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        
        .dock-btn.primary {
            background: var(--neon-accent);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .dock-btn.primary:hover { box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }

        #msg-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 10px 15px;
            outline: none;
        }
        #msg-input::placeholder { color: var(--text-dim); }

        /* === RESPONSIVE TWEAKS === */
        @media (max-width: 768px) {
            .floating-dock { bottom: 15px; width: calc(100% - 20px); }
            .msg-bubble { padding: 12px 16px; }
            header { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="nova-app">
        <header>
            <div class="chat-title">Nova<span style="color: var(--neon-accent);">.</span></div>
            <div class="status-pill">
                <div class="status-dot"></div>
                Secure Connection
            </div>
        </header>

        <div id="chat-stream">
            </div>

        <div class="floating-dock">
            <button class="dock-btn" title="Attach Menu">＋</button>
            <button class="dock-btn" title="Start Call" style="color: var(--neon-secondary);">📞</button>
            
            <input type="text" id="msg-input" placeholder="Transmit message..." autocomplete="off">
            
            <button class="dock-btn primary" id="send-btn" onclick="sendMyMessage()">➤</button>
        </div>
    </div>

    <script>
        /* === FAST LIGHTWEIGHT LOGIC === */
        const stream = document.getElementById('chat-stream');
        const input = document.getElementById('msg-input');

        // Auto-scroll to bottom mathematically
        function scrollToBottom() {
            stream.scrollTo({ top: stream.scrollHeight, behavior: 'smooth' });
        }

        // The exact function to draw a message onto the screen instantly
        function drawMessage(text, isMine, senderName = "System") {
            if (!text.trim()) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMine ? 'msg-mine' : 'msg-theirs'}`;
            
            let senderHtml = isMine ? '' : `<div class="msg-sender">${senderName}</div>`;
            
            msgDiv.innerHTML = `
                ${senderHtml}
                <div class="msg-bubble">${text}</div>
            `;
            
            stream.appendChild(msgDiv);
            scrollToBottom();
        }

        // Triggered when you click the send button
        function sendMyMessage() {
            const val = input.value;
            if (val) {
                drawMessage(val, true);
                input.value = '';
                input.focus();
                
                // Simulate a fast, fake reply 1 second later to show off the UI
                setTimeout(() => {
                    drawMessage("Received your transmission. The UI feels incredibly smooth.", false, "Nexus Node");
                }, 1000);
            }
        }

        // Allow pressing Enter to send
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMyMessage();
        });

        // Initialize with some dummy data to show the design
        window.onload = () => {
            setTimeout(() => drawMessage("Connection established. Welcome to the new architecture.", false, "Nexus Node"), 300);
            setTimeout(() => drawMessage("This uses CSS Clamp for fluid typography and GPU-accelerated transforms.", false, "Nexus Node"), 1200);
        };
    </script>
</body>
</html>
