<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1e2124; --bg-secondary: #2f3136; --bg-tertiary: #36393f;
            --text-primary: #dcddde; --text-muted: #72767d; --accent: #5865f2;
            --online: #3ba55c; --offline: #747f8d; --danger: #ed4245;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; }
        
        /* Login */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-tertiary); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
        }
        #login-screen h1 { margin-bottom: 20px; color: white; }
        #login-screen input, #login-screen button {
            padding: 12px; margin: 5px; border-radius: 5px; border: none; outline: none;
        }
        #login-screen input { width: 250px; background: var(--bg-primary); color: white; }
        #login-screen button { background: var(--accent); color: white; cursor: pointer; width: 150px; font-weight: 600; }

        /* Layout */
        .app-container { display: flex; width: 100%; height: 100%; }
        
        /* Sidebar */
        .sidebar { width: 240px; background: var(--bg-secondary); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; }
        .sidebar-header { padding: 15px; border-bottom: 2px solid var(--bg-primary); text-align: center; font-weight: 600; }
        .server-item { padding: 10px; margin: 10px; background: var(--bg-tertiary); border-radius: 5px; cursor: pointer; }
        .server-item.active { background: var(--accent); }
        .user-list { flex: 1; overflow-y: auto; padding: 10px; border-top: 2px solid var(--bg-primary); }
        .user-item { display: flex; align-items: center; padding: 8px; cursor: pointer; border-radius: 5px; }
        .user-item:hover { background: var(--bg-tertiary); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; object-fit: cover; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; }
        .online { background: var(--online); }.offline { background: var(--offline); }

        /* Chat */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-tertiary); position: relative; }
        .chat-header { height: 50px; background: var(--bg-secondary); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bg-primary); }
        .chat-header-actions button { background: transparent; border: 1px solid var(--text-muted); color: var(--text-primary); padding: 5px 10px; margin-left: 10px; border-radius: 4px; cursor: pointer; display: none; }
        .chat-header-actions button.show { display: inline-block; }
        
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; align-items: flex-start; }
        .message img.avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .message-body { max-width: 70%; }
        .message-meta { font-size: 12px; margin-bottom: 5px; }
        .message-meta span:first-child { font-weight: 600; color: white; margin-right: 10px; }
        .message-content { background: var(--bg-primary); padding: 10px 15px; border-radius: 5px; line-height: 1.4; word-break: break-word; }
        .message-content img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        
        .typing-indicator { padding: 10px 20px; font-size: 12px; font-style: italic; color: var(--text-muted); height: 20px; }

        .input-area { padding: 20px; background: var(--bg-tertiary); }
        .input-wrapper { background: var(--bg-primary); border-radius: 8px; padding: 5px; display: flex; align-items: center; }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        .input-wrapper input[type="file"] { display: none; }
        .input-wrapper label { cursor: pointer; padding: 10px; color: var(--text-muted); }
        .input-wrapper button { background: var(--accent); border: none; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        /* --- IMPROVED CALLING UI --- */
        #calling-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50;
        }
        
        .call-videos-container {
            position: relative; width: 100%; height: 80%; display: flex; justify-content: center; align-items: center;
        }

        #remote-video {
            width: 100%; height: 100%; object-fit: cover; background: #000;
        }

        #local-video {
            position: absolute; bottom: 20px; right: 20px; width: 200px; height: 150px; 
            border-radius: 10px; border: 2px solid var(--accent); object-fit: cover; z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .call-info {
            position: absolute; top: 30px; color: white; font-size: 24px; font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .call-controls {
            position: absolute; bottom: 40px; display: flex; gap: 20px; z-index: 10;
        }

        .call-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            transition: transform 0.2s, background 0.2s;
        }
        .call-btn:hover { transform: scale(1.1); }
        .call-btn.end { background: var(--danger); color: white; }
        .call-btn.action { background: var(--bg-secondary); color: white; border: 2px solid var(--text-muted); }
        .call-btn.active { background: white; color: black; }

        /* Mobile */
        .hamburger { display: none; font-size: 24px; cursor: pointer; margin-right: 15px; }
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; height: 100%; z-index: 10; transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .hamburger { display: block; }
            #local-video { width: 100px; height: 75px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>👋 Welcome to NeonChat</h1>
        <input type="text" id="username-input" placeholder="Enter Username" />
        <label for="avatar-input" style="cursor:pointer; margin-top:10px; color:var(--accent);">Upload Avatar</label>
        <input type="file" id="avatar-input" accept="image/*" />
        <button onclick="login()">Join Chat</button>
    </div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">NeonChat</div>
            <div class="server-list">
                <div class="server-item active" onclick="joinRoom('public')">🌍 Public Server</div>
            </div>
            <div class="user-list" id="user-list"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div style="display:flex; align-items:center;">
                    <span class="hamburger" onclick="toggleSidebar()">☰</span>
                    <span id="chat-title">Public Server</span>
                </div>
                <div class="chat-header-actions">
                    <button id="video-call-btn" onclick="startCall(true)">Video Call</button>
                </div>
            </div>
            
            <div class="messages-container" id="messages-container"></div>
            <div class="typing-indicator" id="typing-indicator"></div>
            
            <div class="input-area">
                <div class="input-wrapper">
                    <label for="image-input">➕</label>
                    <input type="file" id="image-input" accept="image/*" onchange="handleImageSend(this)" />
                    <input type="text" id="message-input" placeholder="Message..." onkeyup="handleTyping(event)" />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>

            <!-- Calling UI -->
            <div id="calling-ui">
                <div class="call-info" id="call-status">Calling...</div>
                <div class="call-videos-container">
                    <video id="remote-video" autoplay playsinline></video>
                    <video id="local-video" autoplay muted playsinline></video>
                </div>
                <div class="call-controls">
                    <button class="call-btn action" id="btn-mute" onclick="toggleMute()">🎤</button>
                    <button class="call-btn action" id="btn-video" onclick="toggleVideo()">📹</button>
                    <button class="call-btn end" onclick="hangup()">📞</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentChat = "public";
        let socket = null;
        let localStream = null;
        let peerConnection = null;
        let isMuted = false;
        let isVideoOff = false;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // --- Auth ---
        async function login() {
            const username = document.getElementById('username-input').value;
            const avatarFile = document.getElementById('avatar-input').files[0];
            if (!username) return alert('Username required');

            const formData = new FormData();
            formData.append('username', username);
            if (avatarFile) formData.append('file', avatarFile);

            const res = await fetch('/login', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.ok) {
                currentUser = data;
                document.getElementById('login-screen').style.display = 'none';
                initWebSocket();
                loadUsers();
            } else { alert(data.detail); }
        }

        // --- WebSocket ---
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws/${currentUser.username}`);

            socket.onopen = () => { joinRoom('public'); };
            
            socket.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'ping') return;

                // Messaging
                if (data.type === 'chat_message') {
                    // Always append if it's for current chat OR if I am the sender (optimistic fix)
                    const isForMe = (data.receiver === currentChat) || (data.sender === currentChat);
                    const isPublic = (currentChat === 'public' && data.receiver === 'public');
                    
                    if (isForMe || isPublic) {
                        appendMessage(data);
                    }
                }
                
                if (data.type === 'typing') {
                    if (data.sender === currentChat) {
                        document.getElementById('typing-indicator').innerText = `${data.sender} is typing...`;
                        setTimeout(() => { document.getElementById('typing-indicator').innerText = ''; }, 1000);
                    }
                }
                if (data.type === 'user_update') loadUsers();

                // WebRTC
                if (data.type === 'call_offer') {
                    if (confirm(`Incoming call from ${data.sender}. Answer?`)) {
                        currentChat = data.sender;
                        updateHeader();
                        await startCall(true, data.offer);
                    } else { socket.send(JSON.stringify({type: 'call_hangup', target: data.sender})); }
                }
                if (data.type === 'call_answer') {
                    document.getElementById('call-status').innerText = "Connected";
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
                if (data.type === 'ice_candidate') {
                    if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
                if (data.type === 'call_hangup') { hangup(); alert("Call ended"); }
            };
        }

        // --- UI Logic ---
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

        async function loadUsers() {
            const res = await fetch('/users');
            const users = await res.json();
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            users.forEach(user => {
                if (user.username === currentUser.username) return;
                const item = document.createElement('div');
                item.className = 'user-item';
                item.onclick = () => joinRoom(user.username);
                item.innerHTML = `
                    <img src="${user.profile_pic}" class="user-avatar" />
                    <span>${user.username}</span>
                    <div class="status-dot ${user.status === 'online' ? 'online' : 'offline'}"></div>
                `;
                list.appendChild(item);
            });
        }

        async function joinRoom(target) {
            currentChat = target;
            updateHeader();
            toggleSidebar();
            document.getElementById('messages-container').innerHTML = '';
            
            const res = await fetch(`/messages/${target}`);
            const messages = await res.json();
            messages.forEach(msg => {
                // Filter logic for DMs
                if (target !== 'public') {
                    const isRelevant = (msg.sender === target && msg.receiver === currentUser.username) || 
                                       (msg.sender === currentUser.username && msg.receiver === target);
                    if (!isRelevant) return;
                }
                appendMessage(msg);
            });
            scrollToBottom();
        }

        function updateHeader() {
            const title = document.getElementById('chat-title');
            const isPrivate = currentChat !== 'public';
            title.innerText = isPrivate ? `@ ${currentChat}` : '🌍 Public Server';
            document.getElementById('video-call-btn').classList.toggle('show', isPrivate);
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = 'message';
            
            // Robust Image Check
            const isImage = (msg.content.startsWith('http') && !msg.content.startsWith('https://via.placeholder')) || msg.content.includes('cloudinary');
            const contentHtml = isImage 
                ? `<div class="message-content"><img src="${msg.content}" alt="img" /></div>`
                : `<div class="message-content">${escapeHtml(msg.content)}</div>`;

            const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            div.innerHTML = `
                <img src="${msg.profile_pic || 'https://via.placeholder.com/150'}" class="avatar" />
                <div class="message-body">
                    <div class="message-meta">
                        <span>${msg.sender}</span><span>${time}</span>
                    </div>
                    ${contentHtml}
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value;
            if (!content) return;

            // Optimistic UI: Add message immediately
            appendMessage({
                sender: currentUser.username,
                receiver: currentChat,
                content: content,
                profile_pic: currentUser.profile_pic,
                timestamp: new Date().toISOString()
            });

            socket.send(JSON.stringify({
                type: 'chat_message',
                sender: currentUser.username,
                receiver: currentChat,
                content: content
            }));
            input.value = '';
        }

        function handleImageSend(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    socket.send(JSON.stringify({
                        type: 'chat_message',
                        sender: currentUser.username,
                        receiver: currentChat,
                        content: e.target.result
                    }));
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleTyping(e) { if (e.key === 'Enter') sendMessage(); else socket.send(JSON.stringify({type: 'typing', receiver: currentChat})); }
        function scrollToBottom() { document.getElementById('messages-container').scrollTop = document.getElementById('messages-container').scrollHeight; }
        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        // --- WebRTC Advanced Features ---
        async function startCall(isVideo, offer=null) {
            document.getElementById('calling-ui').style.display = 'flex';
            document.getElementById('call-status').innerText = offer ? "Connecting..." : "Calling...";
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                document.getElementById('local-video').srcObject = localStream;

                peerConnection = new RTCPeerConnection(config);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (event) => { document.getElementById('remote-video').srcObject = event.streams[0]; };
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) socket.send(JSON.stringify({type: 'ice_candidate', target: currentChat, candidate: event.candidate}));
                };

                if (offer) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.send(JSON.stringify({type: 'call_answer', target: currentChat, answer: answer}));
                    document.getElementById('call-status').innerText = "Connected";
                } else {
                    const offerCreated = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offerCreated);
                    socket.send(JSON.stringify({type: 'call_offer', target: currentChat, offer: offerCreated}));
                }
            } catch (err) {
                console.error(err);
                alert("Camera/Mic access denied or error.");
                hangup();
            }
        }

        function toggleMute() {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = !track.enabled);
                isMuted = !isMuted;
                document.getElementById('btn-mute').innerText = isMuted ? '🔇' : '🎤';
                document.getElementById('btn-mute').classList.toggle('active', isMuted);
            }
        }

        function toggleVideo() {
            if (localStream) {
                localStream.getVideoTracks().forEach(track => track.enabled = !track.enabled);
                isVideoOff = !isVideoOff;
                document.getElementById('btn-video').innerText = isVideoOff ? '🚫' : '📹';
                document.getElementById('btn-video').classList.toggle('active', isVideoOff);
            }
        }

        function hangup() {
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            peerConnection = null; localStream = null;
            document.getElementById('calling-ui').style.display = 'none';
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
            isMuted = false; isVideoOff = false;
        }
    </script>
</body>
</html>
