<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord Ultimate - Full Sync & Audio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* === CORE THEME === */
        :root { --bg-dark: #202225; --bg-mid: #2f3136; --bg-light: #36393f; --text-main: #dcddde; --text-muted: #8e9297; --accent: #5865F2; --input-bg: #40444b; --online: #3ba55d; --hover: #393c43; --danger: #ed4245; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-dark); color: var(--text-main); overflow: hidden; user-select: none; }
        #app-container { display: none; width: 100%; height: 100%; display: flex; position: relative; }
        .mobile-nav-btn { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; margin-right: 15px; }

        /* === SIDEBAR === */
        .sidebar { width: 260px; background: var(--bg-mid); display: flex; flex-direction: column; border-right: 1px solid #202225; transition: transform 0.3s ease; z-index: 20; }
        .sidebar-header { height: 60px; border-bottom: 1px solid #202225; display: flex; align-items: center; padding: 0 20px; font-weight: bold; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .settings-icon { cursor: pointer; color: var(--text-muted); font-size: 18px; transition: 0.2s; }
        .settings-icon:hover { color: white; transform: rotate(90deg); }
        #user-list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .user-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; position: relative; }
        .user-item:hover, .user-item.active { background: var(--hover); color: white; }
        .user-item img { width: 32px; height: 32px; border-radius: 50%; margin-right: 12px; object-fit: cover; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; }
        .online { background: var(--online); } .offline { background: #747f8d; }
        .unread-badge { background: var(--danger); color: white; font-size: 11px; font-weight: bold; border-radius: 12px; padding: 2px 6px; margin-left: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* === MAIN CHAT AREA === */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-light); height: 100%; position: relative; min-width: 0; }
        .chat-header { height: 60px; border-bottom: 1px solid #202225; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); justify-content: space-between; z-index: 10; }
        .chat-header-info { display: flex; align-items: center; font-weight: bold; font-size: 16px; }
        .call-buttons { display: flex; gap: 15px; }
        .call-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.2s; }
        .call-btn:hover { color: white; transform: scale(1.1); }

        /* === DISCORD PERFECT CALL INTERFACE === */
        #call-interface { display: none; flex-direction: column; background: #000; width: 100%; height: 65vh; min-height: 300px; position: relative; z-index: 5; border-bottom: 1px solid #202225; overflow: hidden; }
        
        .call-top-bar { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 52; pointer-events: none; }
        #call-status { font-size: 14px; color: var(--online); font-weight: bold; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px; pointer-events: auto; }
        
        .fs-btn { background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 16px; pointer-events: auto; transition: 0.2s; }
        .fs-btn:hover { background: rgba(255,255,255,0.2); }

        .video-container { display: flex; flex: 1; position: relative; width: 100%; height: 100%; justify-content: center; align-items: center; background: #000; }
        
        .remote-video-area { width: 100%; height: 100%; position: relative; display: none; justify-content: center; align-items: center; background: #000; }
        .remote-video-area video { width: 100%; height: 100%; object-fit: contain; } /* 'contain' ensures screen shares aren't cropped */
        
        .local-video-area { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: center; transition: 0.3s ease; }
        .local-video-area video { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
        
        /* Picture-in-Picture mode */
        .local-video-area.floating-local { position: absolute; bottom: 90px; right: 20px; width: 260px; height: 150px; background: #18191c; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); z-index: 49; cursor: grab; overflow: hidden; border: 1px solid #36393f; transition: none; }
        .local-video-area.floating-local:active { cursor: grabbing; }

        .video-avatar { width: 120px; height: 120px; border-radius: 50%; position: absolute; z-index: 1; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .nametag { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 3; pointer-events: none; }
        
        /* Fixed Call Controls Pill */
        .call-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 51; background: rgba(24, 25, 28, 0.95); padding: 12px 24px; border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #2f3136; backdrop-filter: blur(5px); }
        .control-btn { background: #36393f; color: white; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .control-btn:hover { background: #4f545c; }
        .control-btn.active { background: white; color: var(--bg-dark); } 
        .control-btn.danger { background: var(--danger); color: white; border-radius: 30px; width: 65px; }
        .control-btn.danger:hover { background: #d83c3e; }

        /* Fullscreen Video Fixes */
        :fullscreen .video-container { width: 100vw; height: 100vh; }
        :fullscreen .call-controls { bottom: 40px; }

        /* === MESSAGES & UI (Condensed for brevity) === */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; user-select: text; }
        .msg-container { display: flex; align-items: flex-start; position: relative; transition: 0.1s; border-radius: 4px; padding: 4px 20px; margin: 0 -20px; }
        .msg-container:hover { background: #32353b; }
        .msg-container img.avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 16px; object-fit: cover; cursor: pointer; margin-top: 4px; }
        .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .msg-header .name { font-weight: bold; color: white; font-size: 15px; cursor: pointer; }
        .msg-text { color: var(--text-main); font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg-image-attachment { max-width: 350px; max-height: 350px; border-radius: 8px; margin-top: 8px; cursor: zoom-in; object-fit: cover; }
        
        .discord-embed { background: var(--bg-mid); border-left: 4px solid var(--accent); border-radius: 4px; padding: 12px; margin-top: 8px; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
        .embed-title { color: var(--accent); font-weight: bold; font-size: 14px; text-decoration: none; }
        .embed-desc { font-size: 13px; color: var(--text-main); }
        .embed-img { max-width: 100%; border-radius: 4px; object-fit: cover; margin-top: 4px; }
        
        .reply-bar { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-bottom: 4px; cursor: pointer; }
        .reply-bar::before { content: "↳"; margin-right: 4px; font-size: 14px; }

        /* Inputs */
        .input-wrapper { padding: 0 20px 20px 20px; position: relative; }
        #typing-indicator { position: absolute; top: -20px; left: 20px; font-size: 12px; color: var(--text-muted); font-weight: bold; display: none; }
        #active-mode-banner { background: var(--bg-mid); border-radius: 8px 8px 0 0; padding: 8px 15px; font-size: 12px; font-weight: bold; color: var(--text-muted); display: none; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bg-dark); }
        .input-box { display: flex; align-items: center; background: var(--input-bg); border-radius: 8px; padding: 10px 15px; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; margin-right: 10px; transition: 0.2s; padding: 0; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { color: white; transform: scale(1.1); }
        .input-box input { flex: 1; border: none; background: transparent; color: white; font-size: 15px; outline: none; }

        /* Emoji Picker */
        .emoji-picker-modal { display: none; position: absolute; bottom: 70px; left: 20px; background: var(--bg-mid); border-radius: 8px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); width: 280px; grid-template-columns: repeat(6, 1fr); gap: 8px; z-index: 50; border: 1px solid #202225; }
        .emoji-item { cursor: pointer; font-size: 24px; text-align: center; padding: 5px; border-radius: 4px; transition: 0.1s; }
        .emoji-item:hover { background: var(--bg-light); transform: scale(1.2); }

        /* Custom Right Click Menu */
        #context-menu { display: none; position: absolute; background: #18191c; width: 220px; border-radius: 4px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 1000; padding: 8px 0; border: 1px solid #202225; }
        .context-item { padding: 10px 15px; color: var(--text-main); font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; }
        .context-item:hover { background: var(--accent); color: white; }

        /* Modals */
        .modal-overlay { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; background: rgba(0,0,0,0.85); z-index: 500; position: absolute; top:0; left:0; }
        .modal-box { background: var(--bg-light); padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .modal-box input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: none; background: var(--bg-dark); color: white; outline: none; font-size: 15px; }
        .modal-box button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.2s; }
        
        .incoming-call-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-dark); padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 101; display: none; text-align: center; width: 300px; border-top: 5px solid var(--accent); }
        .pulse-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px auto; object-fit: cover; animation: pulse 1.5s infinite; border: 3px solid var(--accent); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(88, 101, 242, 0); } 100% { box-shadow: 0 0 0 0 rgba(88, 101, 242, 0); } }

        @media (max-width: 768px) {
            .mobile-nav-btn { display: block; }
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 280px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(0); }
            #call-interface { height: 75vh; }
            .call-controls { width: 85%; bottom: 10px; padding: 8px; gap: 10px; flex-wrap: wrap; justify-content: center; }
            .local-video-area.floating-local { width: 120px; height: 160px; bottom: 120px; right: 10px; }
        }
    </style>
</head>
<body>

<audio id="chatSound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3"></audio>
<audio id="ringSound" src="https://cdn.pixabay.com/audio/2022/01/18/audio_511d1796d4.mp3" loop></audio>
<audio id="dialSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_78ec79524c.mp3" loop></audio>

<div id="login-screen" class="modal-overlay" style="display:flex; background: var(--bg-dark);">
    <div class="modal-box">
        <h2 style="margin-top:0;">Join the Server</h2>
        <img id="login-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" style="width:100px; height:100px; border-radius:50%; margin:0 auto 15px auto; object-fit:cover; border: 2px solid var(--accent);">
        <label for="loginFileInput" style="cursor: pointer; display: block; color: var(--accent); margin-bottom: 20px; font-weight: bold;">📷 Upload Avatar</label>
        <input type="file" id="loginFileInput" accept="image/*" style="display: none;" onchange="processImage(event, 'login-preview', true)">
        <input type="text" id="usernameInput" placeholder="Choose a Username" autocomplete="off"/>
        <button onclick="manualLogin()">Connect</button>
    </div>
</div>

<div id="context-menu">
    <div class="context-item" onclick="prepareReply()">💬 Reply to Message</div>
    <div class="context-item" onclick="prepareEdit()" id="ctx-edit">✏️ Edit Message</div>
    <div class="context-item danger" onclick="deleteMessage()" id="ctx-delete">🗑️ Delete Message</div>
</div>

<div id="incoming-call-modal" class="incoming-call-modal">
    <img id="incoming-avatar" src="" class="pulse-avatar">
    <h3 style="margin: 0 0 5px 0; color: white; font-size: 22px;" id="incoming-caller-name">Caller</h3>
    <p style="color: var(--text-muted); margin-top: 0; margin-bottom: 20px;">is calling you...</p>
    <div style="display: flex; gap: 15px; justify-content: center;">
        <button style="background: var(--online); color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold;" onclick="acceptCall()">Accept</button>
        <button style="background: var(--danger); color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold;" onclick="rejectCall()">Decline</button>
    </div>
</div>

<div id="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span style="font-size: 16px;">Direct Messages</span>
        </div>
        <div id="user-list-container"></div>
    </div>
    
    <div class="chat-area" onclick="closeAllPopups()">
        <div class="chat-header">
            <div class="chat-header-info">
                <button class="mobile-nav-btn" onclick="event.stopPropagation(); document.getElementById('sidebar').classList.toggle('open')">☰</button>
                <span style="color:var(--text-muted); margin-right:8px; font-size:22px;">@</span>
                <span id="chatHeaderTitle" style="font-size: 18px;">Public</span>
            </div>
            <div class="call-buttons" id="call-buttons-container" style="display: none;">
                <button class="call-btn" onclick="startCall(false)" title="Voice Call">📞</button>
                <button class="call-btn" onclick="startCall(true)" title="Video Call">🎥</button>
            </div>
        </div>
        
        <div id="call-interface">
            <div class="call-top-bar">
                <span id="call-status">Connecting...</span>
                <button class="fs-btn" onclick="toggleFullscreen()" title="Maximize / Fullscreen Video">⛶</button>
            </div>
            
            <div class="video-container" id="videoContainer">
                <div class="remote-video-area" id="remoteWrapper">
                    <img id="remoteVideoAvatar" class="video-avatar" src="">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="nametag" id="remoteNametag">User</div>
                </div>
                <div class="local-video-area" id="localWrapper">
                    <img id="localVideoAvatar" class="video-avatar" src="" style="display:none;">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="nametag">You</div>
                </div>
            </div>

            <div class="call-controls">
                <button class="control-btn" onclick="flipCamera()" title="Flip Camera">🔄</button>
                <button class="control-btn active" id="toggleVideoBtn" onclick="toggleVideo()">📷</button>
                <button class="control-btn active" id="toggleAudioBtn" onclick="toggleAudio()">🎤</button>
                <button class="control-btn" id="shareScreenBtn" onclick="toggleScreenShare()" title="Share Screen">🖥️</button>
                <button class="control-btn danger" onclick="endCallBtnClicked()">☎️</button>
            </div>
        </div>

        <div id="messages"></div>
        
        <div class="input-wrapper">
            <div id="active-mode-banner">
                <span id="active-mode-text">Replying to...</span>
                <span class="cancel-mode-btn" onclick="cancelActionMode()">✖</span>
            </div>
            <div id="typing-indicator">Someone is typing...</div>
            
            <div id="emoji-picker-menu" class="emoji-picker-modal" style="display: none;">
                <span class="emoji-item" onclick="insertEmoji('😀')">😀</span><span class="emoji-item" onclick="insertEmoji('😂')">😂</span>
                <span class="emoji-item" onclick="insertEmoji('❤️')">❤️</span><span class="emoji-item" onclick="insertEmoji('👍')">👍</span>
                <span class="emoji-item" onclick="insertEmoji('🔥')">🔥</span><span class="emoji-item" onclick="insertEmoji('✨')">✨</span>
                <span class="emoji-item" onclick="insertEmoji('💀')">💀</span><span class="emoji-item" onclick="insertEmoji('👀')">👀</span>
                <span class="emoji-item" onclick="insertEmoji('🎉')">🎉</span><span class="emoji-item" onclick="insertEmoji('🤔')">🤔</span>
                <span class="emoji-item" onclick="insertEmoji('😭')">😭</span><span class="emoji-item" onclick="insertEmoji('😡')">😡</span>
            </div>

            <div class="input-box">
                <label for="imageAttachInput" class="action-btn" style="background:#4f545c; color:var(--bg-dark); border-radius:50%; width:28px; height:28px; margin-right:15px;">+</label>
                <input type="file" id="imageAttachInput" accept="image/*" style="display: none;" onchange="sendImage(event)">
                <input type="text" id="messageText" placeholder="Message..." autocomplete="off" oninput="handleTyping()"/>
                <button class="action-btn" onclick="toggleEmojiPicker(); event.stopPropagation()" style="margin: 0 5px;">😀</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* =========================================
       1. STATE & AUDIO ENGINE
    ========================================= */
    let ws;
    let myUsername = localStorage.getItem("chat_username");
    let myPicBase64 = localStorage.getItem("chat_pic") || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
    let currentChat = "Public";
    let userProfiles = {}; 
    let unreadCounts = {};
    
    // Audio Elements
    const chatSound = document.getElementById("chatSound");
    const ringSound = document.getElementById("ringSound");
    const dialSound = document.getElementById("dialSound");

    let isEditingMsgId = null;
    let isReplyingToId = null;

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

    window.onload = () => {
        if (myUsername && localStorage.getItem("chat_pic")) {
            document.getElementById("usernameInput").value = myUsername;
            startApp();
        }
    };

    function manualLogin() {
        myUsername = document.getElementById("usernameInput").value.trim();
        if (!myUsername) return alert("Username required!");
        localStorage.setItem("chat_username", myUsername);
        localStorage.setItem("chat_pic", myPicBase64);
        startApp();
    }

    function processImage(e, targetImgId, isLogin) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width; let height = img.height;
                if (width > 1080) { height *= 1080 / width; width = 1080; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                const b64 = canvas.toDataURL('image/jpeg', 0.85);
                document.getElementById(targetImgId).src = b64;
                if (isLogin) myPicBase64 = b64;
            }; img.src = event.target.result;
        }; reader.readAsDataURL(file);
    }

    /* =========================================
       2. WEBSOCKET CONNECTION
    ========================================= */
    function startApp() {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app-container").style.display = "flex";
        document.getElementById("localVideoAvatar").src = myPicBase64;

        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);
        ws.onopen = function() { ws.send(JSON.stringify({ pic: myPicBase64 })); };
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.type === "chat") {
                // Play notification sound if message is not from me
                if (data.sender !== myUsername) chatSound.play().catch(e=>{});
                
                if ((currentChat === "Public" && data.receiver === "Public") || (currentChat !== "Public" && (data.sender === currentChat || (data.sender === myUsername && data.receiver === currentChat)))) {
                    appendMessage(data);
                } else if (data.sender !== myUsername) {
                    const trackTarget = data.receiver === "Public" ? "Public" : data.sender;
                    unreadCounts[trackTarget] = (unreadCounts[trackTarget] || 0) + 1;
                    updateUserSidebar(Object.values(userProfiles).map(p => ({username: p.name, profile_pic: p.pic, status: p.status}))); 
                }
            }
            // NEW: Synchronized Call End Handling
            else if (data.type === "call_end") {
                forceEndCall(); // Close UI immediately when peer hangs up
            }
            else if (data.type === "call_offer") { handleIncomingCall(data); }
            else if (data.type === "call_answer") { handleAnswer(data.sdp); }
            else if (data.type === "ice_candidate") { handleIceCandidate(data.candidate); }
            
            else if (data.type === "edit_message") {
                const msgEl = document.getElementById(`msg-text-${data.msg_id}`);
                if (msgEl) msgEl.innerHTML = parseFormattedText(data.new_text) + ` <span style="font-size:10px; color:var(--text-muted);">(edited)</span>`;
            }
            else if (data.type === "delete_message") {
                const el = document.getElementById(`msg-${data.msg_id}`);
                if (el) el.remove();
            }
            else if (data.type === "typing") { handleIncomingTyping(data.sender); }
            else if (data.type === "history") {
                document.getElementById('messages').innerHTML = ""; 
                data.data.forEach(msg => appendMessage(msg));
            }
            else if (data.type === "user_list") { 
                data.data.forEach(u => userProfiles[u.username] = {name: u.username, pic: u.profile_pic, status: u.status});
                updateUserSidebar(data.data); 
            }
        };
    }

    /* =========================================
       3. FULLSCREEN & UI
    ========================================= */
    function toggleFullscreen() {
        const videoContainer = document.getElementById("videoContainer");
        if (!document.fullscreenElement) {
            videoContainer.requestFullscreen().catch(err => { alert(`Fullscreen blocked by browser.`); });
        } else {
            document.exitFullscreen();
        }
    }

    function parseFormattedText(text) {
        let html = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        html = html.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>"); 
        html = html.replace(/\*(.*?)\*/g, "<i>$1</i>");     
        html = html.replace(/__(.*?)__/g, "<u>$1</u>");     
        html = html.replace(/~~(.*?)~~/g, "<del>$1</del>"); 
        html = html.replace(/(https?:\/\/[^\s]+)/g, "<a href='$1' target='_blank' style='color:var(--accent); text-decoration:none;'>$1</a>");
        return html;
    }

    /* =========================================
       4. MESSAGE RENDERING & INPUTS
    ========================================= */
    function appendMessage(msgObj) {
        const messages = document.getElementById('messages');
        const { msg_id, sender, profile_pic, message, timestamp, preview, reply_to } = msgObj;
        let contentHtml = ""; let embedHtml = ""; let replyHtml = "";

        if (reply_to) replyHtml = `<div class="reply-bar" onclick="document.getElementById('msg-${reply_to}').scrollIntoView({behavior: 'smooth'})">Replying to a previous message...</div>`;

        if (message.startsWith("data:image/")) { contentHtml = `<img src="${message}" class="msg-image-attachment" onclick="openImageViewer('${message}', event)">`; } 
        else { contentHtml = `<div class="msg-text" id="msg-text-${msg_id}" data-raw="${message}">${parseFormattedText(message)}</div>`; }

        if (preview && preview.title) {
            let imgBlock = preview.image ? `<img src="${preview.image}" class="embed-img">` : '';
            embedHtml = `<div class="discord-embed"><a href="${preview.url}" target="_blank" class="embed-title">${preview.title}</a><div class="embed-desc">${preview.description.substring(0, 100)}...</div>${imgBlock}</div>`;
        }

        messages.innerHTML += `
            <div class="msg-container" id="msg-${msg_id}" data-sender="${sender}" oncontextmenu="openContextMenu(event, '${msg_id}', '${sender}')">
                <img src="${profile_pic}" class="avatar">
                <div>
                    ${replyHtml}
                    <div class="msg-header"><span class="name">${sender}</span><span class="time">${timestamp}</span></div>
                    ${contentHtml}
                    ${embedHtml}
                </div>
            </div>
        `;
        messages.scrollTop = messages.scrollHeight;
    }

    let typingTimer;
    function handleTyping() { if (ws) ws.send(JSON.stringify({ type: "typing", receiver: currentChat })); }
    function handleIncomingTyping(sender) {
        const ind = document.getElementById("typing-indicator"); ind.innerText = `${sender} is typing...`; ind.style.display = "block";
        clearTimeout(typingTimer); typingTimer = setTimeout(() => ind.style.display = "none", 3000);
    }

    function sendMessage() {
        const input = document.getElementById("messageText"); const val = input.value.trim();
        if (ws && val) { 
            if (isEditingMsgId) ws.send(JSON.stringify({ type: "edit_message", msg_id: isEditingMsgId, new_text: val, receiver: currentChat }));
            else ws.send(JSON.stringify({ type: "chat", msg_id: generateId(), receiver: currentChat, message: val, reply_to: isReplyingToId })); 
            
            // Play sound locally when sending
            chatSound.play().catch(e=>{});
            
            input.value = ''; cancelActionMode();
        }
        document.getElementById("emoji-picker-menu").style.display = "none";
    }
    document.getElementById("messageText").addEventListener("keypress", function(e) { if (e.key === "Enter") sendMessage(); });

    function sendImage(e) {
        const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas'); let width = img.width; let height = img.height;
                if (width > 1200) { height *= 1200 / width; width = 1200; }
                canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                ws.send(JSON.stringify({ type: "chat", msg_id: generateId(), receiver: currentChat, message: canvas.toDataURL('image/jpeg', 0.8), reply_to: isReplyingToId }));
                chatSound.play().catch(e=>{});
                cancelActionMode();
            }; img.src = event.target.result;
        }; reader.readAsDataURL(file); e.target.value = '';
    }

    /* =========================================
       5. CONTEXT MENU & UI STATES
    ========================================= */
    const contextMenu = document.getElementById("context-menu");
    function openContextMenu(e, msg_id, sender) {
        e.preventDefault(); contextMenuTargetId = msg_id; contextMenuTargetSender = sender;
        document.getElementById("ctx-edit").style.display = sender === myUsername ? "flex" : "none";
        document.getElementById("ctx-delete").style.display = sender === myUsername ? "flex" : "none";
        contextMenu.style.display = "block";
        let x = e.pageX; let y = e.pageY;
        if (x + 220 > window.innerWidth) x = window.innerWidth - 220; if (y + 150 > window.innerHeight) y = window.innerHeight - 150;
        contextMenu.style.left = x + "px"; contextMenu.style.top = y + "px";
    }
    document.addEventListener("click", closeAllPopups);
    function deleteMessage() { if (ws && contextMenuTargetId) ws.send(JSON.stringify({ type: "delete_message", msg_id: contextMenuTargetId, receiver: currentChat })); }
    function prepareEdit() {
        const textDiv = document.getElementById(`msg-text-${contextMenuTargetId}`); if (!textDiv) return;
        isEditingMsgId = contextMenuTargetId; document.getElementById("messageText").value = textDiv.getAttribute("data-raw"); document.getElementById("messageText").focus();
        document.getElementById("active-mode-text").innerText = "Editing Message..."; document.getElementById("active-mode-banner").style.display = "flex";
    }
    function prepareReply() {
        isReplyingToId = contextMenuTargetId; document.getElementById("messageText").focus();
        document.getElementById("active-mode-text").innerText = `Replying to ${contextMenuTargetSender}`; document.getElementById("active-mode-banner").style.display = "flex";
    }
    function cancelActionMode() { isEditingMsgId = null; isReplyingToId = null; document.getElementById("active-mode-banner").style.display = "none"; document.getElementById("messageText").value = ""; }

    function updateUserSidebar(users) {
        const container = document.getElementById('user-list-container');
        let pubBadge = unreadCounts["Public"] ? `<span class="unread-badge">${unreadCounts["Public"]}</span>` : "";
        let html = `<div class="user-item ${currentChat === 'Public' ? 'active' : ''}" id="nav-Public" onclick="switchChat('Public')"><img src="https://cdn-icons-png.flaticon.com/512/1256/1256650.png"><span style="font-weight:bold;">Public Server</span>${pubBadge}</div>`;
        users.forEach(user => {
            if (user.username === myUsername) return; 
            let badge = unreadCounts[user.username] ? `<span class="unread-badge">${unreadCounts[user.username]}</span>` : "";
            html += `<div class="user-item ${currentChat === user.username ? 'active' : ''}" id="nav-${user.username}" style="opacity: ${user.status === 'Offline' ? '0.5' : '1'};" onclick="switchChat('${user.username}')"><img src="${user.profile_pic}"><span>${user.username}</span>${badge}<div class="status-dot ${user.status === 'Online' ? 'online' : 'offline'}"></div></div>`;
        }); container.innerHTML = html;
    }

    function switchChat(targetUser) {
        currentChat = targetUser; unreadCounts[targetUser] = 0; 
        document.getElementById("chatHeaderTitle").innerText = targetUser; document.getElementById("messageText").placeholder = `Message @${targetUser}`;
        document.getElementById("call-buttons-container").style.display = targetUser === "Public" ? "none" : "flex";
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        const activeNav = document.getElementById(`nav-${targetUser}`); if(activeNav) activeNav.classList.add('active');
        document.getElementById('messages').innerHTML = ""; ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
        closeAllPopups(); cancelActionMode();
    }

    function toggleEmojiPicker() { const picker = document.getElementById("emoji-picker-menu"); picker.style.display = picker.style.display === "grid" ? "none" : "grid"; }
    function insertEmoji(emoji) { document.getElementById("messageText").value += emoji; document.getElementById("messageText").focus(); }
    function closeAllPopups() { document.getElementById("emoji-picker-menu").style.display = "none"; document.getElementById('sidebar').classList.remove('open'); contextMenu.style.display = "none"; }

    /* =========================================
       6. LOCAL VIDEO DRAG SYSTEM (PiP)
    ========================================= */
    const dragItem = document.getElementById("localWrapper");
    let dragActive = false; let currentX, currentY, initialX, initialY; let xOffset = 0, yOffset = 0;

    function dragStart(e) {
        if (!dragItem.classList.contains("floating-local")) return;
        if (e.type === "touchstart") { initialX = e.touches[0].clientX - xOffset; initialY = e.touches[0].clientY - yOffset; } 
        else { initialX = e.clientX - xOffset; initialY = e.clientY - yOffset; }
        if (e.target === dragItem || dragItem.contains(e.target)) { dragActive = true; }
    }
    function dragEnd(e) { initialX = currentX; initialY = currentY; dragActive = false; }
    function drag(e) {
        if (dragActive && dragItem.classList.contains("floating-local")) {
            e.preventDefault();
            if (e.type === "touchmove") { currentX = e.touches[0].clientX - initialX; currentY = e.touches[0].clientY - initialY; } 
            else { currentX = e.clientX - initialX; currentY = e.clientY - initialY; }
            xOffset = currentX; yOffset = currentY;
            dragItem.style.transform = "translate3d(" + currentX + "px, " + currentY + "px, 0)";
        }
    }
    document.addEventListener("touchstart", dragStart, {passive: false}); document.addEventListener("touchend", dragEnd, false); document.addEventListener("touchmove", drag, {passive: false});
    document.addEventListener("mousedown", dragStart, false); document.addEventListener("mouseup", dragEnd, false); document.addEventListener("mousemove", drag, false);

    /* =========================================
       7. HD WEBRTC & DISCONNECT SYNC
    ========================================= */
    let peerConnection; let localStream; let screenStream; let activeCallUser = null; let incomingOfferData = null; let iceCandidateQueue = [];
    let isVideoOn = true; let isAudioOn = true; let isSharingScreen = false; let currentFacingMode = "user"; 

    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
    function updateCallStatus(msg) { document.getElementById("call-status").innerText = msg; }

    async function initMedia(videoRequested) {
        try {
            const videoConstraints = videoRequested ? { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } : false;
            localStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: true });
            document.getElementById("localVideo").srcObject = localStream;
            
            isVideoOn = videoRequested; isAudioOn = true;
            document.getElementById("toggleVideoBtn").classList.toggle("active", isVideoOn);
            document.getElementById("toggleAudioBtn").classList.toggle("active", isAudioOn);
            document.getElementById("localVideoAvatar").style.display = isVideoOn ? "none" : "block";
            return true;
        } catch (error) { alert("Hardware access denied."); return false; }
    }

    function createPeerConnection() {
        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        peerConnection.ontrack = event => {
            const remoteVid = document.getElementById("remoteVideo");
            remoteVid.srcObject = event.streams[0];
            document.getElementById("remoteWrapper").style.display = "flex"; 
            document.getElementById("localWrapper").classList.add("floating-local");
            
            dialSound.pause(); ringSound.pause();
            updateCallStatus("Connected");
            
            event.streams[0].getVideoTracks()[0].onmute = () => document.getElementById("remoteVideoAvatar").style.display = "block";
            event.streams[0].getVideoTracks()[0].onunmute = () => document.getElementById("remoteVideoAvatar").style.display = "none";
        };
        
        peerConnection.onicecandidate = event => { if (event.candidate) ws.send(JSON.stringify({ type: "ice_candidate", target: activeCallUser, candidate: event.candidate })); };
    }

    function toggleAudio() {
        if (!localStream) return;
        isAudioOn = !isAudioOn; localStream.getAudioTracks()[0].enabled = isAudioOn;
        document.getElementById("toggleAudioBtn").classList.toggle("active", isAudioOn);
    }

    async function toggleVideo() {
        if (!localStream) return;
        if (!isVideoOn) {
            try {
                const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
                const videoTrack = newStream.getVideoTracks()[0];
                localStream.addTrack(videoTrack); peerConnection.addTrack(videoTrack, localStream);
                isVideoOn = true;
            } catch (e) { return; }
        } else {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) { videoTrack.enabled = !videoTrack.enabled; isVideoOn = videoTrack.enabled; }
        }
        document.getElementById("toggleVideoBtn").classList.toggle("active", isVideoOn);
        document.getElementById("localVideoAvatar").style.display = isVideoOn ? "none" : "block";
    }

    async function flipCamera() {
        if (!localStream || !isVideoOn || isSharingScreen) return;
        currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
        const oldVideoTrack = localStream.getVideoTracks()[0]; if (oldVideoTrack) oldVideoTrack.stop();
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: currentFacingMode } } });
            const newVideoTrack = newStream.getVideoTracks()[0];
            localStream.removeTrack(oldVideoTrack); localStream.addTrack(newVideoTrack);
            document.getElementById("localVideo").srcObject = localStream;
            if (peerConnection) {
                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
                if (sender) sender.replaceTrack(newVideoTrack);
            }
        } catch (e) { currentFacingMode = currentFacingMode === "user" ? "environment" : "user"; }
    }

    async function toggleScreenShare() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) { alert("Mobile browsers block screen sharing. Please use a PC to share your screen!"); return; }

        if (!peerConnection) return;
        try {
            if (!isSharingScreen) {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(screenTrack);
                document.getElementById('localVideo').srcObject = screenStream;
                isSharingScreen = true; document.getElementById("shareScreenBtn").classList.add("active");
                screenTrack.onended = stopScreenShare;
            } else { stopScreenShare(); }
        } catch (e) { }
    }

    function stopScreenShare() {
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        const cameraTrack = localStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
        if (sender && cameraTrack) sender.replaceTrack(cameraTrack); 
        document.getElementById('localVideo').srcObject = localStream;
        isSharingScreen = false; document.getElementById("shareScreenBtn").classList.remove("active");
    }

    async function startCall(videoRequested) {
        activeCallUser = currentChat;
        document.getElementById("call-interface").style.display = "flex";
        document.getElementById("remoteWrapper").style.display = "none";
        document.getElementById("localWrapper").classList.remove("floating-local");
        document.getElementById("localWrapper").style.transform = "none"; 
        xOffset = 0; yOffset = 0;
        
        updateCallStatus("Ringing...");
        dialSound.play().catch(e=>{});

        if (!await initMedia(videoRequested)) { dialSound.pause(); return forceEndCall(); }
        createPeerConnection();
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "call_offer", target: activeCallUser, sdp: offer, video: videoRequested }));
    }

    function handleIncomingCall(data) {
        incomingOfferData = data;
        document.getElementById("incoming-caller-name").innerText = data.sender;
        document.getElementById("incoming-avatar").src = userProfiles[data.sender]?.pic || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
        document.getElementById("incoming-call-modal").style.display = "block";
        ringSound.play().catch(e=>{});
    }

    async function acceptCall() {
        ringSound.pause();
        document.getElementById("incoming-call-modal").style.display = "none";
        if (currentChat !== incomingOfferData.sender) switchChat(incomingOfferData.sender);
        
        document.getElementById("call-interface").style.display = "flex";
        document.getElementById("remoteVideoAvatar").src = userProfiles[incomingOfferData.sender]?.pic || "";
        document.getElementById("remoteNametag").innerText = incomingOfferData.sender;
        document.getElementById("localWrapper").classList.remove("floating-local");
        document.getElementById("localWrapper").style.transform = "none"; 
        xOffset = 0; yOffset = 0;

        updateCallStatus("Connecting...");
        activeCallUser = incomingOfferData.sender;
        if (!await initMedia(incomingOfferData.video)) return forceEndCall();
        
        createPeerConnection();
        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData.sdp));
        while (iceCandidateQueue.length > 0) peerConnection.addIceCandidate(iceCandidateQueue.shift()).catch(e=>{});
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: "call_answer", target: activeCallUser, sdp: answer }));
    }

    function rejectCall() { 
        ringSound.pause(); 
        document.getElementById("incoming-call-modal").style.display = "none"; 
        // Tell caller we rejected
        if (incomingOfferData) {
            ws.send(JSON.stringify({ type: "call_end", target: incomingOfferData.sender }));
        }
        incomingOfferData = null; 
    }

    async function handleAnswer(sdp) {
        dialSound.pause();
        await peerConnection.setRemoteDescription(new RTCSessionDescription(sdp));
        document.getElementById("remoteVideoAvatar").src = userProfiles[activeCallUser]?.pic || "";
        document.getElementById("remoteNametag").innerText = activeCallUser;
        while (iceCandidateQueue.length > 0) peerConnection.addIceCandidate(iceCandidateQueue.shift()).catch(e=>{});
    }

    async function handleIceCandidate(candidate) {
        const rtcCandidate = new RTCIceCandidate(candidate);
        if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
            try { await peerConnection.addIceCandidate(rtcCandidate); } catch (e) {}
        } else { iceCandidateQueue.push(rtcCandidate); }
    }

    // Called when the user clicks the Hang Up button
    function endCallBtnClicked() {
        if (activeCallUser) {
            // Signal the other person to hang up
            ws.send(JSON.stringify({ type: "call_end", target: activeCallUser }));
        }
        forceEndCall();
    }

    // Called instantly to clean up UI
    function forceEndCall() {
        dialSound.pause(); ringSound.pause();
        if (document.fullscreenElement) { document.exitFullscreen().catch(e=>{}); }
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
        if (screenStream) { screenStream.getTracks().forEach(track => track.stop()); screenStream = null; }
        iceCandidateQueue = []; 
        
        document.getElementById("call-interface").style.display = "none"; 
        document.getElementById("remoteWrapper").style.display = "none";
        document.getElementById("localWrapper").classList.remove("floating-local");
        document.getElementById("localWrapper").style.transform = "none"; 
        xOffset = 0; yOffset = 0;
        activeCallUser = null;
        incomingOfferData = null;
        document.getElementById("incoming-call-modal").style.display = "none";
    }

</script>
