<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall Pro</title>
    <link rel="icon" type="image/png" href="/static/IC.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <audio id="chatSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <div id="login-screen" class="modal-overlay">
        <div class="modal-box">
            <img src="/static/IC.png" class="app-logo">
            <h2>IdlyCall</h2>
            <div class="avatar-container">
                <img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png">
                <input type="file" id="login-file" hidden onchange="processImage(event, 'login-preview')">
                <label for="login-file" class="upload-badge">📷</label>
            </div>
            <input type="text" id="usernameInput" placeholder="Enter username...">
            <button onclick="window.manualLogin()" class="login-btn">Connect</button>
        </div>
    </div>

    <div id="app-container" style="display:none">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="/static/IC.png" height="30">
                <span>Chats</span>
            </div>
            <div class="user-list" id="user-list-container">
                </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <div class="header-info">
                    <button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <h3 id="chatHeaderTitle">Public Server</h3>
                </div>
            </header>

            <div id="chat-stream">
                </div>

            <footer class="input-area">
                <div class="input-box">
                    <input type="text" id="msg-input" placeholder="Message...">
                    <button onclick="window.sendMyMessage()" class="send-btn">➤</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="/static/script.js"></script>
    <script>
        // Only load plugins if the files actually exist in your folder
        const activePlugins = ["reactions.js"]; 
        activePlugins.forEach(file => {
            const s = document.createElement('script');
            s.src = `/static/plugins/${file}`;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
