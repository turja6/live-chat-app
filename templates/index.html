<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall Pro</title>
    <link rel="icon" type="image/png" href="/static/IC.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Audio Elements -->
    <audio id="chatSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <audio id="ringtone" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- ==========================================
         LOGIN MODAL
    ========================================== -->
    <div id="login-screen" class="modal-overlay">
        <div class="modal-box">
            <img src="/static/IC.png" class="app-logo" alt="IdlyCall">
            <h2>IdlyCall</h2>
            <div class="avatar-container">
                <img id="login-preview" class="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="Avatar Preview">
                <input type="file" id="login-file" hidden onchange="processImage(event, 'login-preview')">
                <label for="login-file" class="upload-badge">📷</label>
            </div>
            <input type="text" id="usernameInput" placeholder="Enter username..." autocomplete="off">
            <button onclick="window.manualLogin()" class="login-btn">Connect</button>
        </div>
    </div>

    <!-- ==========================================
         MAIN APPLICATION CONTAINER
    ========================================== -->
    <div id="app-container" style="display:none">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="/static/IC.png" alt="Logo" width="28" height="28">
                <span>Chats</span>
            </div>
            <div class="user-list" id="user-list-container"></div>
        </aside>

        <!-- CHAT AREA -->
        <main class="chat-area">

            <!-- HEADER WITH CALL BUTTONS -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="mobile-menu" onclick="toggleMobileSidebar()" aria-label="Toggle menu">☰</button>
                    <h3 id="chatHeaderTitle">Public Server</h3>
                </div>

                <!-- CALL BUTTON GROUP (Voice + Video) -->
                <div class="call-buttons" id="callButtons">
                    <button class="call-btn call-btn-voice" onclick="startCall(false)" title="Voice Call">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </button>
                    <button class="call-btn call-btn-video" onclick="startCall(true)" title="Video Call">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    </button>
                </div>
            </header>

            <!-- MESSAGE STREAM -->
            <div id="chat-stream"></div>

            <!-- INPUT AREA - RGB Animated Chatbox -->
            <footer class="input-area">
                <div class="input-box">
                    <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
                    <button onclick="window.sendMyMessage()" class="send-btn" aria-label="Send message">➤</button>
                </div>
            </footer>
        </main>
    </div>

    <!-- ==========================================
         INCOMING CALL RINGING MODAL
    ========================================== -->
    <div id="ringing-modal" class="ringing-overlay" style="display:none;">
        <div class="ringing-box">
            <div class="ringing-avatar">
                <img id="caller-avatar" src="" alt="Caller">
            </div>
            <h3 id="caller-name">Incoming Call...</h3>
            <p id="call-type-label">Video Call</p>
            <div class="ringing-animation">
                <span class="ring-dot"></span>
                <span class="ring-dot"></span>
                <span class="ring-dot"></span>
            </div>
            <div class="ringing-actions">
                <button class="ringing-btn ringing-decline" onclick="declineCall()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    Decline
                </button>
                <button class="ringing-btn ringing-accept" onclick="acceptCall()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 10 20 15 10 25"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg>
                    Accept
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         ⭐ CALL INTERFACE OVERLAY (FIXED FULL SCREEN)
         Active during calls - sits above everything
    ========================================== -->
    <div id="call-interface" class="call-overlay" style="display:none;">

        <!-- REMOTE VIDEO (Full Background) -->
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>

        <!-- No Remote Video Fallback (Shows Avatar) -->
        <div id="noRemoteVideo" class="no-video-fallback">
            <img id="remoteUserAvatar" src="" alt="">
            <span id="remoteUserName">User</span>
        </div>

        <!-- LOCAL VIDEO PiP (Bottom Right Corner) -->
        <div id="localPip" class="pip-container">
            <video id="localVideo" class="local-video" autoplay playsinline muted></video>
            <div id="noLocalVideo" class="no-pip-video">
                <span>📷 Off</span>
            </div>
        </div>

        <!-- TOP INFO BAR (Status + Timer) -->
        <div class="call-info-bar">
            <span id="callStatus">Connecting...</span>
            <span id="callTimer" class="call-timer">00:00</span>
        </div>

        <!-- FULLSCREEN TOGGLE BUTTON (Top Right) -->
        <button class="fullscreen-toggle" onclick="toggleFullscreen()" title="Toggle Fullscreen">
            <svg id="fsIconEnter" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <svg id="fsIconExit" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
        </button>

        <!-- BOTTOM CONTROLS BAR (Glassmorphism) -->
        <div class="call-controls">

            <!-- MUTE BUTTON -->
            <button class="ctrl-btn ctrl-mute" id="btnMute" onclick="toggleMute()">
                <svg id="micOn" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                <svg id="micOff" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.3"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 1.5-.7 2.83-1.78 3.69"/></svg>
                <span>Mute</span>
            </button>

            <!-- CAMERA TOGGLE BUTTON -->
            <button class="ctrl-btn ctrl-camera" id="btnCamera" onclick="toggleCamera()">
                <svg id="camOn" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                <svg id="camOff" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                <span>Camera</span>
            </button>

            <!-- SCREEN SHARE BUTTON -->
            <button class="ctrl-btn ctrl-screen" id="btnScreen" onclick="toggleScreenShare()">
                <svg id="screenOn" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <svg id="screenOff" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                <span>Share</span>
            </button>

            <!-- 🔴 END CALL BUTTON (RED - CRITICAL FIX) -->
            <button class="ctrl-btn ctrl-end" id="btnEndCall" onclick="window.forceEndCall()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
                <span>End</span>
            </button>

        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/script.js"></script>
    
    <!-- Plugin Loader -->
    <script>
        const plugins = ["reactions.js", "typing.js", "previews.js"];
        plugins.forEach(plugin => {
            const script = document.createElement('script');
            script.src = `/static/plugins/${plugin}`;
            document.body.appendChild(script);
        });
    </script>

</body>
</html>
