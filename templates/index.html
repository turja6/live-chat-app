<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdlyCall Pro - Phase 1</title>
    <style>
        /* --- PRO CSS THEME --- */
        :root { --bg: #08090a; --panel: #121317; --accent: #FF7A00; --text: #ffffff; --border: #2a2b30; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; color: var(--text); }
        body { background: var(--bg); height: 100vh; overflow: hidden; display: flex; }

        /* Login Screen */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: var(--panel); padding: 40px; border-radius: 12px; border: 1px solid var(--border); text-align: center; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box input { width: 100%; padding: 15px; margin: 20px 0; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; transition: 0.3s; }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-box button:hover { background: #e66e00; }

        /* App Layout */
        #app-container { display: none; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 1.2rem; }
        .user-list { flex: 1; overflow-y: auto; padding: 15px; }
        .user-item { padding: 12px 15px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .user-item:hover { background: rgba(255, 255, 255, 0.05); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #00ff00; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 20px 30px; border-bottom: 1px solid var(--border); background: rgba(18, 19, 23, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .e2ee-badge { font-size: 0.8rem; color: #00ff00; display: flex; align-items: center; gap: 5px; background: rgba(0, 255, 0, 0.1); padding: 5px 10px; border-radius: 20px; }
        
        #chat-stream { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        /* Messages */
        .message { display: flex; flex-direction: column; max-width: 70%; }
        .msg-sender { font-size: 0.75rem; color: #888; margin-bottom: 5px; margin-left: 5px; }
        .msg-text { background: #1a1b20; padding: 12px 16px; border-radius: 12px; border-bottom-left-radius: 2px; line-height: 1.5; }
        .message.my-message { align-self: flex-end; }
        .message.my-message .msg-sender { align-self: flex-end; margin-right: 5px; }
        .message.my-message .msg-text { background: var(--accent); color: white; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }

        /* Typing Indicator */
        #typing-status { position: absolute; bottom: 90px; left: 30px; font-size: 0.85rem; color: var(--accent); font-style: italic; opacity: 0; transition: opacity 0.3s; pointer-events: none; }

        /* Input Area (RGB Pill) */
        .input-area { padding: 0 30px 30px 30px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
        .input-box { display: flex; align-items: center; background: #000; border: 1px solid var(--accent); border-radius: 50px; padding: 5px 5px 5px 20px; box-shadow: 0 0 15px rgba(255, 122, 0, 0.1); }
        .input-box input { flex: 1; height: 45px; background: transparent; border: none; color: white; outline: none; font-size: 1rem; }
        .input-box button { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .input-box button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--accent); font-size: 2rem; margin-bottom: 5px;">IC</h2>
            <p style="color: #888; margin-bottom: 20px;">IdlyCall Pro</p>
            <input type="text" id="usernameInput" placeholder="Enter your username..." autocomplete="off">
            <button onclick="startApp()">Enter Secure Chat</button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">Active Chats</div>
            <div class="user-list" id="user-list-container"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h3 id="chatHeaderTitle">Public Server</h3>
                <div class="e2ee-badge">🔒 End-to-End Encrypted</div>
            </div>
            
            <div id="chat-stream"></div>
            
            <div id="typing-status">Someone is typing...</div>

            <div class="input-area">
                <div class="input-box">
                    <input type="text" id="msg-input" placeholder="Type a secure message..." onkeypress="handleEnter(event)" oninput="notifyTyping()">
                    <button onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- PRO JAVASCRIPT LOGIC --- */
        let ws;
        let myUsername = "";
        let currentChat = "Public";
        let typingTimeout;

        function startApp() {
            const input = document.getElementById("usernameInput").value.trim();
            if (!input) return alert("Please enter a username.");
            
            myUsername = input;
            
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";

            const protocol = location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${location.host}/ws/${myUsername}`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === "chat") {
                    drawMessage(data.sender, data.message);
                } 
                else if (data.type === "user_list") {
                    updateSidebar(data.data);
                }
                else if (data.type === "typing" && data.sender === currentChat) {
                    showTypingIndicator(data.sender);
                }
            };
        }

        // Feature: Send Typing Signal
        function notifyTyping() {
            if (currentChat !== "Public" && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "typing", receiver: currentChat }));
            }
        }

        // Feature: Show Typing Indicator
        function showTypingIndicator(sender) {
            const indicator = document.getElementById('typing-status');
            indicator.innerText = `${sender} is typing...`;
            indicator.style.opacity = "1";
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                indicator.style.opacity = "0";
            }, 2000);
        }

        function drawMessage(sender, text) {
            const stream = document.getElementById('chat-stream');
            const div = document.createElement('div');
            
            div.className = sender === myUsername ? 'message my-message' : 'message';
            
            div.innerHTML = `
                <div class="msg-sender">${sender}</div>
                <div class="msg-text">${text}</div>
            `;
            
            stream.appendChild(div);
            stream.scrollTo({ top: stream.scrollHeight, behavior: 'smooth' });
        }

        function updateSidebar(users) {
            const container = document.getElementById('user-list-container');
            container.innerHTML = users.map(user => `
                <div class="user-item" onclick="switchChat('${user.username}')">
                    <div class="status-dot"></div>
                    ${user.username}
                </div>
            `).join('');
        }

        function switchChat(targetUser) {
            currentChat = targetUser;
            document.getElementById("chatHeaderTitle").innerText = targetUser;
            document.getElementById('chat-stream').innerHTML = ""; 
        }

        function sendMessage() {
            const inputField = document.getElementById("msg-input");
            const text = inputField.value.trim();
            if (!text) return;

            ws.send(JSON.stringify({ type: "chat", receiver: currentChat, message: text }));
            inputField.value = ""; 
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
