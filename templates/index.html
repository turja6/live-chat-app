<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall Pro</title>
    <style>
        :root { --bg: #202225; --side: #2f3136; --chat: #36393f; --accent: #5865F2; --text: #dcddde; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        /* Layout */
        .sidebar { width: 260px; background: var(--side); display: flex; flex-direction: column; border-right: 1px solid #202225; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat); position: relative; }
        header { padding: 15px; background: var(--side); display: flex; justify-content: space-between; align-items: center; }
        
        /* Video Call Overlay */
        #call-screen { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; bottom: 100px; right: 20px; width: 120px; height: 160px; border-radius: 8px; border: 2px solid var(--accent); object-fit: cover; }
        .call-controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
        .btn-call { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.5rem; }
        .btn-hangup { background: #ed4245; color: white; }
        
        /* Messages & Sidebar items */
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .user-item { padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .user-item:hover { background: var(--chat); }
        .user-item img { width: 35px; height: 35px; border-radius: 50%; }
        .status { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; }
        .online { background: #3ba55d; }
        
        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="margin-bottom:20px;">IdlyCall Login</h2>
        <input type="text" id="username" placeholder="Username" style="padding:10px; margin-bottom:10px;">
        <button onclick="connect()" style="padding:10px 20px; background:var(--accent); color:white; border:none;">Join</button>
    </div>

    <div class="sidebar">
        <div style="padding:20px; font-weight:bold;">Channels</div>
        <div id="user-list"></div>
    </div>

    <div class="chat-area">
        <header>
            <span id="chat-header"># Public Channel</span>
            <div id="call-btns" style="display:none;">
                <button onclick="startCall(true)" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">🎥</button>
                <button onclick="startCall(false)" style="background:none; border:none; font-size:1.5rem; cursor:pointer; margin-left:15px;">📞</button>
            </div>
        </header>
        <div id="messages"></div>
        <div style="padding:20px; display:flex;">
            <input type="text" id="msgInput" style="flex:1; padding:10px; background:var(--side); color:white; border:none;">
            <button onclick="sendMsg()" style="padding:10px; background:var(--accent); color:white; border:none; margin-left:10px;">Send</button>
        </div>
    </div>

    <div id="call-screen">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        <div class="call-controls">
            <button class="btn-call" onclick="toggleMic()">🎤</button>
            <button class="btn-call" onclick="flipCamera()">🔄</button>
            <button class="btn-call btn-hangup" onclick="endCall()">☎️</button>
        </div>
    </div>

    <script>
        let ws, myUsername, currentChat = "Public", localStream, peerConn;
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        function connect() {
            myUsername = document.getElementById("username").value.trim();
            if(!myUsername) return;
            document.getElementById("login-screen").style.display = "none";
            ws = new WebSocket(`${window.location.protocol==='https:'?'wss':'ws'}://${window.location.host}/ws/${myUsername}`);
            ws.onopen = () => ws.send(JSON.stringify({pic: ""}));
            ws.onmessage = async (e) => {
                const data = JSON.parse(e.data);
                if(data.type === "chat") drawMsg(data);
                if(data.type === "user_list") renderUsers(data.users);
                if(data.type === "call_offer") handleOffer(data);
                if(data.type === "call_answer") peerConn.setRemoteDescription(new RTCSessionDescription(data.sdp));
                if(data.type === "ice_candidate") peerConn.addIceCandidate(new RTCIceCandidate(data.candidate));
                if(data.type === "call_end") resetCallUI();
            };
        }

        async function startCall(video) {
            document.getElementById("call-screen").style.display = "flex";
            localStream = await navigator.mediaDevices.getUserMedia({video: video, audio: true});
            document.getElementById("local-video").srcObject = localStream;
            
            peerConn = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConn.addTrack(track, localStream));
            
            peerConn.onicecandidate = (e) => {
                if(e.candidate) ws.send(JSON.stringify({type:"ice_candidate", target: currentChat, candidate: e.candidate}));
            };
            peerConn.ontrack = (e) => document.getElementById("remote-video").srcObject = e.streams[0];
            
            const offer = await peerConn.createOffer();
            await peerConn.setLocalDescription(offer);
            ws.send(JSON.stringify({type:"call_offer", target: currentChat, sdp: offer, video: video}));
        }

        async function handleOffer(data) {
            if(!confirm(`Incoming call from ${data.sender}. Accept?`)) return;
            document.getElementById("call-screen").style.display = "flex";
            localStream = await navigator.mediaDevices.getUserMedia({video: data.video, audio: true});
            document.getElementById("local-video").srcObject = localStream;

            peerConn = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConn.addTrack(track, localStream));
            peerConn.onicecandidate = (e) => {
                if(e.candidate) ws.send(JSON.stringify({type:"ice_candidate", target: data.sender, candidate: e.candidate}));
            };
            peerConn.ontrack = (e) => document.getElementById("remote-video").srcObject = e.streams[0];
            
            await peerConn.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await peerConn.createAnswer();
            await peerConn.setLocalDescription(answer);
            ws.send(JSON.stringify({type:"call_answer", target: data.sender, sdp: answer}));
        }

        function endCall() {
            ws.send(JSON.stringify({type:"call_end", target: currentChat}));
            resetCallUI();
        }

        function resetCallUI() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById("call-screen").style.display = "none";
        }

        function renderUsers(users) {
            const list = document.getElementById("user-list");
            list.innerHTML = `<div class="user-item" onclick="switchChat('Public')"># Public Server</div>`;
            users.forEach(u => {
                if(u.username === myUsername) return;
                list.innerHTML += `<div class="user-item" onclick="switchChat('${u.username}')">${u.username} <div class="status ${u.status==='Online'?'online':''}"></div></div>`;
            });
        }

        function switchChat(u) {
            currentChat = u;
            document.getElementById("chat-header").innerText = u === "Public" ? "# Public" : "@ " + u;
            document.getElementById("call-btns").style.display = u === "Public" ? "none" : "block";
        }

        function drawMsg(d) {
            const m = document.getElementById("messages");
            m.innerHTML += `<div><b>${d.sender}:</b> ${d.content}</div>`;
            m.scrollTop = m.scrollHeight;
        }

        function sendMsg() {
            const i = document.getElementById("msgInput");
            ws.send(JSON.stringify({type:"chat", receiver: currentChat, content: i.value, pic: ""}));
            i.value = "";
        }
    </script>
</body>
</html>
