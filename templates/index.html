<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdlyCall - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #202225;
            --bg-sidebar: #2f3136;
            --bg-chat: #36393f;
            --bg-input: #40444b;
            --accent: #5865F2;
            --text-main: #dcddde;
            --text-muted: #8e9297;
            --bubble-other: #4f545c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* Login Screen */
        #login-screen { background: var(--bg-sidebar); padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 90%; max-width: 350px; }
        .logo-text { font-size: 1.8rem; font-weight: 600; color: white; margin-bottom: 25px; }
        .logo-text span { color: var(--accent); }
        #login-screen input { width: 100%; padding: 14px; border-radius: 6px; border: none; background: var(--bg-input); color: white; font-size: 1rem; margin-bottom: 20px; outline: none; }
        #login-screen button { width: 100%; padding: 14px; border: none; background: var(--accent); color: white; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        #login-screen button:hover { background: #4752C4; }

        /* App Container (Sidebar + Chat) */
        #app-container { display: none; width: 100%; height: 100%; max-width: 1200px; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--bg-main); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: 600; color: white; border-bottom: 1px solid var(--bg-main); }
        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-item { padding: 10px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; margin-bottom: 2px; transition: 0.2s; }
        .user-item:hover { background: var(--bg-chat); color: white; }
        .user-item.active { background: var(--accent); color: white; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #3ba55d; margin-right: 10px; }
        
        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
        header { padding: 20px; border-bottom: 1px solid var(--bg-main); font-weight: 600; color: white; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; animation: fadeIn 0.3s ease; }
        .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }
        .msg-info { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .msg-bubble { padding: 10px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .me .msg-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .other .msg-bubble { background: var(--bubble-other); color: white; border-bottom-left-radius: 4px; }

        /* Input Area */
        #input-area { padding: 20px; background: var(--bg-sidebar); }
        .input-box { display: flex; background: var(--bg-input); border-radius: 8px; overflow: hidden; }
        .input-box input { flex: 1; padding: 15px; border: none; background: transparent; color: white; outline: none; font-size: 0.95rem; }
        .input-box button { padding: 0 20px; border: none; background: transparent; color: var(--accent); font-weight: 600; cursor: pointer; }
        .input-box button:hover { color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mobile adjustment */
        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .user-item span { display: none; }
            .user-item { justify-content: center; }
            .status-dot { margin-right: 0; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-text">Idly<span>Call</span></div>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="off" onkeypress="if(event.key === 'Enter') connect()">
        <button onclick="connect()">Join System</button>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">Channels & DMs</div>
            <div class="user-list" id="user-list-container"></div>
        </div>

        <div class="chat-area">
            <header id="chat-header"># Public Channel</header>
            <div id="messages"></div>
            <div id="input-area">
                <div class="input-box">
                    <input type="text" id="msgInput" placeholder="Message..." autocomplete="off" onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button onclick="sendMsg()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let heartbeat;
        let myUsername = "";
        let currentChat = "Public"; 
        let onlineUsers = [];

        window.onload = () => {
            const savedName = localStorage.getItem("pro_chat_name");
            if (savedName) document.getElementById("username").value = savedName;
        };

        function connect() {
            myUsername = document.getElementById("username").value.trim();
            if (!myUsername) return alert("Please enter a username");

            localStorage.setItem("pro_chat_name", myUsername);
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-container").style.display = "flex";

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/${myUsername}`);

            ws.onopen = () => {
                heartbeat = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
                }, 20000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === "history") {
                    if (data.target === currentChat) {
                        document.getElementById("messages").innerHTML = "";
                        data.data.forEach(m => drawMessage(m.sender, m.content));
                    }
                } 
                else if (data.type === "chat") {
                    if (currentChat === "Public" && data.receiver === "Public") {
                        drawMessage(data.sender, data.content);
                    } 
                    else if (currentChat !== "Public") {
                        if (data.sender === currentChat || (data.sender === myUsername && data.receiver === currentChat)) {
                            drawMessage(data.sender, data.content);
                        }
                    }
                } 
                else if (data.type === "user_list") {
                    onlineUsers = data.users;
                    renderSidebar();
                }
            };

            ws.onclose = () => {
                clearInterval(heartbeat);
                alert("Connection lost. Please refresh.");
            };
        }

        function renderSidebar() {
            const container = document.getElementById("user-list-container");
            
            let html = `
                <div class="user-item ${currentChat === 'Public' ? 'active' : ''}" onclick="switchChat('Public')">
                    <div class="status-dot" style="background:var(--accent);"></div>
                    <span>Public Channel</span>
                </div>
            `;
            
            onlineUsers.forEach(user => {
                if (user === myUsername) return; 
                html += `
                    <div class="user-item ${currentChat === user ? 'active' : ''}" onclick="switchChat('${user}')">
                        <div class="status-dot"></div>
                        <span>${user}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function switchChat(target) {
            currentChat = target;
            
            document.getElementById("chat-header").innerText = target === "Public" ? "# Public Channel" : `@ ${target}`;
            document.getElementById("msgInput").placeholder = `Message ${target}...`;
            
            renderSidebar();
            
            document.getElementById("messages").innerHTML = "";
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "get_history", target: currentChat }));
            }
        }

        function drawMessage(sender, text) {
            const msgs = document.getElementById("messages");
            const isMe = sender === myUsername;
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const div = document.createElement("div");
            div.className = `msg-wrapper ${isMe ? 'me' : 'other'}`;
            const infoText = isMe ? timeString : `${sender} • ${timeString}`;

            div.innerHTML = `
                <div class="msg-info">${infoText}</div>
                <div class="msg-bubble">${text}</div>
            `;
            
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ 
                    type: "chat", 
                    receiver: currentChat, 
                    content: text 
                }));
                input.value = "";
                input.focus(); 
            }
        }
    </script>
</body>
</html>
