<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IdlyCall - Modern Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. CSS VARIABLES & RESET
           ========================================= */
        :root {
            /* Dark Theme (Default) */
            --bg-primary: #0f0f11;
            --bg-secondary: #18181b;
            --bg-tertiary: #232328;
            --bg-glass: rgba(24, 24, 27, 0.85);
            --bg-input: #2a2a30;
            --accent-primary: #6366f1; /* Indigo */
            --accent-secondary: #818cf8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
            --online: #10b981;
            --offline: #4b5563;
            --danger: #ef4444;

            /* Own message bubble color */
            --msg-own-bg: #4f46e5;
            --msg-own-text: #ffffff;
            --msg-other-bg: var(--bg-secondary);
            --msg-other-text: var(--text-primary);

            /* Sizing */
            --sidebar-width: 280px;
            --input-height: 60px;
            --transition-speed: 0.3s;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-input: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --msg-own-bg: #6366f1;
            --msg-own-text: #ffffff;
            --msg-other-bg: #e2e8f0;
            --msg-other-text: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            /* Use dvh for dynamic viewport height to handle mobile keyboard properly */
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color var(--transition-speed) ease;
        }

        /* Background Decorative Elements */
        .bg-decoration {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
            transition: opacity var(--transition-speed);
        }
        .bg-decoration.one { top: -200px; left: -200px; background: var(--accent-primary); }
        .bg-decoration.two { bottom: -300px; right: -200px; background: #ec4899; }

        /* =========================================
           2. TYPOGRAPHY & SCROLLBAR
           ========================================= */
        h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* =========================================
           3. LOGIN SCREEN
           ========================================= */
        #login-screen {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-glow), var(--shadow-soft);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .logo-sub { font-size: 0.9rem; color: var(--text-secondary); }

        .avatar-upload-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
        }

        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-primary);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow-glow);
            background-color: var(--bg-tertiary);
            display: block;
        }

        .avatar-preview:hover {
            transform: scale(1.05);
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .avatar-upload-container:hover .avatar-overlay { opacity: 1; }
        .avatar-overlay svg { width: 24px; height: 24px; fill: white; }

        .input-group { margin-bottom: 20px; position: relative; }

        #login-screen input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #login-screen input[type="text"]::placeholder { color: var(--text-muted); }
        #login-screen input[type="text"]:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:active { transform: translateY(0); }

        /* =========================================
           4. APP LAYOUT
           ========================================= */
        #app-container {
            display: none;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        /* Flex container for Sidebar + Main */
        .app-layout {
            display: flex;
            height: 100%;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* =========================================
           5. SIDEBAR
           ========================================= */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform var(--transition-speed) ease;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .sidebar-header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }
        .sidebar-header-actions button:hover { background: var(--bg-tertiary); }
        .sidebar-header-actions svg { width: 20px; height: 20px; fill: currentColor; }

        .search-box {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: var(--bg-input);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            font-size: 0.9rem;
        }
        .search-box input:focus { border-color: var(--accent-primary); }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
        }

        .list-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 10px;
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .user-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            margin-bottom: 2px;
            transition: background 0.15s, color 0.15s;
            /* Larger touch target for mobile */
            min-height: 44px;
        }

        .user-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .user-item.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .user-avatar-wrapper {
            position: relative;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .user-item img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-primary);
            display: block;
        }

        .user-info { flex: 1; overflow: hidden; }
        .user-info .name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .user-info .status-text { font-size: 0.75rem; color: var(--text-muted); }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .status-online { background: var(--online); }
        .status-offline { background: var(--offline); }

        /* My Profile Footer - FIXED: explicit avatar sizing */
        .my-profile {
            padding: 15px 20px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            min-height: 60px;
        }
        .my-profile:hover { background: var(--bg-input); }

        /* FIX: Footer avatar must have explicit constrained size */
        .my-profile .user-avatar-wrapper img,
        #my-avatar-footer {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: var(--bg-primary);
            flex-shrink: 0;
        }

        /* =========================================
           6. CHAT AREA
           ========================================= */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            background-image: radial-gradient(circle at 50% 0%, var(--bg-secondary) 0%, transparent 60%);
            /* Fix for mobile viewport */
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .chat-header {
            padding: 0 25px;
            height: 70px;
            min-height: 70px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .chat-header-info { display: flex; align-items: center; gap: 15px; }
        .chat-header-info h2 { font-size: 1.1rem; font-weight: 600; }
        .chat-header-info span { color: var(--text-muted); font-size: 0.9rem; }

        .chat-header-actions { display: flex; gap: 10px; }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            /* Increase touch target */
            min-width: 44px;
            min-height: 44px;
        }
        .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Messages Container */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
            /* Allow proper scrolling on mobile keyboard open */
            position: relative;
            overscroll-behavior: contain;
        }

        .message-group {
            display: flex;
            padding: 4px 0;
            border-radius: var(--radius-sm);
            transition: background 0.1s;
            position: relative;
        }
        .message-group:hover { background: rgba(255,255,255,0.02); }

        /* =========================================
           6A. MESSAGE - OTHER USER (LEFT SIDE)
           ========================================= */
        .message {
            display: flex;
            gap: 15px;
            width: 100%;
            animation: msgSlide 0.3s ease-out;
        }

        .msg-avatar-spacer {
            width: 40px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 2px;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
            flex-shrink: 0;
        }
        .msg-avatar:hover { transform: scale(1.1); }

        .msg-content {
            flex: 1;
            max-width: calc(100% - 60px);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .msg-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }

        .msg-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            cursor: pointer;
        }
        .msg-name:hover { text-decoration: underline; }

        .msg-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Other user's bubble (left side) */
        .msg-bubble {
            background: var(--msg-other-bg);
            padding: 10px 15px;
            border-radius: 0 12px 12px 12px;
            display: inline-block;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            color: var(--msg-other-text);
            position: relative;
            border-top-left-radius: 4px;
            max-width: 100%;
        }

        /* =========================================
           6B. MESSAGE - OWN USER (RIGHT SIDE)
           ========================================= */
        .message-group.own-message {
            justify-content: flex-end;
        }

        .message-group.own-message .message {
            flex-direction: row-reverse;
            justify-content: flex-start;
        }

        .message-group.own-message .msg-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            max-width: calc(100% - 60px);
        }

        .message-group.own-message .msg-header {
            flex-direction: row-reverse;
        }

        .message-group.own-message .msg-bubble {
            background: var(--msg-own-bg);
            color: var(--msg-own-text);
            border-radius: 12px 0 12px 12px;
            border-top-right-radius: 4px;
        }

        .message-group.own-message .msg-bubble:hover {
            background: #5b50e0;
        }

        /* Own message reply context styling */
        .message-group.own-message .msg-reply-context {
            border-left: none;
            border-right: 2px solid var(--accent-secondary);
            padding-left: 0;
            padding-right: 10px;
            text-align: right;
        }

        /* Own message image styling */
        .message-group.own-message .msg-image {
            border-radius: 12px 0 12px 12px;
            border-top-right-radius: 4px;
        }

        /* =========================================
           6C. MESSAGE IMAGE SHARED
           ========================================= */
        .msg-image {
            max-width: 300px;
            border-radius: var(--radius-md);
            margin-top: 5px;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
        }
        .msg-image:hover { transform: scale(1.02); }

        /* Reply Logic */
        .msg-reply-context {
            border-left: 2px solid var(--accent-primary);
            padding-left: 10px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .msg-reply-context strong { color: var(--text-primary); }

        /* =========================================
           6D. FILE ATTACHMENT BUBBLE
           ========================================= */
        .file-bubble {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: var(--msg-other-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 300px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .file-bubble:hover {
            background: var(--bg-tertiary);
            transform: translateY(-2px);
        }
        .message-group.own-message .file-bubble {
            background: var(--msg-own-bg);
            border-color: rgba(255,255,255,0.2);
        }
        .message-group.own-message .file-bubble:hover {
            background: #5b50e0;
        }
        .file-icon {
            font-size: 2rem;
            line-height: 1;
        }
        .file-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            color: var(--text-primary);
        }
        .file-download-text {
            font-size: 0.75rem;
            color: var(--accent-secondary);
            margin-top: 2px;
        }
        .message-group.own-message .file-download-text {
            color: #c7d2fe;
        }

        /* Typing Indicator */
        #typing-indicator {
            position: absolute;
            bottom: 90px;
            left: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-soft);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 5;
        }
        #typing-indicator.visible { opacity: 1; transform: translateY(0); }

        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        /* Input Area */
        #input-area {
            padding: 15px 25px 20px 25px;
            background: var(--bg-primary);
            /* Ensure it stays above content when keyboard opens */
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .reply-preview {
            display: none;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-left: 3px solid var(--accent-primary);
            margin-bottom: -5px;
            position: relative;
        }
        .reply-preview.active { display: flex; justify-content: space-between; align-items: center; }
        .reply-preview .close-reply {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .input-action-btn {
            background: transparent;
            border: none;
            padding: 0 10px;
            color: var(--text-muted);
            cursor: pointer;
            height: 100%;
            display: flex;
            align-items: center;
            transition: color 0.2s;
            min-width: 44px;
            min-height: 44px;
            justify-content: center;
        }
        .input-action-btn:hover { color: var(--text-primary); }
        .input-action-btn svg { width: 22px; height: 22px; fill: currentColor; }

        #msgInput {
            flex: 1;
            padding: 14px 5px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            outline: none;
            font-size: 0.95rem;
            min-width: 0; /* Fix flex truncation */
        }
        #msgInput::placeholder { color: var(--text-muted); }

        .send-btn {
            background: var(--accent-gradient);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.8;
            flex-shrink: 0;
        }
        .send-btn:hover { opacity: 1; transform: scale(1.05); }
        .send-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

        /* =========================================
           7. MODALS (Settings, Image View, Emoji)
           ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-glow);
            transform: scale(0.9);
            transition: transform 0.3s;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h2 { font-size: 1.3rem; }
        .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; padding: 5px; }

        .settings-group {
            margin-bottom: 20px;
        }
        .settings-group h3 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            margin-bottom: 5px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-input);
            transition: .4s;
            border-radius: var(--radius-full);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background: var(--accent-primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Emoji Picker */
        .emoji-picker {
            position: absolute;
            bottom: 70px;
            left: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px;
            display: none;
            z-index: 150;
            box-shadow: var(--shadow-soft);
            animation: fadeIn 0.2s;
            max-width: 250px;

            /* Add these two lines right here! */
            max-height: 250px;
            overflow-y: auto;
        }
        .emoji-picker.active { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        .emoji-btn {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            padding: 5px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
            min-width: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .emoji-btn:hover { background: var(--bg-tertiary); }

        /* Image Lightbox */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 300;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .lightbox.active { opacity: 1; pointer-events: all; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 4px; }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
           8. ANIMATIONS
           ========================================= */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes msgSlide {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes msgSlideRight {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.6); }
            100% { box-shadow: 0 0 5px rgba(99, 102, 241, 0.3); }
        }

        /* Own message animation from right */
        .message-group.own-message .message {
            animation: msgSlideRight 0.3s ease-out;
        }

        /* =========================================
           9. MOBILE RESPONSIVENESS
           ========================================= */
        @media (max-width: 768px) {
            .bg-decoration { display: none; }

            .app-layout {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
            }

            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                width: 85vw; /* Slightly wider for mobile */
                max-width: 320px;
                transform: translateX(-100%);
                box-shadow: 5px 0 20px rgba(0,0,0,0.5);
                z-index: 200;
            }
            .sidebar.open { transform: translateX(0); }

            .chat-header-actions .desktop-only { display: none; }

            /* Constrain message widths on mobile so they don't span edge to edge */
            .msg-content {
                max-width: 80% !important;
            }
            .message-group.own-message .msg-content {
                max-width: 80% !important;
            }

            .msg-image { max-width: 100%; }

            #input-area {
                padding: 10px 15px 15px 15px;
                /* Safe area insets for notched phones at bottom */
                padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            }

            .input-wrapper {
                border-radius: var(--radius-md);
            }

            /* Mobile specific toggle button - 3 DOTS */
            .mobile-toggle {
                display: flex !important; /* Make it visible on mobile */
                background: none;
                border: none;
                color: var(--text-primary);
                cursor: pointer;
                margin-right: 10px;
                padding: 5px;
                width: 44px;
                height: 44px;
                align-items: center;
                justify-content: center;
            }

            .mobile-toggle svg {
                width: 24px;
                height: 24px;
                fill: currentColor;
            }

            /* Chat area takes full height on mobile */
            .chat-area {
                width: 100%;
                height: 100%;
            }

            /* Adjust typing indicator for mobile keyboards */
            #typing-indicator {
                bottom: 80px;
                left: 10px;
            }
            
            /* Emoji picker adjustments for mobile */
            .emoji-picker {
                left: 10px;
                right: 10px;
                max-width: none;
                width: auto;
                bottom: 75px;
            }
            .emoji-picker.active {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        /* Small phone adjustments */
        @media (max-width: 400px) {
            .chat-header {
                padding: 0 15px;
            }
            #messages {
                padding: 15px;
            }
            .msg-avatar {
                width: 32px;
                height: 32px;
            }
            .msg-avatar-spacer {
                width: 32px;
            }
            .msg-content {
                max-width: calc(100% - 45px) !important;
            }
            .message-group.own-message .msg-content {
                max-width: calc(100% - 45px) !important;
            }
            .msg-header {
                gap: 5px;
            }
        }

        /* Utility to hide elements - used only for JS toggling, NOT for initial mobile states */
        .hidden { display: none !important; }

        /* Default state for mobile toggle on Desktop */
        @media (min-width: 769px) {
            .mobile-toggle {
                display: none !important;
            }
        }

        /* =========================================
           10. ADDITIONAL UI REFINEMENTS
           ========================================= */

        /* Scrollbar for message area */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

        /* Focus visible outline for accessibility */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        /* Smooth transitions for theme switching */
        .sidebar,
        .chat-area,
        .chat-header,
        #input-area,
        .msg-bubble,
        .user-item,
        .modal-content,
        .setting-item {
            transition: background-color var(--transition-speed) ease,
                        color var(--transition-speed) ease,
                        border-color var(--transition-speed) ease;
        }

        /* Date separator between messages */
        .date-separator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .date-separator::before,
        .date-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
            margin: 0 15px;
        }

        /* Connection status indicator at top of sidebar */
        .connection-status {
            padding: 8px 20px;
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .connection-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--online);
            animation: pulseGlow 2s infinite;
        }
        .connection-dot.disconnected {
            background: var(--danger);
            animation: none;
        }

        /* Empty state styling */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 10px;
        }
        .empty-state-icon {
            font-size: 3rem;
            opacity: 0.5;
        }
        .empty-state-text {
            font-size: 1rem;
            text-align: center;
            line-height: 1.6;
        }

        /* Welcome message in chat */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .welcome-message h3 {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .welcome-message p {
            font-size: 0.9rem;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Context menu for messages */
        .context-menu {
            position: fixed;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft);
            z-index: 250;
            min-width: 160px;
            padding: 5px 0;
            display: none;
        }
        .context-menu.active { display: block; }
        .context-menu-item {
            padding: 10px 16px; /* Larger touch target */
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: background 0.1s, color 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .context-menu-item:hover {
            background: var(--accent-primary);
            color: white;
        }
        .context-menu-item.danger:hover {
            background: var(--danger);
        }

        /* Tooltip for icons */
        [data-tooltip] {
            position: relative;
        }
        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            border: 1px solid var(--border-color);
        }
        [data-tooltip]:hover::after {
            opacity: 1;
        }

        /* Selection color */
        ::selection {
            background: var(--accent-primary);
            color: white;
        }

        /* Placeholder text consistency */
        input::placeholder,
        textarea::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }

        /* Notification toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-primary);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft);
            color: var(--text-primary);
            font-size: 0.9rem;
            animation: slideInRight 0.3s ease-out;
            max-width: 300px;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--online); }

        /* Fix: Ensure avatar images in all contexts are constrained */
        img.msg-avatar,
        img.avatar-preview,
        .user-item img,
        #my-avatar-footer,
        .my-profile img {
            border-radius: 50%;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }

        /* Override: login preview is larger */
        img.avatar-preview {
            width: 100px;
            height: 100px;
        }

        /* Override: message avatar is 40px */
        img.msg-avatar {
            width: 40px;
            height: 40px;
        }

        /* Override: sidebar avatars */
        .user-item img,
        .my-profile .user-avatar-wrapper img,
        #my-avatar-footer {
            width: 36px;
            height: 36px;
        }

        /* Sidebar overlay for mobile */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 199;
            display: none;
        }
        .sidebar-overlay.active {
            display: block;
        }
        
        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- Decorative Background -->
    <div class="bg-decoration one"></div>
    <div class="bg-decoration two"></div>

    <!-- Toast Container for Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Context Menu -->
    <div class="context-menu" id="context-menu">
    <div class="context-menu-item" onclick="contextReply()">

    </div>
    <div class="context-menu-item" onclick="contextForward()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 15V3"/></svg> Forward
    </div>
    <div class="context-menu-item" onclick="contextPin()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 12H19"/><path d="M7 12V6a5 5 0 0 1 10 0v6"/></svg> Pin

    </div>
</div>
    </div>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebarMobile()"></div>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">

        </div>

        <div class="avatar-upload-container">

                <div class="avatar-overlay">
                    <svg viewBox="0 0 24 24"><path d="M12 16l-6-6h12z"/></svg>

            <input type="file" id="login-file" accept="image/*" style="display:none;" onchange="processImage(event, 'login-preview')">
        </div>

        <div class="input-group">

                            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="connection-status" id="connection-status">
                    <div class="connection-dot" id="connection-dot"></div>
                    <span id="connection-text">Connecting...</span>
                </div>

                <div class="search-box">
                    <input type="text" placeholder="Find or start a conversation" id="searchInput" oninput="filterUsers()">

                <div class="user-list" id="user-list-container">

                </div>

                        <div class="status-text">Online</div>
                    </div>

            </div>

            <!-- Chat Area -->
            <div class="chat-area" onclick="closeSidebarMobile()">
                <header class="chat-header">
                    <div class="chat-header-info">
                        <!-- 3-DOT Menu for Mobile -->
                        <button class="mobile-toggle" onclick="event.stopPropagation(); toggleSidebar()">
                            <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        </button>
                        <h2 id="chat-header-title"># Public Lobby</h2>
                        <span id="chat-header-subtitle">General Chat</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn desktop-only" onclick="forceSync()" title="Sync" data-tooltip="Sync">
                            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        </button>
                    </div>
                </header>

                <div id="messages">
                    <!-- Messages injected here -->
                </div>

                <div id="typing-indicator">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span id="typing-text">Someone is typing</span>

                <div id="input-area">
                    <div class="reply-preview" id="reply-preview">
                        <div>
                            <small>Replying to <strong id="reply-to-name"></strong></small>
                            <div id="reply-to-text" style="font-size:0.85rem; color:var(--text-muted); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div>

                    </div>

                    <div class="input-wrapper">
                        <label for="imageAttachInput" class="input-action-btn" title="Attach Image">
                            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        </label>
